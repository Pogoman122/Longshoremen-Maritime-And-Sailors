l_korean:
 TREATY_NAME_HUNKAR_ISKELESI:0 "훈카르 이스켈레시 조약"
 hunkar_iskelesi:0 "훈카르 이스켈레시 협정"
 hunkar_iskelesi_desc:0 "러시아-오스만 협정은 터키 해협 통항 문제를 유럽 외교의 중심에 놓습니다."
 hunkar_iskelesi_article_short_desc:0 "해협 회의가 열릴 때까지 기존 러시아-오스만 협정을 유지합니다."
 hunkar_iskelesi_effects_desc:0 "협정은 러시아-오스만 관계를 개선하며 해협 회의가 열릴 때까지 효력을 유지합니다."
 lsm_hunkar_not_superseded_tt:0 "해협 회의가 아직 훈카르 이스켈레시 협정을 대체하지 않았습니다."
 je_straits_question:0 "해협 문제"
 je_straits_question_reason:0 "영국, 프랑스, 오스트리아, 프로이센, 러시아는 터키 해협에 대한 합의를 선택할 6개월의 시간을 갖습니다. 각 대표단은 한 표를 던집니다. 행사되지 않은 표는 투표가 끝날 때 배정됩니다. 이후 오스만 정부는 승리한 협약을 수락하거나 거부할 6개월을 가지며, 침묵은 수락으로 간주됩니다. 각 열강이 유럽의 안정을 유지하고자 하더라도 어떤 결과는 예상치 못한 결과를 낳을 수 있습니다..."
 je_straits_question_status:0 "보스포루스와 다르다넬스 통항에 관한 합의."
 lsm_straits_conference_open_tt:0 "훈카르 이스켈레시 협정이 종료되고 해협 회의가 열렸습니다."
 lsm_straits_ballot_complete_tt:0 "대표단이 승리한 제안을 선택했습니다."
 lsm_straits_settlement_accepted_tt:0 "오스만 정부가 협약을 수락했거나 오스만의 주권이 유지되었습니다."
 lsm_straits_settlement_rejected_tt:0 "제안된 합의가 거부되었거나 더 이상 체결할 수 없습니다."
 lsm_straits_voting_open_tt:0 "6개월 투표 기간이 아직 진행 중입니다."
 lsm_straits_not_voted_tt:0 "우리 대표단은 아직 투표하지 않았습니다."
 lsm_straits_russia_exists_tt:0 "러시아가 존재하며 제안된 통항권을 받을 수 있습니다."
 lsm_straits_ottoman_decision_pending_tt:0 "오스만 정부는 아직 승리한 제안을 수락하거나 거부하지 않았습니다."
 lsm_straits_human_withdrawal_tt:0 "AI가 조종하는 서명국은 이 협정에서 자발적으로 탈퇴하지 않습니다."
 straits_ancient_rule_button:0 "전통 원칙 확인"
 straits_ancient_rule_button_desc:0 "외국 군함을 터키 해협에서 배제하도록 요구하는 협약을 지지합니다. 수락되면 오스만 정부는 참가 열강과 협약을 체결합니다. AI가 조종하는 오스만 정부는 통항을 통제국에 한정하는 군사 폐쇄를 우선하며, 플레이어가 조종하는 오스만 정부는 조건을 수동으로 준수해야 합니다. 기존 조약의 통항 예외는 계속 적용됩니다."
 straits_open_passage_button:0 "모든 국가에 자유 통항"
 straits_open_passage_button_desc:0 "오스만 정부가 어느 국가에도 해협을 폐쇄하지 못하도록 하는 구속력 있는 협약을 지지합니다. 통항 보장은 이 회의에 참가하지 않은 국가에도 적용됩니다. 통행료는 폐지되지 않습니다."
 straits_russian_entente_button:0 "러시아의 입장 수용"
 straits_russian_entente_button_desc:0 "러시아 해군의 통항과 다른 외국 군함의 배제를 지지합니다. 러시아는 조약상 통항 예외를 받습니다. AI가 조종하는 오스만 정부는 통항을 통제국에 한정하는 군사 폐쇄를 우선하지만 러시아는 예외를 유지합니다. 플레이어가 조종하는 오스만 정부는 폐쇄를 수동으로 시행해야 하며, 다른 기존 통항 예외도 계속 적용됩니다."
 straits_ottoman_prerogative_button:0 "숭고한 문의 주권"
 straits_ottoman_prerogative_button_desc:0 "터키 해협 통항을 오스만 정부의 판단에 맡깁니다. 이 제안이 승리하면 회의는 새 조약을 만들거나 통항권을 강제하지 않고 끝납니다."
 lsm_straits_vote_ancient_rule_tt:0 "전통 원칙에 표를 던집니다. 이 투표는 회의가 끝나기 전에 협약을 강제하지 않습니다."
 lsm_straits_vote_open_passage_tt:0 "모든 국가에 보장되는 통항에 표를 던집니다."
 lsm_straits_vote_russian_entente_tt:0 "러시아의 통항 특권에 표를 던집니다."
 lsm_straits_vote_ottoman_prerogative_tt:0 "오스만 주권과 새 조약 없음에 표를 던집니다."
 straits_conference_approve_button:0 "협약 수락"
 straits_conference_approve_button_desc:0 "승리한 제안을 수락하고 남아 있는 회의 참가 열강과 해당 협정을 체결합니다. 협정에는 5년의 의무기간이 있습니다."
 straits_conference_reject_button:0 "협약 거부"
 straits_conference_reject_button_desc:0 "승리한 제안을 거부합니다. 회의는 무산되고 새로운 협약 조약은 만들어지지 않습니다."
 lsm_straits_accept_settlement_tt:0 "승리한 제안이 요구하는 협정을 체결합니다."
 lsm_straits_reject_settlement_tt:0 "새 협약을 만들지 않고 회의를 끝냅니다."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "런던 해협 협약: 전통 원칙"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "런던 해협 협약: 자유 통항"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "런던 해협 협약: 러시아 특권"
 straits_question_events.1.t:0 "해협 문제"
 straits_question_events.1.d:0 "훈카르 이스켈레시 협정이 대체되면서 보스포루스와 다르다넬스를 통해 누가 군함을 보낼 수 있는지에 대한 문제가 다시 제기됩니다. 영국, 프랑스, 오스트리아, 프로이센, 러시아는 오스만 정부가 검토할 합의를 제시할 것입니다."
 straits_question_events.1.f:0 "대표단은 제안에 합의할 6개월의 시간을 갖습니다."
 straits_question_events.1.a:0 "회의를 연다."
 straits_question_events.4.t:0 "런던 협약"
 straits_question_events.4.t_sovereignty:0 "오스만 정부가 통제권을 유지하다"
 straits_question_events.4.d1:0 "오스만 정부와 참가 열강은 전통 원칙을 확인하는 협약을 체결했습니다. 외국 군함은 터키 해협에서 배제되며 상선은 자유롭게 통항할 수 있습니다. 오스만 정부는 군사 폐쇄를 유지할 책임을 집니다."
 straits_question_events.4.d2:0 "회의는 러시아의 통항 특권을 인정했습니다. 러시아는 오스만이 통제하는 해협에서 보장된 해군 통항권을 얻고, 관련 협약은 다른 외국 해군의 배제를 요구합니다. 오스만 정부는 이를 집행할 책임이 있습니다."
 straits_question_events.4.d3:0 "오스만 정부는 모든 국가에 자국 해협 통항을 보장하는 협약을 수락했습니다. 이 협정들이 효력을 유지하는 동안 오스만 정부는 해협을 폐쇄할 수 없습니다. 회의 서명국 이외의 국가에도 통항이 보장됩니다."
 straits_question_events.4.d4:0 "열강은 터키 해협 통항에 대한 오스만의 통제권을 인정했습니다. 새로운 협약 조약은 만들어지지 않았으며 어떤 외국 정부도 이 합의로 통항권을 얻지 못합니다. 접근 허용 여부는 술탄의 재량에 남습니다."
 straits_question_events.4.f:0 "대표단은 업무를 마쳤습니다."
 straits_question_events.4.a:0 "회의가 종료되었습니다."
 straits_question_events.5.t:0 "해협 회의가 무산되다"
 straits_question_events.5.d:0 "제안된 합의는 타결에 이르지 못했습니다. 새로운 협약은 체결되지 않았고 터키 해협 통항 문제는 미해결 상태로 남았습니다."
 straits_question_events.5.f:0 "대표단은 합의 없이 떠납니다."
 straits_question_events.5.a:0 "합의는 없다."
 lsm_straits_ancient_rule:0 "전통 원칙"
 lsm_straits_ancient_rule_desc:0 "오스만 정부는 터키 해협을 외국 군함에 폐쇄하기로 약속합니다."
 lsm_straits_ancient_rule_article_short_desc:0 "오스만 정부는 터키 해협을 외국 군함에 폐쇄하기로 약속합니다."
 lsm_straits_ancient_rule_effects_desc:0 "AI가 조종하는 오스만 정부는 협약 조항이 효력을 유지하는 동안 통항을 통제국에 한정하는 군사 폐쇄를 우선합니다. 무역은 계속 개방되며 조약상 통항 예외도 적용됩니다. 플레이어가 조종하는 오스만 정부는 군사 폐쇄를 수동으로 설정해야 합니다."
 lsm_straits_open_passage:0 "모든 국가에 자유 통항"
 lsm_straits_open_passage_desc:0 "오스만 정부는 모든 국가에 자국 해협 통항을 보장합니다."
 lsm_straits_open_passage_article_short_desc:0 "오스만 정부는 모든 국가에 자국 해협 통항을 보장합니다."
 lsm_straits_open_passage_effects_desc:0 "이 조항이 효력을 유지하는 동안 원천 국가는 자국 해협을 폐쇄할 수 없습니다. 회의 밖의 국가를 포함한 모든 국가에 적용됩니다. 통행료는 면제되지 않습니다."
 lsm_straits_russian_entente:0 "러시아 특권 승인"
 lsm_straits_russian_entente_desc:0 "열강은 러시아의 통항 특권을 인정하고 다른 외국 군함의 배제를 요구합니다."
 lsm_straits_russian_entente_article_short_desc:0 "열강은 러시아의 통항 특권을 인정하고 다른 외국 군함의 배제를 요구합니다."
 lsm_straits_russian_entente_effects_desc:0 "AI가 조종하는 오스만 정부는 협약 조항이 효력을 유지하는 동안 통항을 통제국에 한정하는 군사 폐쇄를 우선합니다. 러시아는 러시아 해군 통항 조항에 따라 통항 예외를 받습니다. 다른 조약 예외도 계속 적용됩니다. 플레이어가 조종하는 오스만 정부는 군사 폐쇄를 수동으로 설정해야 합니다."
 lsm_straits_russian_access:0 "러시아 해군 통항"
 lsm_straits_russian_access_desc:0 "오스만 정부는 러시아에 오스만 통제 해협을 통한 해군 통항을 허용합니다."
 lsm_straits_russian_access_article_short_desc:0 "오스만 정부는 러시아에 오스만 통제 해협을 통한 해군 통항을 허용합니다."
 lsm_straits_russian_access_effects_desc:0 "원천 국가는 대상 국가에 자국 해협을 통한 군사 통항을 허용합니다. 이는 육상 군사 통행권을 부여하지 않으며 제3국의 통항을 자동으로 폐쇄하지도 않습니다."
