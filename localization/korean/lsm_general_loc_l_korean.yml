l_korean:
 revolution_pulse1_events.8.t: "선원들이 육지에 남다"
 revolution_pulse1_events.8.d: "[SCOPE.sState('coastal_navy_state').GetName]의 [GetPopType('sailors').GetName]들이 항구 밖으로 나가는 모든 항해에 승선하기를 거부했습니다. 반란의 규모를 고려하면 상황을 신중하게 다뤄야 합니다."
 revolution_pulse1_events.8.f: ""아주 간단합니다. 우리에게는 요구사항이 있습니다. 그것들이 받아들여질 때까지 출항하지 않겠습니다.""
 revolution_pulse1_events.8.a: "사람들을 구금하고 사건이 [SCOPE.sState('coastal_navy_state').GetName] 밖으로 번지지 않게 한다."
 revolution_pulse1_events.8.b: "강제로 사람들을 배에 태운다."
 revolution_pulse1_events.8.c: "[GetPopType('sailors').GetName]들과 대화로 해결해 본다."
 revolution_lsm_events.1.t: "혁명가들이 반란을 일으키다"
 revolution_lsm_events.1.d: "[SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName]와 연계되었다는 소문이 있는 혁명가 무리가 [SCOPE.sState('lsm_ship_mutiny_state').GetName]의 선원들을 제압해 스무여 명을 죽이고 무장 선박 한 척을 빼앗아 바다로 나갔습니다."
 revolution_lsm_events.1.f: "#bold 수배: 선박 절도범#! \n\n[SCOPE.sState('coastal_navy_state').GetName]에서 선박 절도에 30명 이상이 가담한 것으로 추정됩니다. 생포 또는 사살된 사람 한 명당 £200, 범인의 체포나 사망으로 이어지는 정보에는 £50을 지급합니다.\n\n무장하고 있으며 위험한 것으로 판단됩니다. 협조자도 동일한 죄를 묻습니다."
 revolution_lsm_events.1.a: "항구를 샅샅이 뒤진다."
 revolution_lsm_events.1.b: "대신 어장을 수색한다."
 lsm_events.1.t:0 "어둠 속의 조난"
 lsm_events.1.d:0 "부두 노동자들을 태운 연락선이 [SCOPE.sState('lsm_lighthouse_accident_state').GetName]의 불이 밝혀지지 않은 항구 진입로에서 암초에 부딪혔습니다. 약 150명의 부두 노동자가 익사했습니다."
 lsm_events.1.f:0 "구조대가 시신을 육지로 옮기는 동안 유족들은 부두에서 기다립니다. 생존자들은 승무원들이 어둠 속에서 방향을 잃었다고 말합니다. 진입로를 표시하는 등대가 없어 충돌 직전에야 바위를 발견했습니다."
 lsm_events.1.a:0 "무언가 조치를 취해야 할지도 모른다."
 lsm_events.1.deaths_tt:0 "[SCOPE.sState('lsm_lighthouse_accident_state').GetName]에서 약 #N 150#!명의 부두 노동자가 사망했습니다."
 modifier_scouring_ports: "항구 수색"
 modifier_scouring_fisheries: "어장 수색"
 lsm_admirals.1.t:0 "진급할 때가 되다"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]에서 [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName]의 진급을 요구하며 [SCOPE.sCharacter('low_rank_admiral').GetHerHis] 충성스럽고 유능한 복무 경력을 내세우고 있습니다."
 lsm_admirals.1.f:1 "[SCOPE.sCharacter('low_rank_admiral').GetHerHis] 제복에는 천이 거의 보이지 않을 만큼 많은 훈장이 달려 있었지만, 아직 충분하지 않았습니다. 자부심에 가슴을 편 [SCOPE.sCharacter('low_rank_admiral').GetSheHe]는 [SCOPE.sCharacter('high_rank_admiral').GetRankName] [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting]이 [SCOPE.sCharacter('low_rank_admiral').GetHerHis] 임박한 승진 소식을 들었을 때 지을 표정을 상상하며 미소 지었습니다. 두 사람의 경쟁은 장교들 사이에서 전설적이었습니다.\n\n마침내 [SCOPE.sCharacter('low_rank_admiral').GetSheHe]는 [SCOPE.sCharacter('low_rank_admiral').GetHerHis] 몫을 받게 될 것입니다."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName]에게는 그럴 자격이 있다."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]가 우리에게 결정을 강요하게 둘 수는 없다."
 low_rank_admiral_ig_opinion_add:0 "유력한 제독 진급"
 low_rank_admiral_ig_opinion_remove:0 "제독 진급 거부"
 high_rank_admiral_ig_opinion_add:0 "경쟁자의 진급 저지"
 denied_promotion:0 "진급 거부"
 lsm_canal_events.1.t:0 "웰랜드 운하 완공"
 lsm_canal_events.1.d:0 "수년간의 굴착, 갑문 건설, 토목 공사를 거쳐 웰랜드 운하가 마침내 개통되었습니다. 이제 선박들은 나이아가라 폭포라는 거대한 장애물을 우회해 온타리오호와 상류 오대호를 오갈 수 있습니다."
 lsm_canal_events.1.f:0 "운하의 개통으로 오대호는 하나로 이어진 상업 수로가 되었습니다. 목재, 곡물, 광석, 공산품, 승객을 실은 선박은 이제 나이아가라 일대에서 화물을 내리지 않고 내륙 호수와 온타리오호의 항구 사이를 항해할 수 있습니다. 한때 서로 떨어진 내해들의 연속이었던 이 지역은 점차 하나의 국제 해운망으로 변하며 영국령 북아메리카와 미국의 성장하는 정착지와 산업을 연결하고 있습니다."
 lsm_canal_events.1.a:0 "오대호가 상업에 개방되었다."
 mobilization_option_rail_transport: "철도 수송"
 mobilization_option_rail_transport_desc: "국가 비용으로 병사들이 기차를 이용하게 합니다."
