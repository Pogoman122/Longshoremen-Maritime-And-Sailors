l_korean:
 lsm_rb_journal_group:0 "해양 협정"
 lsm_je_rush_bagot:0 "Rush–Bagot 협정"
 lsm_je_rush_bagot_reason:0 "1817년의 협정은 오대호와 챔플레인호에서 영국과 미국의 해군 군비를 제한했습니다. 그 약속은 몇 척의 경무장 선박만 호수에 둘 수 있는 평화로운 국경이었습니다.\n\n우리는 온타리오, 오하이오, 미시간, 인디애나, 일리노이, 위스콘신, 미네소타에서 새로운 해군 기지를 제한함으로써 이 합의를 유지합니다. 상업항과 민간 해운은 계속 개방됩니다. 이 협정은 미국과 북쪽 해안의 영국 또는 캐나다 당국을 구속합니다.\n\n관계가 심각하게 악화되면 서명국이 6개월 전에 탈퇴를 통보할 수 있습니다. 양측 간 전쟁이 벌어지면 제한은 중지됩니다. 이후 협정을 갱신하려면 군축과 모든 주권 서명국의 동의가 필요합니다."
 lsm_je_rush_bagot_status:0 "Rush–Bagot 협정의 조건을 검토하고 있습니다."
 lsm_rb_naval_restrictions:0 "Rush–Bagot 해군 제한"
 lsm_rb_naval_restrictions_desc:0 "Rush–Bagot 협정은 이 해안의 해군 기지 확장을 제한합니다. 상업항은 계속 개방됩니다."
 lsm_rb_status_active:0 "#P 협정 발효 중#!\n대상 호수 주에서 새로운 해군 기지가 제한됩니다. 상업항은 계속 개방됩니다."
 lsm_rb_status_notice:0 "#Y 탈퇴 통보#!\n한 서명국이 6개월 전 통보를 했습니다. 양측 간 전쟁이 일어나지 않는 한 통보기간이 끝날 때까지 제한은 계속 효력을 가집니다."
 lsm_rb_status_war:0 "#N 서명국 간 전쟁#!\n해군 제한이 해제되었습니다. 평화가 찾아온 것만으로 협정이 복원되지는 않습니다."
 lsm_rb_status_lapsed:0 "#Y 협정 미발효#!\n양측은 재무장할 수 있습니다. 협정 갱신에는 평화로운 관계, 대상 주의 해군 기지 철거, 모든 주권 서명국의 동의가 필요합니다."
 lsm_rb_status_no_counterpart:0 "협정에 적격한 상대가 없습니다. 해군 제한이 해제되었습니다. 적격 서명국이 다시 생기면 새로운 협정을 협상해야 합니다."
 lsm_rb_status_breach:0 "#N 호수에 해군 기지가 남아 있음#!\n협정은 계속 발효 중이지만 대상 주의 기존 해군 기지는 철거해야 합니다. 추가 확장은 제한됩니다."
 lsm_rb_status_our_consent:0 "#Y 다른 서명국을 기다리는 중#!\n우리는 갱신에 동의했습니다. 갱신 조건이 계속 충족되는 동안 우리의 제안은 6개월 동안 유효합니다."
 lsm_rb_status_offer:0 "#Y 갱신 제안됨#!\n최소 한 서명국이 협정 갱신을 제안했습니다. 모든 주권 서명국이 각자 동의해야 합니다."
 lsm_rb_notice_button_name:0 "탈퇴 통보"
 lsm_rb_notice_button_desc:0 "협정의 6개월 탈퇴 조항을 발동합니다. 이는 관계를 악화시키며 통보기간이 끝난 뒤 해군 재무장의 길을 엽니다."
 lsm_rb_notice_requirements_tt:0 "우리는 주권 서명국이어야 하고 협정이 발효 중이어야 하며, 상대 서명국과의 관계가 −50 이하이어야 합니다. 양측은 서로 전쟁 중이어서는 안 됩니다."
 lsm_rb_notice_effect_tt:0 "6개월 전 탈퇴 통보를 합니다. 그 기간 동안 해군 제한은 계속됩니다. 상대 서명국 또는 서명국들과의 관계가 10 하락합니다. 통보기간이 끝나면 모든 당사자가 협정에서 벗어납니다."
 lsm_rb_renewal_button_name:0 "협정 갱신에 동의"
 lsm_rb_renewal_button_desc:0 "평화적 합의를 복원하자고 제안합니다. 모든 주권 서명국이 동의해야 협정이 발효됩니다."
 lsm_rb_renewal_requirements_tt:0 "우리는 주권 서명국이어야 하며 협정이 실효된 상태여야 하고 서명국끼리 평화 상태여야 합니다. 상대 서명국과의 관계는 최소 0이어야 합니다. 어떤 참가국도 대상 호수 주에 해군 기지를 보유해서는 안 됩니다. 이미 대기 중인 제안이 있어서는 안 됩니다."
 lsm_rb_renewal_effect_tt:0 "6개월 동안 갱신에 대한 우리의 동의를 제공합니다. 모든 주권 서명국이 동의하면 해군 기지 제한이 다시 적용됩니다. 전쟁, 관계 악화, 호수에서의 재무장은 대기 중인 동의를 무효화합니다."
 lsm_rush_bagot.1.t:0 "호수의 통보"
 lsm_rush_bagot.1.d:0 "한 서명국이 Rush–Bagot 협정의 탈퇴 조항을 발동했습니다. 6개월 통보기간이 시작되었습니다. 기간이 끝날 때까지 해군 제한은 계속 구속력을 가집니다."
 lsm_rush_bagot.1.f:0 "전보는 배 한 척을 무장시키는 것보다 빠르게 도착합니다. 양쪽 해안에서 대신들이 달을 셉니다."
 lsm_rush_bagot.1.a:0 "협정은 아직 우리를 구속한다 — 지금은."
 lsm_rush_bagot.2.t:0 "통보기간 만료"
 lsm_rush_bagot.2.d:0 "탈퇴 통보기간이 끝났습니다. Rush–Bagot 해군 제한이 해제되어 서명국들은 호수 주에 해군 기지를 자유롭게 세울 수 있습니다."
 lsm_rush_bagot.2.f:0 "호수의 상업을 위해 쓰이던 같은 조선소가 이제 다른 목적에 쓰일 수 있습니다."
 lsm_rush_bagot.2.a:0 "호수의 새로운 장이 열린다."
 lsm_rush_bagot.3.t:0 "전시의 호수"
 lsm_rush_bagot.3.d:0 "전쟁으로 Rush–Bagot 협정의 당사자들이 서로 적대하는 편에 서게 되었습니다. 해군 제한은 중지되고, 대기 중인 모든 탈퇴 통보나 갱신 제안은 취소됩니다."
 lsm_rush_bagot.3.f:0 "한때 화물로 가늠하던 국경을 다시 대포로 가늠합니다."
 lsm_rush_bagot.3.a:0 "전쟁을 준비한다."
 lsm_rush_bagot.4.t:0 "군축 없는 평화"
 lsm_rush_bagot.4.d:0 "조약 당사자 간 전쟁이 끝났습니다. 해군 제한은 여전히 해제된 상태입니다. 협정을 복원하려면 대상 호수 주의 기지를 철거하고 모든 주권 서명국의 새로운 동의를 확보해야 합니다."
 lsm_rush_bagot.4.f:0 "휴전은 포성을 멎게 할 수 있습니다. 그러나 대포를 육지로 내리려면 또 다른 협정이 필요합니다."
 lsm_rush_bagot.4.a:0 "협상 테이블로 돌아갈 수 있다."
 lsm_rush_bagot.5.t:0 "Rush–Bagot 갱신 제안"
 lsm_rush_bagot.5.d:0 "한 서명국이 협정 갱신을 제안했습니다. 참여하려면 Rush–Bagot 일지 항목에 동의를 기록할 수 있습니다. 모든 주권 서명국이 동의해야 하며 각 제안은 6개월 후 만료됩니다."
 lsm_rush_bagot.5.f:0 "오래된 서신이 기록보관소에서 꺼내졌습니다. 새 서명이 들어갈 자리가 있습니다."
 lsm_rush_bagot.5.a:0 "제안을 검토한다."
 lsm_rush_bagot.6.t:0 "평화적 합의 복원"
 lsm_rush_bagot.6.d:0 "모든 주권 서명국이 Rush–Bagot 체제를 갱신하기로 합의했습니다. 대상 호수 주에서 해군 기지 제한이 다시 적용됩니다. 호수의 상업 교통은 계속 자유롭게 성장할 수 있습니다."
 lsm_rush_bagot.6.f:0 "호수의 선장들은 날씨와 얕은 물, 수익성 있는 화물을 살핍니다. 지금은 그것으로 충분합니다."
 lsm_rush_bagot.6.a:0 "호수가 계속 평화롭기를."
 lsm_rush_bagot.7.t:0 "호수의 해군 군비"
 lsm_rush_bagot.7.d:0 "Rush–Bagot 제한 대상 주에 해군 기지를 보유하고 있습니다. 협정을 준수하려면 이 기지들을 철거해야 합니다. 추가 확장은 제한되며 상업항은 계속 운영할 수 있습니다."
 lsm_rush_bagot.7.f:0 "전보는 간단한 질문을 던집니다. 왜 아직도 우리 해안에서 군함을 무장시키고 있는가?"
 lsm_rush_bagot.7.a:0 "호수 시설을 재검토한다."
 lsm_rb_naval_construction_allowed_tt:0 "Rush–Bagot 협정이 이 주의 해군 건설을 허용해야 합니다."
