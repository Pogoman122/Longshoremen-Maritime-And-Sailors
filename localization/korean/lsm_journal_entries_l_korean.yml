l_korean:
 je_welland_canal:0 "웰랜드 운하 건설"
 je_welland_canal_reason:0 "나이아가라 폭포를 우회하는 운하는 온타리오호와 이리호 사이에 항행 가능한 연결로를 만들 것입니다. 이 사업에는 상당한 공공 지출과 수년간의 토목 공사가 필요합니다."
 lsm_begin_welland_canal_button:0 "건설 시작"
 lsm_begin_welland_canal_button_desc:0 "웰랜드 운하 건설을 시작합니다. 이 사업은 약 8년 동안 매주 £5,000의 비용이 듭니다."
 je_welland_canal_construction:0 "웰랜드 운하 건설"
 je_welland_canal_construction_reason:0 "나이아가라 폭포를 우회해 온타리오호와 이리호를 잇는 운하 공사가 진행 중입니다."
 je_welland_canal_progress:0 "웰랜드 운하의 계획과 건설에는 최대 8년이 걸릴 것으로 예상됩니다."
 
