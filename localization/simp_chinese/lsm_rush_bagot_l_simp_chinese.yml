l_simp_chinese:
 lsm_rb_journal_group:0 "海事协定"
 lsm_je_rush_bagot:0 "拉什–巴戈特协定"
 lsm_je_rush_bagot_reason:0 "1817年的协定限制了英国和美国在五大湖及尚普兰湖的海军军备。它所承诺的是一条和平边界，湖面上只允许少数轻武装船只存在。\n\n我们通过限制在安大略、俄亥俄、密歇根、印第安纳、伊利诺伊、威斯康星和明尼苏达新建海军基地来维持这一安排。商港与民用航运继续开放。该协定约束美国以及北岸的英国或加拿大当局。\n\n关系严重恶化时，签署方可以提前六个月通知退出。双方一旦开战，限制即暂停。战后若要恢复协定，则必须解除武装并获得所有主权签署方同意。"
 lsm_je_rush_bagot_status:0 "正在审议拉什–巴戈特协定的条款。"
 lsm_rb_naval_restrictions:0 "拉什–巴戈特海军限制"
 lsm_rb_naval_restrictions_desc:0 "拉什–巴戈特协定限制这些湖岸海军基地的扩张。商港继续开放。"
 lsm_rb_status_active:0 "#P 协定生效中#!\n受涵盖的湖区州不得新建海军基地。商港继续开放。"
 lsm_rb_status_notice:0 "#Y 退出通知#!\n一名签署方已提前六个月发出通知。除非双方爆发战争，否则限制将在通知期结束前继续有效。"
 lsm_rb_status_war:0 "#N 签署方之间爆发战争#!\n海军限制已解除。仅仅恢复和平并不会自动恢复协定。"
 lsm_rb_status_lapsed:0 "#Y 协定未生效#!\n双方可以重新武装。恢复协定需要和平关系、拆除受涵盖州的海军基地，并获得所有主权签署方同意。"
 lsm_rb_status_no_counterpart:0 "协定目前没有符合条件的另一方。海军限制已解除。如果符合条件的签署方重新出现，就必须重新谈判一项新协定。"
 lsm_rb_status_breach:0 "#N 湖区仍有海军基地#!\n协定仍然有效，但受涵盖州的现有海军基地必须拆除。进一步扩张受到限制。"
 lsm_rb_status_our_consent:0 "#Y 等待其他签署方#!\n我们已同意恢复协定。只要恢复条件持续满足，我们的提议将在六个月内保持有效。"
 lsm_rb_status_offer:0 "#Y 已提出恢复协定#!\n至少有一名签署方提出恢复协定。每个主权签署方都必须分别表示同意。"
 lsm_rb_notice_button_name:0 "发出退出通知"
 lsm_rb_notice_button_desc:0 "启用协定中的六个月退出条款。这会损害双方关系，并在通知期结束后为海军重新武装打开道路。"
 lsm_rb_notice_requirements_tt:0 "我们必须是主权签署方，协定必须处于生效状态，并且与敌对签署方的关系必须为−50或更低。双方之间不得处于战争状态。"
 lsm_rb_notice_effect_tt:0 "提前六个月发出退出通知。在此期间海军限制继续有效。与敌对签署方的关系下降10。通知到期后，所有各方均不再受协定约束。"
 lsm_rb_renewal_button_name:0 "同意恢复协定"
 lsm_rb_renewal_button_desc:0 "提议恢复和平安排。只有所有主权签署方都同意后，协定才会重新生效。"
 lsm_rb_renewal_requirements_tt:0 "我们必须是主权签署方，协定必须已经失效，且签署方之间必须保持和平。我们与敌对签署方的关系必须至少为0。任何参与方都不得在受涵盖的湖区州保留海军基地。我们不能已经有一项待处理提议。"
 lsm_rb_renewal_effect_tt:0 "在六个月内表示我们同意恢复协定。所有主权签署方均同意后，海军基地限制恢复生效。战争、关系恶化或湖区重新武装都会使待处理的同意失效。"
 lsm_rush_bagot.1.t:0 "湖区的通知"
 lsm_rush_bagot.1.d:0 "一名签署方启用了拉什–巴戈特协定的退出条款。六个月通知期已经开始。在其结束前，海军限制仍具约束力。"
 lsm_rush_bagot.1.f:0 "公文传递的速度比一艘军舰完成整备还快。两岸的大臣都在数着剩下的月份。"
 lsm_rush_bagot.1.a:0 "协定仍然约束着我们——至少现在如此。"
 lsm_rush_bagot.2.t:0 "通知期届满"
 lsm_rush_bagot.2.d:0 "退出通知已完成其期限。拉什–巴戈特海军限制被解除，签署方可以自由在湖区各州建立海军基地。"
 lsm_rush_bagot.2.f:0 "那些曾服务于湖区贸易的船坞，如今可以服务于另一种用途。"
 lsm_rush_bagot.2.a:0 "湖区翻开了新的一页。"
 lsm_rush_bagot.3.t:0 "战时的湖区"
 lsm_rush_bagot.3.d:0 "战争使拉什–巴戈特协定的各方站到了对立阵营。海军限制暂停，任何待处理的退出通知或恢复协定提议都被取消。"
 lsm_rush_bagot.3.f:0 "曾经以货物流量衡量的边界，如今再次用大炮来衡量。"
 lsm_rush_bagot.3.a:0 "准备战争。"
 lsm_rush_bagot.4.t:0 "没有裁军的和平"
 lsm_rush_bagot.4.d:0 "条约双方之间的战争已经结束。海军限制仍处于解除状态。若要恢复协定，就必须拆除受涵盖湖区州的基地，并重新取得所有主权签署方的同意。"
 lsm_rush_bagot.4.f:0 "停战可以让炮声沉寂。要把这些大炮搬上岸，还需要另一项协定。"
 lsm_rush_bagot.4.a:0 "我们可以回到谈判桌前。"
 lsm_rush_bagot.5.t:0 "恢复拉什–巴戈特的提议"
 lsm_rush_bagot.5.d:0 "一名签署方提出恢复协定。如果我们愿意加入，可以在拉什–巴戈特日志条目中记录同意。所有主权签署方都必须同意，每项提议将在六个月后失效。"
 lsm_rush_bagot.5.f:0 "旧日往来函件被从档案库中取出。纸上还留有新签名的位置。"
 lsm_rush_bagot.5.a:0 "考虑这项提议。"
 lsm_rush_bagot.6.t:0 "和平安排得以恢复"
 lsm_rush_bagot.6.d:0 "所有主权签署方都同意恢复拉什–巴戈特安排。受涵盖湖区州的海军基地限制重新生效。湖区商贸仍可自由增长。"
 lsm_rush_bagot.6.f:0 "湖上的船长们关注天气、浅滩和有利可图的货物。眼下，这已经足够。"
 lsm_rush_bagot.6.a:0 "愿五大湖保持和平。"
 lsm_rush_bagot.7.t:0 "湖区海军军备"
 lsm_rush_bagot.7.d:0 "我们在拉什–巴戈特限制涵盖的州保留了海军基地。为了遵守协定，这些基地必须拆除。进一步扩张受到限制；商港可以继续运营。"
 lsm_rush_bagot.7.f:0 "公文提出了一个简单的问题：为什么我们的岸边仍有军舰正在整备？"
 lsm_rush_bagot.7.a:0 "审查我们的湖区设施。"
 lsm_rb_naval_construction_allowed_tt:0 "拉什–巴戈特协定必须允许在该州进行海军建设。"
