l_simp_chinese:
 TREATY_NAME_HUNKAR_ISKELESI:0 "温基阿尔-伊斯凯莱西条约"
 hunkar_iskelesi:0 "温基阿尔-伊斯凯莱西协定"
 hunkar_iskelesi_desc:0 "俄奥斯曼协定将土耳其海峡的通航问题置于欧洲外交的中心。"
 hunkar_iskelesi_article_short_desc:0 "在海峡会议召开前维持现有的俄奥斯曼协定。"
 hunkar_iskelesi_effects_desc:0 "该协定改善俄奥斯曼关系，并一直有效至海峡会议召开。"
 lsm_hunkar_not_superseded_tt:0 "海峡会议尚未取代温基阿尔-伊斯凯莱西协定。"
 je_straits_question:0 "海峡问题"
 je_straits_question_reason:0 "英国、法国、奥地利、普鲁士和俄罗斯有六个月时间为土耳其海峡选择一项安排。每个代表团投一票。未投出的选票会在投票结束时进行分配。随后高门有六个月时间接受或拒绝获胜的公约；保持沉默视为接受。尽管各大国都可能希望维持欧洲稳定，但某些结果也许会带来意想不到的后果……"
 je_straits_question_status:0 "关于博斯普鲁斯海峡和达达尼尔海峡通航的安排。"
 lsm_straits_conference_open_tt:0 "温基阿尔-伊斯凯莱西协定已经结束，海峡会议现已召开。"
 lsm_straits_ballot_complete_tt:0 "代表们已经选出获胜提案。"
 lsm_straits_settlement_accepted_tt:0 "高门接受了公约，或奥斯曼主权得以维持。"
 lsm_straits_settlement_rejected_tt:0 "提议的安排已被拒绝，或已无法再行缔结。"
 lsm_straits_voting_open_tt:0 "六个月的投票期仍在进行。"
 lsm_straits_not_voted_tt:0 "我们的代表团尚未投票。"
 lsm_straits_russia_exists_tt:0 "俄罗斯存在，并可以获得提议中的通航权。"
 lsm_straits_ottoman_decision_pending_tt:0 "高门尚未接受或拒绝获胜提案。"
 lsm_straits_human_withdrawal_tt:0 "由AI控制的签署方不会自愿退出该协定。"
 straits_ancient_rule_button:0 "确认古制"
 straits_ancient_rule_button_desc:0 "支持一项要求将外国军舰排除出土耳其海峡的公约。如果获得接受，高门将与参与列强签署公约。由AI控制的高门会优先实行军事封闭，将通航限制于控制方；由玩家控制的高门必须手动遵守这些条款。现有条约中的通航豁免仍然有效。"
 straits_open_passage_button:0 "各国自由通航"
 straits_open_passage_button_desc:0 "支持具有约束力的公约，禁止高门向任何国家关闭海峡。通航保障也适用于本次会议以外的国家。这并不会取消通行费。"
 straits_russian_entente_button:0 "接受俄罗斯立场"
 straits_russian_entente_button_desc:0 "支持俄罗斯海军通航，并排除其他外国军舰。俄罗斯将获得一项条约通航豁免。由AI控制的高门会优先实行军事封闭，将通航限制于控制方，而俄罗斯仍保留其豁免。由玩家控制的高门必须手动实施封闭；其他现有通航豁免仍然有效。"
 straits_ottoman_prerogative_button:0 "高门主权"
 straits_ottoman_prerogative_button_desc:0 "将土耳其海峡的通航权交由奥斯曼政府决定。如果该提案获胜，会议将在不订立新条约、也不强加通航权的情况下结束。"
 lsm_straits_vote_ancient_rule_tt:0 "将我们的票投给古制。在会议结束前，这一票不会直接实施公约。"
 lsm_straits_vote_open_passage_tt:0 "将我们的票投给保障所有国家通航的方案。"
 lsm_straits_vote_russian_entente_tt:0 "将我们的票投给俄罗斯通航特权。"
 lsm_straits_vote_ottoman_prerogative_tt:0 "将我们的票投给奥斯曼主权以及不订立新条约。"
 straits_conference_approve_button:0 "接受公约"
 straits_conference_approve_button_desc:0 "接受获胜提案，并与仍然存在的会议参与列强缔结相应协定。这些协定具有五年的约束期。"
 straits_conference_reject_button:0 "拒绝公约"
 straits_conference_reject_button_desc:0 "拒绝获胜提案。会议将破裂，不会订立新的公约条约。"
 lsm_straits_accept_settlement_tt:0 "缔结获胜提案所要求的协定。"
 lsm_straits_reject_settlement_tt:0 "不订立新公约并结束会议。"
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "伦敦海峡公约：古制"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "伦敦海峡公约：自由通航"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "伦敦海峡公约：俄罗斯特权"
 straits_question_events.1.t:0 "海峡问题"
 straits_question_events.1.d:0 "温基阿尔-伊斯凯莱西协定即将被新的安排取代，这再次提出了谁可以派军舰通过博斯普鲁斯海峡和达达尼尔海峡的问题。英国、法国、奥地利、普鲁士和俄罗斯将提出一项安排，交由奥斯曼政府考虑。"
 straits_question_events.1.f:0 "代表们有六个月时间就一项提案达成一致。"
 straits_question_events.1.a:0 "召开会议。"
 straits_question_events.4.t:0 "伦敦公约"
 straits_question_events.4.t_sovereignty:0 "高门保留控制权"
 straits_question_events.4.d1:0 "高门与参与列强缔结了一项确认古制的公约。外国军舰不得进入土耳其海峡，而商船仍可自由通航。奥斯曼政府负责维持军事封闭。"
 straits_question_events.4.d2:0 "会议接受了俄罗斯的通航特权。俄罗斯获得通过奥斯曼控制海峡的海军通航保障，同时相关公约要求排除其他外国海军。奥斯曼政府负责执行这一排除规定。"
 straits_question_events.4.d3:0 "高门接受了保障所有国家通过其海峡的公约。只要这些协定仍然有效，奥斯曼政府就不得关闭海峡。通航保障同样适用于会议签署方之外的国家。"
 straits_question_events.4.d4:0 "列强接受了奥斯曼对土耳其海峡通航的控制。没有订立新的公约条约，也没有任何外国政府通过这一安排获得通航权。准许通航与否仍由苏丹自行决定。"
 straits_question_events.4.f:0 "代表们完成了工作。"
 straits_question_events.4.a:0 "会议结束。"
 straits_question_events.5.t:0 "海峡会议破裂"
 straits_question_events.5.d:0 "提议的安排未能达成协议。没有新的公约得到缔结，土耳其海峡的通航问题仍未解决。"
 straits_question_events.5.f:0 "代表们在没有达成协议的情况下离开。"
 straits_question_events.5.a:0 "没有协议。"
 lsm_straits_ancient_rule:0 "古制"
 lsm_straits_ancient_rule_desc:0 "高门承诺向外国军舰关闭土耳其海峡。"
 lsm_straits_ancient_rule_article_short_desc:0 "高门承诺向外国军舰关闭土耳其海峡。"
 lsm_straits_ancient_rule_effects_desc:0 "由AI控制的高门会在公约条款有效期间优先实行军事封闭，将通航限制于控制方。贸易仍保持开放，条约通航豁免也继续有效。由玩家控制的高门必须手动设置军事封闭。"
 lsm_straits_open_passage:0 "各国自由通航"
 lsm_straits_open_passage_desc:0 "高门保证所有国家均可通过其海峡。"
 lsm_straits_open_passage_article_short_desc:0 "高门保证所有国家均可通过其海峡。"
 lsm_straits_open_passage_effects_desc:0 "只要本条款仍然有效，来源国就不能关闭其海峡。这适用于所有国家，包括会议之外的国家。通行费不会被免除。"
 lsm_straits_russian_entente:0 "承认俄罗斯特权"
 lsm_straits_russian_entente_desc:0 "列强承认俄罗斯的通航特权，并要求排除其他外国军舰。"
 lsm_straits_russian_entente_article_short_desc:0 "列强承认俄罗斯的通航特权，并要求排除其他外国军舰。"
 lsm_straits_russian_entente_effects_desc:0 "由AI控制的高门会在公约条款有效期间优先实行军事封闭，将通航限制于控制方。俄罗斯通过“俄罗斯海军通航”条款获得通航豁免。其他条约豁免仍然有效。由玩家控制的高门必须手动设置军事封闭。"
 lsm_straits_russian_access:0 "俄罗斯海军通航"
 lsm_straits_russian_access_desc:0 "高门准许俄罗斯海军通过奥斯曼控制的海峡。"
 lsm_straits_russian_access_article_short_desc:0 "高门准许俄罗斯海军通过奥斯曼控制的海峡。"
 lsm_straits_russian_access_effects_desc:0 "来源国准许目标国军队通过其海峡。这不会授予陆上军事通行权，也不会自动向第三国关闭海峡。"
