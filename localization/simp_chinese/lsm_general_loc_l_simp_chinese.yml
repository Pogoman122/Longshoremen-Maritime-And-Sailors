l_simp_chinese:
 revolution_pulse1_events.8.t: "水兵拒绝出海"
 revolution_pulse1_events.8.d: "[SCOPE.sState('coastal_navy_state').GetName]的[GetPopType('sailors').GetName]拒绝登船执行任何离港航行。兵变规模不小，必须谨慎处理。"
 revolution_pulse1_events.8.f: ""事情很简单。我们有要求。要求不满足，我们就不出海。""
 revolution_pulse1_events.8.a: "拘押这些人，并将事件控制在[SCOPE.sState('coastal_navy_state').GetName]以内。"
 revolution_pulse1_events.8.b: "强迫他们返回船上。"
 revolution_pulse1_events.8.c: "尝试与[GetPopType('sailors').GetName]谈判解决。"
 revolution_lsm_events.1.t: "革命者发动兵变"
 revolution_lsm_events.1.d: "一伙据称与[SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName]有关的革命者制服了[SCOPE.sState('lsm_ship_mutiny_state').GetName]的水兵，造成二十余人死亡，并夺取一艘武装船只逃往海上。"
 revolution_lsm_events.1.f: "#bold 通缉：窃船者#! \n\n据信有30余人参与了[SCOPE.sState('coastal_navy_state').GetName]的一起船只盗窃案。每名被捕或被击毙者悬赏£200；提供线索并导致罪犯被捕或死亡者赏£50。\n\n据悉其携带武器且十分危险。协助者将视为同罪。"
 revolution_lsm_events.1.a: "搜查各港口。"
 revolution_lsm_events.1.b: "改为搜查各渔场。"
 lsm_events.1.t:0 "迷失于黑暗"
 lsm_events.1.d:0 "一艘载有码头工人的渡船在[SCOPE.sState('lsm_lighthouse_accident_state').GetName]某港口未设照明的进港水域撞上礁石。约150名码头工人溺亡。"
 lsm_events.1.f:0 "亲属们在码头边等待，救援人员不断将死者运上岸。幸存者称，船员在黑暗中失去了方向。由于没有灯塔标示进港航道，他们直到撞击前一刻才发现礁石。"
 lsm_events.1.a:0 "也许该做点什么了。"
 lsm_events.1.deaths_tt:0 "[SCOPE.sState('lsm_lighthouse_accident_state').GetName]约有#N 150#!名码头工人死亡。"
 modifier_scouring_ports: "搜查港口"
 modifier_scouring_fisheries: "搜查渔场"
 lsm_admirals.1.t:0 "该晋升了"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]要求晋升[SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName]，并强调[SCOPE.sCharacter('low_rank_admiral').GetHerHis]长期忠诚而高效的服役记录。"
 lsm_admirals.1.f:1 "[SCOPE.sCharacter('low_rank_admiral').GetHerHis]军装上挂满了勋章，多得几乎看不见下面的布料，但这还不够。骄傲地挺起胸膛的[SCOPE.sCharacter('low_rank_admiral').GetSheHe]想到[SCOPE.sCharacter('high_rank_admiral').GetRankName] [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting]得知[SCOPE.sCharacter('low_rank_admiral').GetHerHis]即将升迁时的表情，不禁露出笑容；他们之间的竞争在军官中早已闻名。\n\n终于，[SCOPE.sCharacter('low_rank_admiral').GetSheHe]将得到[SCOPE.sCharacter('low_rank_admiral').GetHerHis]应得的一切。"
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName]理应获得晋升。"
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]休想逼我们做决定。"
 low_rank_admiral_ig_opinion_add:0 "晋升杰出海军上将"
 low_rank_admiral_ig_opinion_remove:0 "拒绝晋升海军上将"
 high_rank_admiral_ig_opinion_add:0 "阻止对手晋升"
 denied_promotion:0 "拒绝晋升"
 lsm_canal_events.1.t:0 "威兰运河竣工"
 lsm_canal_events.1.d:0 "经过多年的开挖、船闸建设和工程施工，威兰运河终于正式通航。船只如今可以绕过尼亚加拉瀑布这一巨大障碍，将安大略湖与上游五大湖连接起来。"
 lsm_canal_events.1.f:0 "运河的开通将五大湖变成了一条连续的商业水道。运载木材、谷物、矿石、制成品和乘客的船只，如今可以在内陆湖泊与安大略湖港口之间航行，无需在尼亚加拉一带卸货转运。过去彼此分离的一系列内海，正日益成为一张统一的国际航运网络，将英属北美和美国不断发展的定居点与工业连接起来。"
 lsm_canal_events.1.a:0 "五大湖已向商业开放。"
 mobilization_option_rail_transport: "铁路运输"
 mobilization_option_rail_transport_desc: "让你的士兵由国家出资乘火车出行。"
