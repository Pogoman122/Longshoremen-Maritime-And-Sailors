l_spanish:
 revolution_pulse1_events.8.t: "Los marineros permanecen en tierra"
 revolution_pulse1_events.8.d: "Los [GetPopType('sailors').GetName] de [SCOPE.sState('coastal_navy_state').GetName] se han negado a embarcarse en cualquier viaje fuera del puerto. La magnitud del motín exige tratar la situación con delicadeza."
 revolution_pulse1_events.8.f: ""Es muy sencillo. Tenemos exigencias. No zarpamos hasta que se cumplan.""
 revolution_pulse1_events.8.a: "Detener a los hombres y mantener el incidente confinado a [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Obligar a los hombres a subir a sus barcos."
 revolution_pulse1_events.8.c: "Intentar hablar con los [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Los revolucionarios organizan un motín"
 revolution_lsm_events.1.d: "Una banda de revolucionarios de la que se rumorea que está vinculada a [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName] ha reducido a los marineros de [SCOPE.sState('lsm_ship_mutiny_state').GetName], dejando dos docenas de muertos, y se ha hecho a la mar con un buque armado."
 revolution_lsm_events.1.f: "#bold Se buscan: ladrones de barcos#! \n\nSe cree que más de 30 hombres participaron en el robo de un buque en [SCOPE.sState('coastal_navy_state').GetName]. £200 por cada hombre capturado o muerto; £50 por información que conduzca a la captura o muerte de los culpables.\n\nSe los considera armados y peligrosos. Los colaboradores serán considerados igualmente culpables."
 revolution_lsm_events.1.a: "Registrar los puertos en su busca."
 revolution_lsm_events.1.b: "Registrar en cambio las pesquerías."
 lsm_events.1.t:0 "Perdidos en la oscuridad"
 lsm_events.1.d:0 "Un transbordador que transportaba estibadores ha chocado contra unas rocas en los accesos sin iluminar a un puerto de [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Unos 150 estibadores se han ahogado."
 lsm_events.1.f:0 "Los familiares esperan junto al muelle mientras los rescatistas llevan los cuerpos a tierra. Los supervivientes dicen que la tripulación perdió el rumbo en la oscuridad. Sin un faro que señalara la entrada, solo vieron las rocas momentos antes del impacto."
 lsm_events.1.a:0 "Quizá haya que hacer algo."
 lsm_events.1.deaths_tt:0 "Aproximadamente #N 150#! estibadores de [SCOPE.sState('lsm_lighthouse_accident_state').GetName] han muerto."
 modifier_scouring_ports: "Registro de los puertos"
 modifier_scouring_fisheries: "Registro de las pesquerías"
 lsm_admirals.1.t:0 "Le corresponde un ascenso"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] exige el ascenso de [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], destacando [SCOPE.sCharacter('low_rank_admiral').GetHerHis] historial de servicio leal y eficaz."
 lsm_admirals.1.f:1 "Tantas medallas adornaban la chaqueta de [SCOPE.sCharacter('low_rank_admiral').GetHerHis] que apenas se veía la tela, pero todavía no era suficiente. Con el pecho henchido de orgullo, [SCOPE.sCharacter('low_rank_admiral').GetSheHe] sonrió al imaginar la expresión de [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting] cuando [SCOPE.sCharacter('high_rank_admiral').GetRankName] se enterara del inminente ascenso de [SCOPE.sCharacter('low_rank_admiral').GetHerHis]; su rivalidad era legendaria entre los oficiales.\n\nPor fin [SCOPE.sCharacter('low_rank_admiral').GetSheHe] recibiría [SCOPE.sCharacter('low_rank_admiral').GetHerHis] merecida recompensa."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] se lo ha ganado."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] no nos forzará la mano."
 low_rank_admiral_ig_opinion_add:0 "Almirante destacado ascendido"
 low_rank_admiral_ig_opinion_remove:0 "Ascenso del almirante rechazado"
 high_rank_admiral_ig_opinion_add:0 "Ascenso del rival denegado"
 denied_promotion:0 "Ascenso denegado"
 lsm_canal_events.1.t:0 "Finalización del canal Welland"
 lsm_canal_events.1.d:0 "Tras años de excavaciones, construcción de esclusas y trabajos de ingeniería, el canal Welland por fin se ha abierto al tráfico. Los barcos pueden ahora sortear el gran obstáculo de las cataratas del Niágara, conectando el lago Ontario con los Grandes Lagos superiores."
 lsm_canal_events.1.f:0 "La apertura del canal ha transformado los Grandes Lagos en una vía comercial continua. Los buques que transportan madera, grano, mineral, productos manufacturados y pasajeros pueden navegar ahora entre los lagos interiores y los puertos del lago Ontario sin descargar sus mercancías alrededor del Niágara. Lo que antes era una serie de mares interiores separados se está convirtiendo cada vez más en una única red internacional de transporte marítimo que une los crecientes asentamientos e industrias de la Norteamérica británica y Estados Unidos."
 lsm_canal_events.1.a:0 "Los Grandes Lagos están abiertos al comercio."
 mobilization_option_rail_transport: "Transporte ferroviario"
 mobilization_option_rail_transport_desc: "Permite que tus soldados viajen en tren a costa del Estado."
