l_spanish:
 lsm_rb_journal_group:0 "Acuerdos marítimos"
 lsm_je_rush_bagot:0 "El Acuerdo Rush–Bagot"
 lsm_je_rush_bagot_reason:0 "El acuerdo de 1817 limitó los armamentos navales británicos y estadounidenses en los Grandes Lagos y el lago Champlain. Prometía una frontera pacífica, con solo unos pocos buques ligeramente armados permitidos en los lagos.\n\nMantenemos ese arreglo restringiendo nuevas bases navales en Ontario, Ohio, Michigan, Indiana, Illinois, Wisconsin y Minnesota. Los puertos mercantes y la navegación civil permanecen abiertos. El acuerdo vincula a Estados Unidos y a las autoridades británicas o canadienses de la costa norte.\n\nUn grave deterioro de las relaciones puede llevar a un signatario a dar un preaviso de retirada de seis meses. La guerra entre las partes suspende las restricciones. Después, la renovación exige el desarme y el acuerdo de todos los signatarios soberanos."
 lsm_je_rush_bagot_status:0 "Las condiciones del Acuerdo Rush–Bagot están siendo revisadas."
 lsm_rb_naval_restrictions:0 "Restricciones navales de Rush–Bagot"
 lsm_rb_naval_restrictions_desc:0 "El Acuerdo Rush–Bagot restringe la expansión de bases navales en estas costas. Los puertos comerciales permanecen abiertos."
 lsm_rb_status_active:0 "#P Acuerdo en vigor#!\nLas nuevas bases navales están restringidas en los estados lacustres cubiertos. Los puertos comerciales permanecen abiertos."
 lsm_rb_status_notice:0 "#Y Preaviso de retirada#!\nUn signatario ha dado un preaviso de seis meses. Las restricciones siguen en vigor hasta que termine el periodo de preaviso, salvo que estalle una guerra entre las partes."
 lsm_rb_status_war:0 "#N Guerra entre los signatarios#!\nLas restricciones navales quedan levantadas. La paz por sí sola no restablecerá el acuerdo."
 lsm_rb_status_lapsed:0 "#Y Acuerdo no vigente#!\nLas partes pueden rearmarse. La renovación exige relaciones pacíficas, el desmantelamiento de bases navales en los estados cubiertos y el consentimiento de todos los signatarios soberanos."
 lsm_rb_status_no_counterpart:0 "El acuerdo no tiene una contraparte elegible. Las restricciones navales quedan levantadas. Si regresan signatarios elegibles, deberá negociarse un nuevo acuerdo."
 lsm_rb_status_breach:0 "#N Aún quedan bases navales en los lagos#!\nEl acuerdo sigue vigente, pero las bases navales existentes en los estados cubiertos deben ser desmanteladas. Se restringe cualquier expansión adicional."
 lsm_rb_status_our_consent:0 "#Y A la espera de los demás signatarios#!\nHemos consentido la renovación. Nuestra oferta permanece abierta durante seis meses mientras sigan cumpliéndose las condiciones para la renovación."
 lsm_rb_status_offer:0 "#Y Renovación propuesta#!\nAl menos un signatario ha ofrecido renovar el acuerdo. Cada signatario soberano debe dar su propio consentimiento."
 lsm_rb_notice_button_name:0 "Dar preaviso de retirada"
 lsm_rb_notice_button_desc:0 "Invocar la cláusula de retirada con seis meses de preaviso del acuerdo. Esto perjudica las relaciones y abre el camino al rearme naval una vez concluido el periodo de preaviso."
 lsm_rb_notice_requirements_tt:0 "Debemos ser un signatario soberano, el acuerdo debe estar vigente y las relaciones con un signatario contrario deben ser de −50 o peores. Las partes no deben estar en guerra entre sí."
 lsm_rb_notice_effect_tt:0 "Dar seis meses de preaviso de retirada. Las restricciones navales continúan durante ese periodo. Las relaciones con el signatario o los signatarios contrarios caen en 10. Cuando expire el preaviso, todas las partes quedan liberadas del acuerdo."
 lsm_rb_renewal_button_name:0 "Consentir la renovación del acuerdo"
 lsm_rb_renewal_button_desc:0 "Ofrecer restaurar el arreglo pacífico. El acuerdo entra en vigor únicamente cuando todos los signatarios soberanos dan su consentimiento."
 lsm_rb_renewal_requirements_tt:0 "Debemos ser un signatario soberano, el acuerdo debe haber caducado y los signatarios deben estar en paz entre sí. Nuestras relaciones con los signatarios contrarios deben ser al menos 0. Ningún participante puede conservar una base naval en los estados lacustres cubiertos. No debemos tener ya una oferta pendiente."
 lsm_rb_renewal_effect_tt:0 "Dar nuestro consentimiento a la renovación durante seis meses. Una vez que todos los signatarios soberanos estén de acuerdo, se reanudan las restricciones a las bases navales. La guerra, el deterioro de las relaciones o un nuevo armamento en los lagos invalidan el consentimiento pendiente."
 lsm_rush_bagot.1.t:0 "Aviso en los lagos"
 lsm_rush_bagot.1.d:0 "Un signatario ha invocado la cláusula de retirada del Acuerdo Rush–Bagot. Ha comenzado el periodo de preaviso de seis meses. Hasta que expire, las restricciones navales siguen siendo vinculantes."
 lsm_rush_bagot.1.f:0 "El despacho viaja más rápido de lo que puede alistarse un barco. En ambas orillas, los ministros cuentan los meses."
 lsm_rush_bagot.1.a:0 "El acuerdo todavía nos obliga, por ahora."
 lsm_rush_bagot.2.t:0 "Expira el preaviso"
 lsm_rush_bagot.2.d:0 "El preaviso de retirada ha cumplido su plazo. Se levantan las restricciones navales de Rush–Bagot y los signatarios quedan libres para establecer bases navales en los estados lacustres."
 lsm_rush_bagot.2.f:0 "Los mismos astilleros que servían al comercio de los lagos pueden servir ahora a otro propósito."
 lsm_rush_bagot.2.a:0 "Un nuevo capítulo en los lagos."
 lsm_rush_bagot.3.t:0 "Los lagos en tiempo de guerra"
 lsm_rush_bagot.3.d:0 "La guerra ha colocado a las partes del Acuerdo Rush–Bagot en bandos opuestos. Sus restricciones navales quedan suspendidas y cualquier preaviso de retirada u oferta de renovación pendiente queda cancelado."
 lsm_rush_bagot.3.f:0 "Una frontera antes medida en cargamentos vuelve a medirse en cañones."
 lsm_rush_bagot.3.a:0 "Prepararse para la guerra."
 lsm_rush_bagot.4.t:0 "Paz sin desarme"
 lsm_rush_bagot.4.d:0 "La guerra entre las partes del tratado ha terminado. Las restricciones navales siguen levantadas. Restaurar el acuerdo exigirá desmantelar las bases de los estados lacustres cubiertos y obtener un nuevo consentimiento de todos los signatarios soberanos."
 lsm_rush_bagot.4.f:0 "Un armisticio puede silenciar los cañones. Hace falta otro acuerdo para llevarlos a tierra."
 lsm_rush_bagot.4.a:0 "Podemos volver a la mesa de negociaciones."
 lsm_rush_bagot.5.t:0 "Una oferta para renovar Rush–Bagot"
 lsm_rush_bagot.5.d:0 "Un signatario ha ofrecido renovar el acuerdo. Si deseamos unirnos, podemos registrar nuestro consentimiento en la entrada de diario de Rush–Bagot. Todos los signatarios soberanos deben estar de acuerdo y cada oferta expira al cabo de seis meses."
 lsm_rush_bagot.5.f:0 "La antigua correspondencia ha salido de los archivos. Hay espacio para nuevas firmas."
 lsm_rush_bagot.5.a:0 "Considerar la propuesta."
 lsm_rush_bagot.6.t:0 "Se restaura un arreglo pacífico"
 lsm_rush_bagot.6.d:0 "Todos los signatarios soberanos han acordado renovar el arreglo de Rush–Bagot. Las restricciones a las bases navales se reanudan en los estados lacustres cubiertos. El tráfico mercante de los lagos sigue siendo libre de crecer."
 lsm_rush_bagot.6.f:0 "Los capitanes de los lagos vigilan el tiempo, los bajíos y los cargamentos rentables. Por ahora, eso basta."
 lsm_rush_bagot.6.a:0 "Que los lagos permanezcan en paz."
 lsm_rush_bagot.7.t:0 "Armamentos navales en los lagos"
 lsm_rush_bagot.7.d:0 "Conservamos bases navales en estados cubiertos por las restricciones de Rush–Bagot. Estas bases deben desmantelarse para respetar el acuerdo. Se restringe cualquier expansión adicional; los puertos mercantes pueden seguir operando."
 lsm_rush_bagot.7.f:0 "El despacho plantea una pregunta sencilla: ¿por qué siguen alistándose buques de guerra en nuestra costa?"
 lsm_rush_bagot.7.a:0 "Revisar nuestras instalaciones lacustres."
 lsm_rb_naval_construction_allowed_tt:0 "El Acuerdo Rush–Bagot debe permitir la construcción naval en este estado."
