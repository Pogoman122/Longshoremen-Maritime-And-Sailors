l_spanish:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Tratado de Hünkâr İskelesi"
 hunkar_iskelesi:0 "Acuerdo de Hünkâr İskelesi"
 hunkar_iskelesi_desc:0 "El acuerdo ruso-otomano sitúa la cuestión del paso por los Estrechos Turcos en el centro de la diplomacia europea."
 hunkar_iskelesi_article_short_desc:0 "Mantener el acuerdo ruso-otomano existente hasta la apertura de la conferencia de los Estrechos."
 hunkar_iskelesi_effects_desc:0 "El acuerdo mejora las relaciones ruso-otomanas y permanece en vigor hasta la apertura de la conferencia de los Estrechos."
 lsm_hunkar_not_superseded_tt:0 "La conferencia de los Estrechos aún no ha sustituido el acuerdo de Hünkâr İskelesi."
 je_straits_question:0 "La Cuestión de los Estrechos"
 je_straits_question_reason:0 "Gran Bretaña, Francia, Austria, Prusia y Rusia disponen de seis meses para elegir un arreglo para los Estrechos Turcos. Cada delegación emite un voto. Los votos no emitidos se asignan al cerrarse la votación. La Puerta dispone entonces de seis meses para aceptar o rechazar la convención ganadora; el silencio cuenta como aceptación. Aunque cada gran potencia desee mantener la estabilidad en Europa, algunos resultados pueden tener consecuencias imprevistas..."
 je_straits_question_status:0 "Un arreglo para el paso por el Bósforo y los Dardanelos."
 lsm_straits_conference_open_tt:0 "El acuerdo de Hünkâr İskelesi ha terminado y se ha abierto la conferencia de los Estrechos."
 lsm_straits_ballot_complete_tt:0 "Los delegados han seleccionado una propuesta ganadora."
 lsm_straits_settlement_accepted_tt:0 "La Puerta ha aceptado la convención o ha prevalecido la soberanía otomana."
 lsm_straits_settlement_rejected_tt:0 "El arreglo propuesto ha sido rechazado o ya no puede concluirse."
 lsm_straits_voting_open_tt:0 "El periodo de votación de seis meses sigue abierto."
 lsm_straits_not_voted_tt:0 "Nuestra delegación aún no ha emitido su voto."
 lsm_straits_russia_exists_tt:0 "Rusia existe y puede recibir los derechos de paso propuestos."
 lsm_straits_ottoman_decision_pending_tt:0 "La Puerta aún no ha aceptado ni rechazado la propuesta ganadora."
 lsm_straits_human_withdrawal_tt:0 "Los signatarios controlados por la IA no se retirarán voluntariamente de este acuerdo."
 straits_ancient_rule_button:0 "Afirmar la Regla Antigua"
 straits_ancient_rule_button_desc:0 "Apoyar una convención que exija la exclusión de buques de guerra extranjeros de los Estrechos Turcos. Si se acepta, la Puerta firma convenciones con las potencias participantes. Una Puerta controlada por la IA prioriza el cierre militar con el paso restringido al controlador; una Puerta controlada por un jugador debe aplicar manualmente las condiciones. Las exenciones de paso de tratados existentes siguen vigentes."
 straits_open_passage_button:0 "Paso libre para todos"
 straits_open_passage_button_desc:0 "Apoyar convenciones vinculantes que impidan a la Puerta cerrar sus estrechos a cualquier país. La garantía de paso se extiende a países ajenos a esta conferencia. No elimina los peajes."
 straits_russian_entente_button:0 "Aceptar la posición de Rusia"
 straits_russian_entente_button_desc:0 "Apoyar el paso naval ruso y la exclusión de otros buques de guerra extranjeros. Rusia recibe una exención de paso por tratado. Una Puerta controlada por la IA prioriza el cierre militar con el paso restringido al controlador, mientras Rusia conserva su exención. Una Puerta controlada por un jugador debe imponer manualmente el cierre; las demás exenciones de paso existentes siguen vigentes."
 straits_ottoman_prerogative_button:0 "Soberanía de la Sublime Puerta"
 straits_ottoman_prerogative_button_desc:0 "Dejar el paso por los Estrechos Turcos en manos del gobierno otomano. Si esta propuesta gana, la conferencia termina sin crear ningún nuevo tratado ni imponer derechos de paso."
 lsm_straits_vote_ancient_rule_tt:0 "Emitir nuestro voto por la Regla Antigua. Este voto no impone una convención antes de que concluya la conferencia."
 lsm_straits_vote_open_passage_tt:0 "Emitir nuestro voto por un paso garantizado a todos los países."
 lsm_straits_vote_russian_entente_tt:0 "Emitir nuestro voto por los privilegios de paso rusos."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Emitir nuestro voto por la soberanía otomana y ningún nuevo tratado."
 straits_conference_approve_button:0 "Aceptar la Convención"
 straits_conference_approve_button_desc:0 "Aceptar la propuesta ganadora y concluir los acuerdos correspondientes con las potencias de la conferencia que sigan existiendo. Los acuerdos tienen un periodo vinculante de cinco años."
 straits_conference_reject_button:0 "Rechazar la Convención"
 straits_conference_reject_button_desc:0 "Rechazar la propuesta ganadora. La conferencia se derrumbará y no se crearán nuevos tratados de convención."
 lsm_straits_accept_settlement_tt:0 "Concluir los acuerdos exigidos por la propuesta ganadora."
 lsm_straits_reject_settlement_tt:0 "Terminar la conferencia sin crear una nueva convención."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Convención de Londres sobre los Estrechos: Regla Antigua"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Convención de Londres sobre los Estrechos: Paso Libre"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Convención de Londres sobre los Estrechos: Privilegios Rusos"
 straits_question_events.1.t:0 "La Cuestión de los Estrechos"
 straits_question_events.1.d:0 "El acuerdo de Hünkâr İskelesi está siendo sustituido, reabriendo la cuestión de quién puede enviar buques de guerra a través del Bósforo y los Dardanelos. Gran Bretaña, Francia, Austria, Prusia y Rusia presentarán un arreglo para que lo considere el gobierno otomano."
 straits_question_events.1.f:0 "Los delegados disponen de seis meses para acordar una propuesta."
 straits_question_events.1.a:0 "Abrir la conferencia."
 straits_question_events.4.t:0 "La Convención de Londres"
 straits_question_events.4.t_sovereignty:0 "La Puerta conserva el control"
 straits_question_events.4.d1:0 "La Puerta y las potencias participantes han concluido una convención que afirma la Regla Antigua. Los buques de guerra extranjeros deben quedar excluidos de los Estrechos Turcos, mientras que la navegación mercante seguirá siendo libre. El gobierno otomano queda encargado de mantener el cierre militar."
 straits_question_events.4.d2:0 "La conferencia ha aceptado los privilegios de paso rusos. Rusia recibe un paso naval garantizado a través de estrechos controlados por los otomanos, mientras que las convenciones adjuntas exigen la exclusión de otras armadas extranjeras. El gobierno otomano es responsable de hacer cumplir esa exclusión."
 straits_question_events.4.d3:0 "La Puerta ha aceptado convenciones que garantizan el paso por sus estrechos a todos los países. El gobierno otomano queda obligado a no cerrar los estrechos mientras estos acuerdos sigan vigentes. El paso también queda garantizado más allá de los signatarios de la conferencia."
 straits_question_events.4.d4:0 "Las potencias han aceptado el control otomano del paso por los Estrechos Turcos. No se ha creado ningún nuevo tratado de convención y ningún gobierno extranjero recibe derechos de paso por este arreglo. El sultán conserva su discreción sobre el acceso."
 straits_question_events.4.f:0 "Los delegados han concluido sus asuntos."
 straits_question_events.4.a:0 "La conferencia ha concluido."
 straits_question_events.5.t:0 "La conferencia de los Estrechos se derrumba"
 straits_question_events.5.d:0 "El arreglo propuesto no ha logrado asegurar un acuerdo. No se ha concluido ninguna nueva convención y la cuestión del paso por los Estrechos Turcos sigue sin resolverse."
 straits_question_events.5.f:0 "Los delegados se marchan sin un acuerdo."
 straits_question_events.5.a:0 "No hay acuerdo."
 lsm_straits_ancient_rule:0 "La Regla Antigua"
 lsm_straits_ancient_rule_desc:0 "La Puerta se compromete a cerrar los Estrechos Turcos a los buques de guerra extranjeros."
 lsm_straits_ancient_rule_article_short_desc:0 "La Puerta se compromete a cerrar los Estrechos Turcos a los buques de guerra extranjeros."
 lsm_straits_ancient_rule_effects_desc:0 "Una Puerta controlada por la IA prioriza el cierre militar con el paso restringido al controlador mientras siga vigente un artículo de la convención. El comercio permanece abierto y las exenciones de paso por tratado siguen aplicándose. Una Puerta controlada por un jugador debe establecer manualmente el cierre militar."
 lsm_straits_open_passage:0 "Paso libre para todos"
 lsm_straits_open_passage_desc:0 "La Puerta garantiza el paso por sus estrechos a todos los países."
 lsm_straits_open_passage_article_short_desc:0 "La Puerta garantiza el paso por sus estrechos a todos los países."
 lsm_straits_open_passage_effects_desc:0 "El país de origen no puede cerrar sus estrechos mientras este artículo siga vigente. Esto se aplica a todos los países, incluidos los ajenos a la conferencia. Los peajes no quedan exentos."
 lsm_straits_russian_entente:0 "Reconocimiento de los privilegios rusos"
 lsm_straits_russian_entente_desc:0 "Las potencias reconocen los privilegios de paso rusos y exigen la exclusión de otros buques de guerra extranjeros."
 lsm_straits_russian_entente_article_short_desc:0 "Las potencias reconocen los privilegios de paso rusos y exigen la exclusión de otros buques de guerra extranjeros."
 lsm_straits_russian_entente_effects_desc:0 "Una Puerta controlada por la IA prioriza el cierre militar con el paso restringido al controlador mientras siga vigente un artículo de la convención. Rusia recibe su exención de paso mediante el artículo de Paso Naval Ruso. Las demás exenciones de tratados siguen aplicándose. Una Puerta controlada por un jugador debe establecer manualmente el cierre militar."
 lsm_straits_russian_access:0 "Paso naval ruso"
 lsm_straits_russian_access_desc:0 "La Puerta concede a Rusia paso naval por estrechos controlados por los otomanos."
 lsm_straits_russian_access_article_short_desc:0 "La Puerta concede a Rusia paso naval por estrechos controlados por los otomanos."
 lsm_straits_russian_access_effects_desc:0 "El país de origen concede al país objetivo paso militar a través de sus estrechos. Esto no concede acceso militar terrestre ni cierra automáticamente el paso a terceros países."
