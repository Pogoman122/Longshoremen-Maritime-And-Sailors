l_russian:
 lsm_rb_journal_group:0 "Морские соглашения"
 lsm_je_rush_bagot:0 "Соглашение Раша—Бэгота"
 lsm_je_rush_bagot_reason:0 "Соглашение 1817 года ограничило британские и американские военно-морские вооружения на Великих озёрах и озере Шамплейн. Оно обещало мирную границу, на которой на озёрах разрешалось лишь несколько легко вооружённых судов.\n\nМы поддерживаем этот порядок, ограничивая строительство новых военно-морских баз в Онтарио, Огайо, Мичигане, Индиане, Иллинойсе, Висконсине и Миннесоте. Торговые порты и гражданское судоходство остаются открытыми. Соглашение связывает Соединённые Штаты и британские или канадские власти на северном берегу.\n\nСерьёзное ухудшение отношений может побудить подписанта уведомить о выходе за шесть месяцев. Война между сторонами приостанавливает ограничения. После этого для возобновления необходимы разоружение и согласие всех суверенных подписантов."
 lsm_je_rush_bagot_status:0 "Условия Соглашения Раша—Бэгота пересматриваются."
 lsm_rb_naval_restrictions:0 "Военно-морские ограничения Раша—Бэгота"
 lsm_rb_naval_restrictions_desc:0 "Соглашение Раша—Бэгота ограничивает расширение военно-морских баз на этих берегах. Торговые порты остаются открытыми."
 lsm_rb_status_active:0 "#P Соглашение действует#!\nСтроительство новых военно-морских баз ограничено в охваченных озёрных штатах. Торговые порты остаются открытыми."
 lsm_rb_status_notice:0 "#Y Уведомление о выходе#!\nОдин из подписантов уведомил о выходе за шесть месяцев. Ограничения остаются в силе до окончания срока уведомления, если между сторонами не начнётся война."
 lsm_rb_status_war:0 "#N Война между подписантами#!\nВоенно-морские ограничения сняты. Один лишь мир не восстановит соглашение."
 lsm_rb_status_lapsed:0 "#Y Соглашение не действует#!\nСтороны могут перевооружаться. Для возобновления нужны мирные отношения, демонтаж военно-морских баз в охваченных штатах и согласие всех суверенных подписантов."
 lsm_rb_status_no_counterpart:0 "У соглашения нет подходящей второй стороны. Военно-морские ограничения сняты. Если подходящие подписанты вновь появятся, потребуется заключить новое соглашение."
 lsm_rb_status_breach:0 "#N На озёрах остаются военно-морские базы#!\nСоглашение продолжает действовать, но существующие военно-морские базы в охваченных штатах должны быть демонтированы. Дальнейшее расширение ограничено."
 lsm_rb_status_our_consent:0 "#Y Ожидание других подписантов#!\nМы согласились на возобновление. Наше предложение остаётся в силе шесть месяцев, пока продолжают выполняться условия возобновления."
 lsm_rb_status_offer:0 "#Y Предложено возобновление#!\nПо крайней мере один подписант предложил возобновить соглашение. Каждый суверенный подписант должен дать собственное согласие."
 lsm_rb_notice_button_name:0 "Уведомить о выходе"
 lsm_rb_notice_button_desc:0 "Воспользоваться шестимесячной оговоркой о выходе из соглашения. Это ухудшает отношения и открывает путь к военно-морскому перевооружению после истечения срока уведомления."
 lsm_rb_notice_requirements_tt:0 "Мы должны быть суверенным подписантом, соглашение должно действовать, а отношения с противостоящим подписантом должны быть −50 или хуже. Стороны не должны воевать друг с другом."
 lsm_rb_notice_effect_tt:0 "Уведомить о выходе за шесть месяцев. Военно-морские ограничения продолжают действовать в этот период. Отношения с противостоящим подписантом или подписантами ухудшаются на 10. По истечении срока уведомления все стороны освобождаются от соглашения."
 lsm_rb_renewal_button_name:0 "Согласиться на возобновление соглашения"
 lsm_rb_renewal_button_desc:0 "Предложить восстановить мирное урегулирование. Соглашение вступает в силу только после согласия всех суверенных подписантов."
 lsm_rb_renewal_requirements_tt:0 "Мы должны быть суверенным подписантом, соглашение должно прекратить действие, а подписанты должны находиться в мире друг с другом. Наши отношения с противостоящими подписантами должны быть не ниже 0. Ни один участник не может сохранять военно-морскую базу в охваченных озёрных штатах. У нас не должно быть уже действующего предложения."
 lsm_rb_renewal_effect_tt:0 "Дать согласие на возобновление сроком на шесть месяцев. После согласия всех суверенных подписантов ограничения на военно-морские базы возобновляются. Война, ухудшение отношений или новое вооружение на озёрах аннулируют ожидающее согласие."
 lsm_rush_bagot.1.t:0 "Уведомление на озёрах"
 lsm_rush_bagot.1.d:0 "Один из подписантов воспользовался оговоркой о выходе из Соглашения Раша—Бэгота. Начался шестимесячный срок уведомления. До его истечения военно-морские ограничения остаются обязательными."
 lsm_rush_bagot.1.f:0 "Депеша идёт быстрее, чем можно снарядить корабль. На обоих берегах министры считают месяцы."
 lsm_rush_bagot.1.a:0 "Соглашение всё ещё связывает нас — пока что."
 lsm_rush_bagot.2.t:0 "Срок уведомления истекает"
 lsm_rush_bagot.2.d:0 "Срок уведомления о выходе завершился. Военно-морские ограничения Раша—Бэгота сняты, и подписанты теперь свободны создавать военно-морские базы в озёрных штатах."
 lsm_rush_bagot.2.f:0 "Те же верфи, что обслуживали торговлю на озёрах, теперь могут послужить иной цели."
 lsm_rush_bagot.2.a:0 "Новая глава в истории озёр."
 lsm_rush_bagot.3.t:0 "Озёра во время войны"
 lsm_rush_bagot.3.d:0 "Война поставила стороны Соглашения Раша—Бэгота по разные стороны фронта. Его военно-морские ограничения приостановлены, а любое ожидающее уведомление о выходе или предложение о возобновлении отменено."
 lsm_rush_bagot.3.f:0 "Граница, которую прежде измеряли грузами, снова измеряется пушками."
 lsm_rush_bagot.3.a:0 "Готовиться к войне."
 lsm_rush_bagot.4.t:0 "Мир без разоружения"
 lsm_rush_bagot.4.d:0 "Война между сторонами договора закончилась. Военно-морские ограничения остаются снятыми. Для восстановления соглашения потребуется демонтировать базы в охваченных озёрных штатах и вновь заручиться согласием каждого суверенного подписанта."
 lsm_rush_bagot.4.f:0 "Перемирие может заставить пушки замолчать. Чтобы убрать их на берег, нужно новое соглашение."
 lsm_rush_bagot.4.a:0 "Мы можем вернуться за стол переговоров."
 lsm_rush_bagot.5.t:0 "Предложение возобновить соглашение Раша—Бэгота"
 lsm_rush_bagot.5.d:0 "Один из подписантов предложил возобновить соглашение. Если мы хотим присоединиться, можно зафиксировать наше согласие в записи журнала Раша—Бэгота. Все суверенные подписанты должны согласиться, и каждое предложение истекает через шесть месяцев."
 lsm_rush_bagot.5.f:0 "Старая переписка извлечена из архивов. На ней найдётся место для новых подписей."
 lsm_rush_bagot.5.a:0 "Рассмотреть предложение."
 lsm_rush_bagot.6.t:0 "Мирное урегулирование восстановлено"
 lsm_rush_bagot.6.d:0 "Все суверенные подписанты согласились возобновить порядок Раша—Бэгота. Ограничения на военно-морские базы вновь действуют в охваченных озёрных штатах. Торговое судоходство на озёрах по-прежнему может свободно расти."
 lsm_rush_bagot.6.f:0 "Капитаны озёр следят за погодой, мелями и прибыльными грузами. Пока этого достаточно."
 lsm_rush_bagot.6.a:0 "Пусть озёра остаются мирными."
 lsm_rush_bagot.7.t:0 "Военно-морские вооружения на озёрах"
 lsm_rush_bagot.7.d:0 "У нас остаются военно-морские базы в штатах, охваченных ограничениями Раша—Бэгота. Чтобы соблюсти соглашение, эти базы необходимо демонтировать. Дальнейшее расширение ограничено; торговые порты могут продолжать работу."
 lsm_rush_bagot.7.f:0 "Депеша задаёт простой вопрос: почему на нашем берегу всё ещё снаряжают военные корабли?"
 lsm_rush_bagot.7.a:0 "Проверить наши объекты на озёрах."
 lsm_rb_naval_construction_allowed_tt:0 "Соглашение Раша—Бэгота должно разрешать военно-морское строительство в этом штате."
