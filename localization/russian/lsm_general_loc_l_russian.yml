l_russian:
 revolution_pulse1_events.8.t: "Моряки остаются на берегу"
 revolution_pulse1_events.8.d: "[GetPopType('sailors').GetName] в [SCOPE.sState('coastal_navy_state').GetName] отказались выходить из порта в какие-либо плавания. Масштаб мятежа требует осторожного подхода к ситуации."
 revolution_pulse1_events.8.f: ""Всё очень просто. У нас есть требования. Мы не выйдем в море, пока они не будут выполнены.""
 revolution_pulse1_events.8.a: "Задержать людей и не допустить распространения инцидента за пределы [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Силой загнать людей на корабли."
 revolution_pulse1_events.8.c: "Попытаться договориться с [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Революционеры поднимают мятеж"
 revolution_lsm_events.1.d: "Группа революционеров, предположительно связанная с [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName], одолела моряков в [SCOPE.sState('lsm_ship_mutiny_state').GetName], оставив два десятка погибших, и вышла в море на вооружённом судне."
 revolution_lsm_events.1.f: "#bold Разыскиваются: угонщики судна#! \n\nСчитается, что более 30 человек причастны к краже судна в [SCOPE.sState('coastal_navy_state').GetName]. £200 за каждого захваченного или убитого; £50 за сведения, приведшие к поимке или гибели виновных.\n\nСчитаются вооружёнными и опасными. Пособники будут признаны в равной степени виновными."
 revolution_lsm_events.1.a: "Прочесать порты в их поисках."
 revolution_lsm_events.1.b: "Вместо этого прочесать рыбные промыслы."
 lsm_events.1.t:0 "Затерянные во тьме"
 lsm_events.1.d:0 "Паром с докерами налетел на скалы в неосвещённых подходах к порту в [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Около 150 докеров утонули."
 lsm_events.1.f:0 "Родственники ждут на причале, пока спасатели выносят погибших на берег. Выжившие говорят, что экипаж потерял ориентиры в темноте. Без маяка, отмечающего вход в порт, скалы заметили лишь за мгновения до удара."
 lsm_events.1.a:0 "Пожалуй, следует что-то предпринять."
 lsm_events.1.deaths_tt:0 "Около #N 150#! докеров в [SCOPE.sState('lsm_lighthouse_accident_state').GetName] погибли."
 modifier_scouring_ports: "Прочёсывание портов"
 modifier_scouring_fisheries: "Прочёсывание рыбных промыслов"
 lsm_admirals.1.t:0 "Пора повышать"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] требует повышения [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], ссылаясь на [SCOPE.sCharacter('low_rank_admiral').GetHerHis] долгую историю верной и эффективной службы."
 lsm_admirals.1.f:1 "На мундире [SCOPE.sCharacter('low_rank_admiral').GetHerHis] было столько медалей, что под ними почти не было видно ткани, но и этого оказалось недостаточно. Выпятив грудь от гордости, [SCOPE.sCharacter('low_rank_admiral').GetSheHe] улыбнулся, представляя выражение лица [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting], когда [SCOPE.sCharacter('high_rank_admiral').GetRankName] узнает о скором возвышении [SCOPE.sCharacter('low_rank_admiral').GetHerHis]; их соперничество было легендарным среди офицеров.\n\nНаконец [SCOPE.sCharacter('low_rank_admiral').GetSheHe] получит то, что [SCOPE.sCharacter('low_rank_admiral').GetHerHis] причитается."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] заслужил это."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] не будет диктовать нам условия."
 low_rank_admiral_ig_opinion_add:0 "Выдающийся адмирал повышен"
 low_rank_admiral_ig_opinion_remove:0 "Отказано в повышении адмирала"
 high_rank_admiral_ig_opinion_add:0 "Повышение соперника отклонено"
 denied_promotion:0 "Повышение отклонено"
 lsm_canal_events.1.t:0 "Завершение Уэллендского канала"
 lsm_canal_events.1.d:0 "После многих лет земляных работ, строительства шлюзов и инженерных трудов Уэллендский канал наконец открыт для движения. Теперь суда могут обходить великое препятствие — Ниагарский водопад, связывая озеро Онтарио с верхними Великими озёрами."
 lsm_canal_events.1.f:0 "Открытие канала превратило Великие озёра в непрерывный торговый водный путь. Суда с древесиной, зерном, рудой, промышленными товарами и пассажирами теперь могут ходить между внутренними озёрами и портами озера Онтарио, не выгружая грузы в обход Ниагары. То, что прежде было рядом отдельных внутренних морей, всё больше превращается в единую международную судоходную сеть, связывающую растущие поселения и промышленность Британской Северной Америки и Соединённых Штатов."
 lsm_canal_events.1.a:0 "Великие озёра открыты для торговли."
 mobilization_option_rail_transport: "Железнодорожный транспорт"
 mobilization_option_rail_transport_desc: "Позволить солдатам ездить по железной дороге за счёт государства."
