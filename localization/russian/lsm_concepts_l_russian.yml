 concept_sailor_desc: "[GetPopType('sailors').GetName] и [SelectLocalization(GetPlayer.IsValid,'concept_ship_crew_desc_added','Officers')], составляющие [concept_ship_crew] [concept_ship].\n\nСтроительство или расширение [GetBuildingType('building_naval_administration').GetName] [Concept('concept_building', '$concept_buildings$')] увеличивает число доступных $concept_sailors$. Бездействующие $concept_sailors$ всё равно получают жалование, поэтому избыточная численность приводит к напрасным [concept_government_expenses]."
