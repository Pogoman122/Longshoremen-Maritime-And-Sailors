l_russian:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Ункяр-Искелесийский договор"
 hunkar_iskelesi:0 "Соглашение Хюнкяр-Искелеси"
 hunkar_iskelesi_desc:0 "Русско-османское соглашение ставит вопрос о проходе через Турецкие проливы в центр европейской дипломатии."
 hunkar_iskelesi_article_short_desc:0 "Сохранять действующее русско-османское соглашение до открытия конференции по проливам."
 hunkar_iskelesi_effects_desc:0 "Соглашение улучшает русско-османские отношения и остаётся в силе до открытия конференции по проливам."
 lsm_hunkar_not_superseded_tt:0 "Конференция по проливам ещё не заменила соглашение Хюнкяр-Искелеси."
 je_straits_question:0 "Вопрос о проливах"
 je_straits_question_reason:0 "Великобритания, Франция, Австрия, Пруссия и Россия имеют шесть месяцев, чтобы выбрать урегулирование для Турецких проливов. Каждая делегация подаёт один голос. Неподанные голоса распределяются после закрытия голосования. Затем Порта имеет шесть месяцев, чтобы принять или отклонить победившую конвенцию; молчание считается согласием. Хотя каждая великая держава может стремиться сохранить стабильность в Европе, некоторые исходы способны привести к непредвиденным последствиям..."
 je_straits_question_status:0 "Урегулирование прохода через Босфор и Дарданеллы."
 lsm_straits_conference_open_tt:0 "Соглашение Хюнкяр-Искелеси завершилось, и конференция по проливам открылась."
 lsm_straits_ballot_complete_tt:0 "Делегаты выбрали победившее предложение."
 lsm_straits_settlement_accepted_tt:0 "Порта приняла конвенцию, либо восторжествовал османский суверенитет."
 lsm_straits_settlement_rejected_tt:0 "Предложенное урегулирование отклонено или больше не может быть заключено."
 lsm_straits_voting_open_tt:0 "Шестимесячный период голосования всё ещё открыт."
 lsm_straits_not_voted_tt:0 "Наша делегация ещё не подала голос."
 lsm_straits_russia_exists_tt:0 "Россия существует и может получить предложенные права прохода."
 lsm_straits_ottoman_decision_pending_tt:0 "Порта ещё не приняла и не отклонила победившее предложение."
 lsm_straits_human_withdrawal_tt:0 "Подписанты под управлением ИИ не будут добровольно выходить из этого соглашения."
 straits_ancient_rule_button:0 "Подтвердить Древнее правило"
 straits_ancient_rule_button_desc:0 "Поддержать конвенцию, требующую не допускать иностранные военные корабли в Турецкие проливы. В случае принятия Порта заключает конвенции с участвующими державами. Порта под управлением ИИ отдаёт приоритет военному закрытию, ограничивая проход контролирующей стороной; Порта под управлением игрока должна соблюдать условия вручную. Существующие договорные исключения для прохода продолжают действовать."
 straits_open_passage_button:0 "Свободный проход для всех"
 straits_open_passage_button_desc:0 "Поддержать обязательные конвенции, не позволяющие Порте закрывать проливы для какой-либо страны. Гарантия прохода распространяется и на страны вне этой конференции. Пошлины не отменяются."
 straits_russian_entente_button:0 "Принять позицию России"
 straits_russian_entente_button_desc:0 "Поддержать проход российских военных кораблей и недопущение других иностранных военных судов. Россия получает договорное исключение для прохода. Порта под управлением ИИ отдаёт приоритет военному закрытию с проходом, ограниченным контролирующей стороной, тогда как Россия сохраняет исключение. Порта под управлением игрока должна устанавливать закрытие вручную; другие существующие исключения продолжают действовать."
 straits_ottoman_prerogative_button:0 "Суверенитет Блистательной Порты"
 straits_ottoman_prerogative_button_desc:0 "Оставить вопрос прохода через Турецкие проливы османскому правительству. Если это предложение победит, конференция завершится без создания нового договора и без навязывания прав прохода."
 lsm_straits_vote_ancient_rule_tt:0 "Отдать наш голос за Древнее правило. Этот голос не вводит конвенцию до завершения конференции."
 lsm_straits_vote_open_passage_tt:0 "Отдать наш голос за гарантированный проход для всех стран."
 lsm_straits_vote_russian_entente_tt:0 "Отдать наш голос за российские привилегии прохода."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Отдать наш голос за османский суверенитет и отсутствие нового договора."
 straits_conference_approve_button:0 "Принять конвенцию"
 straits_conference_approve_button_desc:0 "Принять победившее предложение и заключить соответствующие соглашения с сохранившимися державами конференции. Соглашения имеют пятилетний обязательный срок."
 straits_conference_reject_button:0 "Отклонить конвенцию"
 straits_conference_reject_button_desc:0 "Отклонить победившее предложение. Конференция распадётся, и новые конвенционные договоры созданы не будут."
 lsm_straits_accept_settlement_tt:0 "Заключить соглашения, требуемые победившим предложением."
 lsm_straits_reject_settlement_tt:0 "Завершить конференцию без создания новой конвенции."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Лондонская конвенция о проливах: Древнее правило"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Лондонская конвенция о проливах: Свободный проход"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Лондонская конвенция о проливах: Российские привилегии"
 straits_question_events.1.t:0 "Вопрос о проливах"
 straits_question_events.1.d:0 "Соглашение Хюнкяр-Искелеси заменяется новым порядком, вновь поднимая вопрос о том, кто может проводить военные корабли через Босфор и Дарданеллы. Великобритания, Франция, Австрия, Пруссия и Россия предложат урегулирование на рассмотрение османского правительства."
 straits_question_events.1.f:0 "У делегатов есть шесть месяцев, чтобы согласовать предложение."
 straits_question_events.1.a:0 "Открыть конференцию."
 straits_question_events.4.t:0 "Лондонская конвенция"
 straits_question_events.4.t_sovereignty:0 "Порта сохраняет контроль"
 straits_question_events.4.d1:0 "Порта и участвующие державы заключили конвенцию, подтверждающую Древнее правило. Иностранные военные корабли не должны допускаться в Турецкие проливы, тогда как торговое судоходство остаётся свободным. Османское правительство обязано поддерживать военное закрытие."
 straits_question_events.4.d2:0 "Конференция признала российские привилегии прохода. Россия получает гарантированный проход военных кораблей через проливы под османским контролем, а сопутствующие конвенции требуют исключения других иностранных флотов. Османское правительство отвечает за соблюдение этого запрета."
 straits_question_events.4.d3:0 "Порта приняла конвенции, гарантирующие проход через её проливы всем странам. Османскому правительству запрещено закрывать проливы, пока эти соглашения остаются в силе. Проход гарантируется и странам, не участвовавшим в конференции."
 straits_question_events.4.d4:0 "Державы признали османский контроль над проходом через Турецкие проливы. Новый конвенционный договор не создан, и ни одно иностранное правительство не получает права прохода по этому урегулированию. Султан сохраняет право решать вопрос доступа."
 straits_question_events.4.f:0 "Делегаты завершили свою работу."
 straits_question_events.4.a:0 "Конференция завершена."
 straits_question_events.5.t:0 "Конференция по проливам рушится"
 straits_question_events.5.d:0 "Предложенное урегулирование не привело к соглашению. Новая конвенция не заключена, а вопрос прохода через Турецкие проливы остаётся нерешённым."
 straits_question_events.5.f:0 "Делегаты уезжают без соглашения."
 straits_question_events.5.a:0 "Соглашения нет."
 lsm_straits_ancient_rule:0 "Древнее правило"
 lsm_straits_ancient_rule_desc:0 "Порта обязуется закрывать Турецкие проливы для иностранных военных кораблей."
 lsm_straits_ancient_rule_article_short_desc:0 "Порта обязуется закрывать Турецкие проливы для иностранных военных кораблей."
 lsm_straits_ancient_rule_effects_desc:0 "Порта под управлением ИИ отдаёт приоритет военному закрытию, ограничивая проход контролирующей стороной, пока действует статья конвенции. Торговля остаётся открытой, а договорные исключения для прохода продолжают действовать. Порта под управлением игрока должна устанавливать военное закрытие вручную."
 lsm_straits_open_passage:0 "Свободный проход для всех"
 lsm_straits_open_passage_desc:0 "Порта гарантирует всем странам проход через свои проливы."
 lsm_straits_open_passage_article_short_desc:0 "Порта гарантирует всем странам проход через свои проливы."
 lsm_straits_open_passage_effects_desc:0 "Страна-источник не может закрыть свои проливы, пока эта статья действует. Это относится ко всем странам, включая не участвующие в конференции. Пошлины не отменяются."
 lsm_straits_russian_entente:0 "Признание российских привилегий"
 lsm_straits_russian_entente_desc:0 "Державы признают российские привилегии прохода и требуют не допускать другие иностранные военные корабли."
 lsm_straits_russian_entente_article_short_desc:0 "Державы признают российские привилегии прохода и требуют не допускать другие иностранные военные корабли."
 lsm_straits_russian_entente_effects_desc:0 "Порта под управлением ИИ отдаёт приоритет военному закрытию, ограничивая проход контролирующей стороной, пока действует статья конвенции. Россия получает исключение для прохода из статьи «Проход российских военных кораблей». Другие договорные исключения продолжают действовать. Порта под управлением игрока должна устанавливать военное закрытие вручную."
 lsm_straits_russian_access:0 "Проход российских военных кораблей"
 lsm_straits_russian_access_desc:0 "Порта предоставляет России проход военных кораблей через проливы под османским контролем."
 lsm_straits_russian_access_article_short_desc:0 "Порта предоставляет России проход военных кораблей через проливы под османским контролем."
 lsm_straits_russian_access_effects_desc:0 "Страна-источник предоставляет целевой стране военный проход через свои проливы. Это не даёт сухопутного военного доступа и не закрывает автоматически проход для третьих стран."
