l_polish:
 revolution_pulse1_events.8.t: "Marynarze zostają na lądzie"
 revolution_pulse1_events.8.d: "[GetPopType('sailors').GetName] w [SCOPE.sState('coastal_navy_state').GetName] odmówili wypłynięcia w jakikolwiek rejs poza port. Skala buntu wymaga ostrożnego podejścia do sytuacji."
 revolution_pulse1_events.8.f: ""To bardzo proste. Mamy żądania. Nie wypłyniemy, dopóki nie zostaną spełnione.""
 revolution_pulse1_events.8.a: "Zatrzymać ludzi i ograniczyć incydent do [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Siłą zapędzić ludzi na ich statki."
 revolution_pulse1_events.8.c: "Spróbować porozmawiać z [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Rewolucjoniści wzniecają bunt"
 revolution_lsm_events.1.d: "Grupa rewolucjonistów, o których mówi się, że są związani z [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName], obezwładniła marynarzy w [SCOPE.sState('lsm_ship_mutiny_state').GetName], pozostawiając dwa tuziny zabitych, po czym wypłynęła w morze uzbrojonym statkiem."
 revolution_lsm_events.1.f: "#bold Poszukiwani: złodzieje statku#! \n\nPonad 30 mężczyzn jest podejrzewanych o udział w kradzieży statku w [SCOPE.sState('coastal_navy_state').GetName]. £200 za każdego schwytanego lub zabitego; £50 za informacje prowadzące do schwytania lub śmierci sprawców.\n\nUznaje się ich za uzbrojonych i niebezpiecznych. Współpracownicy będą uznani za równie winnych."
 revolution_lsm_events.1.a: "Przeszukać porty w ich poszukiwaniu."
 revolution_lsm_events.1.b: "Zamiast tego przeszukać łowiska."
 lsm_events.1.t:0 "Zagubieni w ciemności"
 lsm_events.1.d:0 "Prom przewożący dokerów uderzył w skały na nieoświetlonym podejściu do portu w [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Około 150 dokerów utonęło."
 lsm_events.1.f:0 "Krewni czekają na nabrzeżu, gdy ratownicy wynoszą ciała na ląd. Ocaleni mówią, że załoga straciła orientację w ciemności. Bez latarni wyznaczającej podejście dostrzegli skały dopiero chwilę przed uderzeniem."
 lsm_events.1.a:0 "Być może należy coś z tym zrobić."
 lsm_events.1.deaths_tt:0 "Około #N 150#! dokerów w [SCOPE.sState('lsm_lighthouse_accident_state').GetName] zginęło."
 modifier_scouring_ports: "Przeszukiwanie portów"
 modifier_scouring_fisheries: "Przeszukiwanie łowisk"
 lsm_admirals.1.t:0 "Czas na awans"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] domaga się awansu [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], wskazując na [SCOPE.sCharacter('low_rank_admiral').GetHerHis] historię lojalnej i skutecznej służby."
 lsm_admirals.1.f:1 "Na kurtce [SCOPE.sCharacter('low_rank_admiral').GetHerHis] wisiało tyle medali, że ledwo było widać materiał pod spodem, ale wciąż było ich za mało. Wypinając pierś z dumą, [SCOPE.sCharacter('low_rank_admiral').GetSheHe] uśmiechnął się, wyobrażając sobie minę [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting], gdy [SCOPE.sCharacter('high_rank_admiral').GetRankName] dowie się o rychłym awansie [SCOPE.sCharacter('low_rank_admiral').GetHerHis]; ich rywalizacja była legendarna wśród oficerów.\n\nWreszcie [SCOPE.sCharacter('low_rank_admiral').GetSheHe] otrzyma to, co [SCOPE.sCharacter('low_rank_admiral').GetHerHis] należne."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] zasłużył na to."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] nie zmusi nas do działania."
 low_rank_admiral_ig_opinion_add:0 "Awansowano wybitnego admirała"
 low_rank_admiral_ig_opinion_remove:0 "Odmówiono awansu admirała"
 high_rank_admiral_ig_opinion_add:0 "Zablokowano awans rywala"
 denied_promotion:0 "Odmówiono awansu"
 lsm_canal_events.1.t:0 "Ukończenie Kanału Welland"
 lsm_canal_events.1.d:0 "Po latach wykopów, budowy śluz i prac inżynieryjnych Kanał Welland został wreszcie otwarty dla ruchu. Statki mogą teraz omijać wielką przeszkodę w postaci wodospadu Niagara, łącząc jezioro Ontario z górnymi Wielkimi Jeziorami."
 lsm_canal_events.1.f:0 "Otwarcie kanału przekształciło Wielkie Jeziora w ciągły szlak handlowy. Statki przewożące drewno, zboże, rudę, towary przemysłowe i pasażerów mogą teraz pływać między jeziorami wewnętrznymi a portami jeziora Ontario bez wyładowywania ładunków wokół Niagary. To, co niegdyś było szeregiem oddzielnych mórz śródlądowych, coraz bardziej staje się jedną międzynarodową siecią żeglugową, łączącą rozwijające się osady i przemysł Brytyjskiej Ameryki Północnej oraz Stanów Zjednoczonych."
 lsm_canal_events.1.a:0 "Wielkie Jeziora są otwarte dla handlu."
 mobilization_option_rail_transport: "Transport kolejowy"
 mobilization_option_rail_transport_desc: "Pozwól żołnierzom podróżować koleją na koszt państwa."
