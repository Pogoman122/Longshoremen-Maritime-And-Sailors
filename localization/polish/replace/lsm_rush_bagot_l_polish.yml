l_polish:
 lsm_rb_journal_group:0 "Porozumienia morskie"
 lsm_je_rush_bagot:0 "Układ Rush–Bagot"
 lsm_je_rush_bagot_reason:0 "Układ z 1817 roku ograniczał brytyjskie i amerykańskie uzbrojenie morskie na Wielkich Jeziorach i jeziorze Champlain. Jego obietnicą była pokojowa granica, na której po jeziorach mogło pływać jedynie kilka lekko uzbrojonych jednostek.\n\nPodtrzymujemy to rozwiązanie, ograniczając budowę nowych baz morskich w Ontario, Ohio, Michigan, Indianie, Illinois, Wisconsin i Minnesocie. Porty handlowe i żegluga cywilna pozostają otwarte. Układ wiąże Stany Zjednoczone oraz brytyjskie lub kanadyjskie władze na północnym brzegu.\n\nPoważne pogorszenie stosunków może skłonić sygnatariusza do złożenia sześciomiesięcznego wypowiedzenia. Wojna między stronami zawiesza ograniczenia. Późniejsze odnowienie wymaga rozbrojenia i zgody każdego suwerennego sygnatariusza."
 lsm_je_rush_bagot_status:0 "Warunki Układu Rush–Bagot są obecnie przeglądane."
 lsm_rb_naval_restrictions:0 "Ograniczenia morskie Rush–Bagot"
 lsm_rb_naval_restrictions_desc:0 "Układ Rush–Bagot ogranicza rozbudowę baz morskich na tych brzegach. Porty handlowe pozostają otwarte."
 lsm_rb_status_active:0 "#P Układ obowiązuje#!\nBudowa nowych baz morskich jest ograniczona w objętych nim stanach nad jeziorami. Porty handlowe pozostają otwarte."
 lsm_rb_status_notice:0 "#Y Wypowiedzenie układu#!\nSygnatariusz złożył sześciomiesięczne wypowiedzenie. Ograniczenia pozostają w mocy do końca okresu wypowiedzenia, chyba że między stronami wybuchnie wojna."
 lsm_rb_status_war:0 "#N Wojna między sygnatariuszami#!\nOgraniczenia morskie zostają zniesione. Sam pokój nie przywróci układu."
 lsm_rb_status_lapsed:0 "#Y Układ nie obowiązuje#!\nStrony mogą się ponownie zbroić. Odnowienie wymaga pokojowych stosunków, rozebrania baz morskich w objętych stanach i zgody wszystkich suwerennych sygnatariuszy."
 lsm_rb_status_no_counterpart:0 "Układ nie ma odpowiedniego partnera. Ograniczenia morskie zostają zniesione. Jeśli ponownie pojawią się uprawnieni sygnatariusze, trzeba będzie wynegocjować nowy układ."
 lsm_rb_status_breach:0 "#N Bazy morskie wciąż istnieją na jeziorach#!\nUkład pozostaje w mocy, ale istniejące bazy morskie w objętych stanach muszą zostać zlikwidowane. Dalsza rozbudowa jest ograniczona."
 lsm_rb_status_our_consent:0 "#Y Oczekiwanie na pozostałych sygnatariuszy#!\nWyraziliśmy zgodę na odnowienie. Nasza oferta pozostaje ważna przez sześć miesięcy, o ile nadal spełniane są warunki odnowienia."
 lsm_rb_status_offer:0 "#Y Zaproponowano odnowienie#!\nCo najmniej jeden sygnatariusz zaproponował odnowienie układu. Każdy suwerenny sygnatariusz musi wyrazić własną zgodę."
 lsm_rb_notice_button_name:0 "Złóż wypowiedzenie"
 lsm_rb_notice_button_desc:0 "Uruchom sześciomiesięczną klauzulę wypowiedzenia układu. Pogarsza to stosunki i otwiera drogę do ponownego zbrojenia morskiego po upływie okresu wypowiedzenia."
 lsm_rb_notice_requirements_tt:0 "Musimy być suwerennym sygnatariuszem, układ musi obowiązywać, a stosunki z przeciwnym sygnatariuszem muszą wynosić −50 lub mniej. Strony nie mogą być ze sobą w stanie wojny."
 lsm_rb_notice_effect_tt:0 "Złóż sześciomiesięczne wypowiedzenie. Ograniczenia morskie obowiązują w tym okresie. Stosunki z przeciwnym sygnatariuszem lub sygnatariuszami spadają o 10. Po wygaśnięciu wypowiedzenia wszystkie strony zostają zwolnione z układu."
 lsm_rb_renewal_button_name:0 "Wyraź zgodę na odnowienie układu"
 lsm_rb_renewal_button_desc:0 "Zaproponuj przywrócenie pokojowego porozumienia. Układ zaczyna obowiązywać dopiero wtedy, gdy wszyscy suwerenni sygnatariusze wyrażą zgodę."
 lsm_rb_renewal_requirements_tt:0 "Musimy być suwerennym sygnatariuszem, układ musi wygasnąć, a sygnatariusze muszą pozostawać ze sobą w pokoju. Nasze stosunki z przeciwnymi sygnatariuszami muszą wynosić co najmniej 0. Żaden uczestnik nie może utrzymywać bazy morskiej w objętych stanach nad jeziorami. Nie możemy już mieć oczekującej oferty."
 lsm_rb_renewal_effect_tt:0 "Wyraź zgodę na odnowienie na sześć miesięcy. Gdy wszyscy suwerenni sygnatariusze się zgodzą, ograniczenia dotyczące baz morskich wracają. Wojna, pogorszenie stosunków lub ponowne zbrojenie na jeziorach unieważnia oczekującą zgodę."
 lsm_rush_bagot.1.t:0 "Wypowiedzenie na jeziorach"
 lsm_rush_bagot.1.d:0 "Jeden z sygnatariuszy uruchomił klauzulę wypowiedzenia Układu Rush–Bagot. Rozpoczął się sześciomiesięczny okres wypowiedzenia. Do jego końca ograniczenia morskie pozostają wiążące."
 lsm_rush_bagot.1.f:0 "Depesza podróżuje szybciej, niż można wyposażyć okręt. Na obu brzegach ministrowie liczą miesiące."
 lsm_rush_bagot.1.a:0 "Układ nadal nas wiąże — na razie."
 lsm_rush_bagot.2.t:0 "Wypowiedzenie wygasa"
 lsm_rush_bagot.2.d:0 "Okres wypowiedzenia dobiegł końca. Ograniczenia morskie Rush–Bagot zostają zniesione, a sygnatariusze mogą swobodnie tworzyć bazy morskie w stanach nad jeziorami."
 lsm_rush_bagot.2.f:0 "Te same stocznie, które służyły handlowi na jeziorach, mogą teraz służyć innemu celowi."
 lsm_rush_bagot.2.a:0 "Nowy rozdział na jeziorach."
 lsm_rush_bagot.3.t:0 "Jeziora podczas wojny"
 lsm_rush_bagot.3.d:0 "Wojna postawiła strony Układu Rush–Bagot po przeciwnych stronach. Jego ograniczenia morskie zostają zawieszone, a wszelkie oczekujące wypowiedzenia lub oferty odnowienia anulowane."
 lsm_rush_bagot.3.f:0 "Granicę, którą kiedyś mierzono ładunkami, znów mierzy się działami."
 lsm_rush_bagot.3.a:0 "Przygotować się do wojny."
 lsm_rush_bagot.4.t:0 "Pokój bez rozbrojenia"
 lsm_rush_bagot.4.d:0 "Wojna między stronami traktatu dobiegła końca. Ograniczenia morskie pozostają zniesione. Przywrócenie układu będzie wymagało likwidacji baz w objętych stanach nad jeziorami i uzyskania nowej zgody każdego suwerennego sygnatariusza."
 lsm_rush_bagot.4.f:0 "Rozejm może uciszyć działa. Potrzeba jednak kolejnego układu, by sprowadzić je na ląd."
 lsm_rush_bagot.4.a:0 "Możemy wrócić do stołu negocjacyjnego."
 lsm_rush_bagot.5.t:0 "Oferta odnowienia Rush–Bagot"
 lsm_rush_bagot.5.d:0 "Sygnatariusz zaproponował odnowienie układu. Jeśli chcemy dołączyć, możemy odnotować zgodę we wpisie dziennika Rush–Bagot. Wszyscy suwerenni sygnatariusze muszą się zgodzić, a każda oferta wygasa po sześciu miesiącach."
 lsm_rush_bagot.5.f:0 "Starą korespondencję wyjęto z archiwów. Jest miejsce na nowe podpisy."
 lsm_rush_bagot.5.a:0 "Rozważyć propozycję."
 lsm_rush_bagot.6.t:0 "Przywrócono pokojowe porozumienie"
 lsm_rush_bagot.6.d:0 "Wszyscy suwerenni sygnatariusze zgodzili się odnowić porozumienie Rush–Bagot. Ograniczenia dotyczące baz morskich wracają w objętych stanach nad jeziorami. Handel na jeziorach może nadal swobodnie rosnąć."
 lsm_rush_bagot.6.f:0 "Kapitanowie jezior obserwują pogodę, mielizny i opłacalne ładunki. Na razie to wystarczy."
 lsm_rush_bagot.6.a:0 "Oby jeziora pozostały spokojne."
 lsm_rush_bagot.7.t:0 "Uzbrojenie morskie na jeziorach"
 lsm_rush_bagot.7.d:0 "Utrzymujemy bazy morskie w stanach objętych ograniczeniami Rush–Bagot. Bazy te muszą zostać zlikwidowane, aby dotrzymać układu. Dalsza rozbudowa jest ograniczona; porty handlowe mogą nadal działać."
 lsm_rush_bagot.7.f:0 "Depesza zadaje proste pytanie: dlaczego na naszym brzegu wciąż wyposaża się okręty wojenne?"
 lsm_rush_bagot.7.a:0 "Dokonać przeglądu naszych instalacji na jeziorach."
 lsm_rb_naval_construction_allowed_tt:0 "Układ Rush–Bagot musi zezwalać na budowę morską w tym stanie."
