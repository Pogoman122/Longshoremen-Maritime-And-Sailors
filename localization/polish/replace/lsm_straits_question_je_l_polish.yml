l_polish:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Traktat w Hünkâr İskelesi"
 hunkar_iskelesi:0 "Układ Hünkâr İskelesi"
 hunkar_iskelesi_desc:0 "Układ rosyjsko-osmański stawia kwestię przepływu przez Cieśniny Tureckie w centrum europejskiej dyplomacji."
 hunkar_iskelesi_article_short_desc:0 "Utrzymać obecny układ rosyjsko-osmański do otwarcia konferencji w sprawie cieśnin."
 hunkar_iskelesi_effects_desc:0 "Układ poprawia stosunki rosyjsko-osmańskie i pozostaje w mocy do otwarcia konferencji w sprawie cieśnin."
 lsm_hunkar_not_superseded_tt:0 "Konferencja w sprawie cieśnin nie zastąpiła jeszcze Układu Hünkâr İskelesi."
 je_straits_question:0 "Kwestia Cieśnin"
 je_straits_question_reason:0 "Wielka Brytania, Francja, Austria, Prusy i Rosja mają sześć miesięcy na wybór rozwiązania dla Cieśnin Tureckich. Każda delegacja oddaje jeden głos. Nieoddane głosy są przydzielane po zamknięciu głosowania. Wysoka Porta ma następnie sześć miesięcy na przyjęcie lub odrzucenie zwycięskiej konwencji; milczenie oznacza zgodę. Choć każde mocarstwo może chcieć utrzymać stabilność w Europie, niektóre wyniki mogą mieć nieprzewidziane konsekwencje..."
 je_straits_question_status:0 "Rozwiązanie kwestii przepływu przez Bosfor i Dardanele."
 lsm_straits_conference_open_tt:0 "Układ Hünkâr İskelesi wygasł i konferencja w sprawie cieśnin została otwarta."
 lsm_straits_ballot_complete_tt:0 "Delegaci wybrali zwycięską propozycję."
 lsm_straits_settlement_accepted_tt:0 "Wysoka Porta przyjęła konwencję albo zwyciężyła suwerenność osmańska."
 lsm_straits_settlement_rejected_tt:0 "Proponowane rozwiązanie zostało odrzucone lub nie może już zostać zawarte."
 lsm_straits_voting_open_tt:0 "Sześciomiesięczny okres głosowania wciąż trwa."
 lsm_straits_not_voted_tt:0 "Nasza delegacja jeszcze nie oddała głosu."
 lsm_straits_russia_exists_tt:0 "Rosja istnieje i może otrzymać proponowane prawa przepływu."
 lsm_straits_ottoman_decision_pending_tt:0 "Wysoka Porta nie przyjęła jeszcze ani nie odrzuciła zwycięskiej propozycji."
 lsm_straits_human_withdrawal_tt:0 "Sygnatariusze kontrolowani przez SI nie wycofają się dobrowolnie z tego układu."
 straits_ancient_rule_button:0 "Potwierdź Dawną Zasadę"
 straits_ancient_rule_button_desc:0 "Poprzyj konwencję wymagającą wykluczenia obcych okrętów wojennych z Cieśnin Tureckich. Jeśli zostanie przyjęta, Wysoka Porta podpisze konwencje z uczestniczącymi mocarstwami. Porta kontrolowana przez SI priorytetowo traktuje zamknięcie militarne z przepływem ograniczonym do kontrolującego; Porta kontrolowana przez gracza musi ręcznie przestrzegać warunków. Istniejące traktatowe wyjątki dotyczące przepływu nadal obowiązują."
 straits_open_passage_button:0 "Swobodny przepływ dla wszystkich"
 straits_open_passage_button_desc:0 "Poprzyj wiążące konwencje uniemożliwiające Wysokiej Porcie zamknięcie cieśnin dla któregokolwiek państwa. Gwarancja przepływu obejmuje także państwa spoza tej konferencji. Nie znosi opłat."
 straits_russian_entente_button:0 "Zaakceptuj stanowisko Rosji"
 straits_russian_entente_button_desc:0 "Poprzyj rosyjski przepływ morski i wykluczenie innych obcych okrętów wojennych. Rosja otrzymuje traktatowy wyjątek dotyczący przepływu. Porta kontrolowana przez SI priorytetowo traktuje zamknięcie militarne z przepływem ograniczonym do kontrolującego, podczas gdy Rosja zachowuje wyjątek. Porta kontrolowana przez gracza musi ręcznie egzekwować zamknięcie; pozostałe istniejące wyjątki nadal obowiązują."
 straits_ottoman_prerogative_button:0 "Suwerenność Wysokiej Porty"
 straits_ottoman_prerogative_button_desc:0 "Pozostaw kwestię przepływu przez Cieśniny Tureckie rządowi osmańskiemu. Jeśli ta propozycja zwycięży, konferencja zakończy się bez stworzenia nowego traktatu i bez narzucenia praw przepływu."
 lsm_straits_vote_ancient_rule_tt:0 "Oddaj nasz głos za Dawną Zasadą. Głos ten nie narzuca konwencji przed zakończeniem konferencji."
 lsm_straits_vote_open_passage_tt:0 "Oddaj nasz głos za przepływem gwarantowanym wszystkim państwom."
 lsm_straits_vote_russian_entente_tt:0 "Oddaj nasz głos za rosyjskimi przywilejami przepływu."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Oddaj nasz głos za suwerennością osmańską i brakiem nowego traktatu."
 straits_conference_approve_button:0 "Przyjmij konwencję"
 straits_conference_approve_button_desc:0 "Przyjmij zwycięską propozycję i zawrzyj odpowiednie układy z pozostałymi mocarstwami konferencji. Układy mają pięcioletni okres obowiązywania."
 straits_conference_reject_button:0 "Odrzuć konwencję"
 straits_conference_reject_button_desc:0 "Odrzuć zwycięską propozycję. Konferencja się rozpadnie i nie zostaną utworzone żadne nowe traktaty konwencyjne."
 lsm_straits_accept_settlement_tt:0 "Zawrzyj układy wymagane przez zwycięską propozycję."
 lsm_straits_reject_settlement_tt:0 "Zakończ konferencję bez tworzenia nowej konwencji."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Londyńska Konwencja Cieśnin: Dawna Zasada"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Londyńska Konwencja Cieśnin: Swobodny Przepływ"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Londyńska Konwencja Cieśnin: Przywileje Rosyjskie"
 straits_question_events.1.t:0 "Kwestia Cieśnin"
 straits_question_events.1.d:0 "Układ Hünkâr İskelesi jest zastępowany, co ponownie otwiera pytanie, kto może wysyłać okręty wojenne przez Bosfor i Dardanele. Wielka Brytania, Francja, Austria, Prusy i Rosja przedstawią rozwiązanie do rozpatrzenia przez rząd osmański."
 straits_question_events.1.f:0 "Delegaci mają sześć miesięcy na uzgodnienie propozycji."
 straits_question_events.1.a:0 "Otwórz konferencję."
 straits_question_events.4.t:0 "Konwencja londyńska"
 straits_question_events.4.t_sovereignty:0 "Porta zachowuje kontrolę"
 straits_question_events.4.d1:0 "Wysoka Porta i uczestniczące mocarstwa zawarły konwencję potwierdzającą Dawną Zasadę. Obce okręty wojenne mają być wykluczone z Cieśnin Tureckich, natomiast żegluga handlowa pozostaje wolna. Rząd osmański odpowiada za utrzymanie zamknięcia militarnego."
 straits_question_events.4.d2:0 "Konferencja zaakceptowała rosyjskie przywileje przepływu. Rosja otrzymuje gwarantowany przepływ morski przez cieśniny kontrolowane przez Osmanów, a towarzyszące konwencje przewidują wykluczenie innych obcych flot. Rząd osmański odpowiada za egzekwowanie tego wykluczenia."
 straits_question_events.4.d3:0 "Wysoka Porta przyjęła konwencje gwarantujące wszystkim państwom przepływ przez jej cieśniny. Rząd osmański nie może zamknąć cieśnin, dopóki układy te pozostają w mocy. Przepływ jest gwarantowany również państwom spoza grona sygnatariuszy konferencji."
 straits_question_events.4.d4:0 "Mocarstwa zaakceptowały osmańską kontrolę nad przepływem przez Cieśniny Tureckie. Nie utworzono nowego traktatu konwencyjnego i żaden obcy rząd nie otrzymuje z tego rozwiązania praw przepływu. Sułtan zachowuje swobodę decyzji w sprawie dostępu."
 straits_question_events.4.f:0 "Delegaci zakończyli swoje obrady."
 straits_question_events.4.a:0 "Konferencja dobiegła końca."
 straits_question_events.5.t:0 "Konferencja w sprawie cieśnin upada"
 straits_question_events.5.d:0 "Proponowane rozwiązanie nie doprowadziło do porozumienia. Nie zawarto nowej konwencji, a kwestia przepływu przez Cieśniny Tureckie pozostaje nierozwiązana."
 straits_question_events.5.f:0 "Delegaci odjeżdżają bez porozumienia."
 straits_question_events.5.a:0 "Nie ma porozumienia."
 lsm_straits_ancient_rule:0 "Dawna Zasada"
 lsm_straits_ancient_rule_desc:0 "Wysoka Porta zobowiązuje się zamknąć Cieśniny Tureckie dla obcych okrętów wojennych."
 lsm_straits_ancient_rule_article_short_desc:0 "Wysoka Porta zobowiązuje się zamknąć Cieśniny Tureckie dla obcych okrętów wojennych."
 lsm_straits_ancient_rule_effects_desc:0 "Porta kontrolowana przez SI priorytetowo traktuje zamknięcie militarne z przepływem ograniczonym do kontrolującego, dopóki obowiązuje artykuł konwencji. Handel pozostaje otwarty, a traktatowe wyjątki dotyczące przepływu nadal obowiązują. Porta kontrolowana przez gracza musi ręcznie ustawić zamknięcie militarne."
 lsm_straits_open_passage:0 "Swobodny przepływ dla wszystkich"
 lsm_straits_open_passage_desc:0 "Wysoka Porta gwarantuje wszystkim państwom przepływ przez swoje cieśniny."
 lsm_straits_open_passage_article_short_desc:0 "Wysoka Porta gwarantuje wszystkim państwom przepływ przez swoje cieśniny."
 lsm_straits_open_passage_effects_desc:0 "Państwo źródłowe nie może zamknąć swoich cieśnin, dopóki ten artykuł pozostaje w mocy. Dotyczy to każdego państwa, w tym państw spoza konferencji. Opłaty nie są znoszone."
 lsm_straits_russian_entente:0 "Uznanie rosyjskich przywilejów"
 lsm_straits_russian_entente_desc:0 "Mocarstwa uznają rosyjskie przywileje przepływu i domagają się wykluczenia innych obcych okrętów wojennych."
 lsm_straits_russian_entente_article_short_desc:0 "Mocarstwa uznają rosyjskie przywileje przepływu i domagają się wykluczenia innych obcych okrętów wojennych."
 lsm_straits_russian_entente_effects_desc:0 "Porta kontrolowana przez SI priorytetowo traktuje zamknięcie militarne z przepływem ograniczonym do kontrolującego, dopóki obowiązuje artykuł konwencji. Rosja otrzymuje wyjątek dotyczący przepływu z artykułu Rosyjski Przepływ Morski. Inne wyjątki traktatowe nadal obowiązują. Porta kontrolowana przez gracza musi ręcznie ustawić zamknięcie militarne."
 lsm_straits_russian_access:0 "Rosyjski przepływ morski"
 lsm_straits_russian_access_desc:0 "Wysoka Porta przyznaje Rosji prawo przepływu morskiego przez cieśniny kontrolowane przez Osmanów."
 lsm_straits_russian_access_article_short_desc:0 "Wysoka Porta przyznaje Rosji prawo przepływu morskiego przez cieśniny kontrolowane przez Osmanów."
 lsm_straits_russian_access_effects_desc:0 "Państwo źródłowe przyznaje państwu docelowemu prawo wojskowego przepływu przez swoje cieśniny. Nie daje to lądowego dostępu wojskowego ani nie zamyka automatycznie przepływu państwom trzecim."
