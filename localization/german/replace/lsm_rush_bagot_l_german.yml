l_german:
 lsm_rb_journal_group:0 "Maritime Abkommen"
 lsm_je_rush_bagot:0 "Das Rush–Bagot-Abkommen"
 lsm_je_rush_bagot_reason:0 "Das Abkommen von 1817 begrenzte die britische und amerikanische Seerüstung auf den Großen Seen und dem Champlainsee. Es versprach eine friedliche Grenze, an der auf den Seen nur wenige leicht bewaffnete Schiffe zugelassen waren.\n\nWir wahren diese Regelung, indem wir neue Marinestützpunkte in Ontario, Ohio, Michigan, Indiana, Illinois, Wisconsin und Minnesota beschränken. Handelshäfen und die zivile Schifffahrt bleiben geöffnet. Das Abkommen bindet die Vereinigten Staaten sowie die britischen oder kanadischen Behörden am Nordufer.\n\nStark zerrüttete Beziehungen können eine Vertragspartei dazu veranlassen, mit einer Frist von sechs Monaten ihren Austritt anzukündigen. Ein Krieg zwischen den Parteien setzt die Beschränkungen aus. Danach erfordert eine Erneuerung die Abrüstung und die Zustimmung jeder souveränen Vertragspartei."
 lsm_je_rush_bagot_status:0 "Die Bestimmungen des Rush–Bagot-Abkommens werden überprüft."
 lsm_rb_naval_restrictions:0 "Seerüstungsbeschränkungen des Rush–Bagot-Abkommens"
 lsm_rb_naval_restrictions_desc:0 "Das Rush–Bagot-Abkommen beschränkt den Ausbau von Marinestützpunkten an diesen Ufern. Handelshäfen bleiben geöffnet."
 lsm_rb_status_active:0 "#P Abkommen in Kraft#!\nNeue Marinestützpunkte sind in den betroffenen Bundesstaaten an den Seen beschränkt. Handelshäfen bleiben geöffnet."
 lsm_rb_status_notice:0 "#Y Austritt angekündigt#!\nEine Vertragspartei hat ihren Austritt mit einer Frist von sechs Monaten angekündigt. Die Beschränkungen bleiben bis zum Ablauf dieser Frist in Kraft, sofern zwischen den Parteien kein Krieg ausbricht."
 lsm_rb_status_war:0 "#N Krieg zwischen den Vertragsparteien#!\nDie Seerüstungsbeschränkungen sind aufgehoben. Frieden allein setzt das Abkommen nicht wieder in Kraft."
 lsm_rb_status_lapsed:0 "#Y Abkommen nicht in Kraft#!\nDie Parteien dürfen wieder aufrüsten. Eine Erneuerung erfordert friedliche Beziehungen, den Abbau der Marinestützpunkte in den betroffenen Bundesstaaten und die Zustimmung aller souveränen Vertragsparteien."
 lsm_rb_status_no_counterpart:0 "Das Abkommen hat keine geeignete Gegenpartei. Die Seerüstungsbeschränkungen sind aufgehoben. Kehren geeignete Vertragsparteien zurück, muss ein neues Abkommen ausgehandelt werden."
 lsm_rb_status_breach:0 "#N Marinestützpunkte an den Seen bestehen fort#!\nDas Abkommen bleibt in Kraft, doch bestehende Marinestützpunkte in den betroffenen Bundesstaaten müssen abgebaut werden. Ein weiterer Ausbau ist beschränkt."
 lsm_rb_status_our_consent:0 "#Y Warten auf die übrigen Vertragsparteien#!\nWir haben der Erneuerung zugestimmt. Unser Angebot bleibt sechs Monate lang bestehen, solange die Voraussetzungen für eine Erneuerung weiterhin erfüllt sind."
 lsm_rb_status_offer:0 "#Y Erneuerung vorgeschlagen#!\nMindestens eine Vertragspartei hat die Erneuerung des Abkommens angeboten. Jede souveräne Vertragspartei muss ihre eigene Zustimmung erteilen."
 lsm_rb_notice_button_name:0 "Austritt ankündigen"
 lsm_rb_notice_button_desc:0 "Beruft Euch auf die sechsmonatige Austrittsklausel des Abkommens. Dies schädigt die Beziehungen und eröffnet nach Ablauf der Frist den Weg zur erneuten Seerüstung."
 lsm_rb_notice_requirements_tt:0 "Wir müssen eine souveräne Vertragspartei sein, das Abkommen muss in Kraft sein und unsere Beziehungen zu einer gegnerischen Vertragspartei müssen −50 oder schlechter sein. Die Parteien dürfen sich nicht miteinander im Krieg befinden."
 lsm_rb_notice_effect_tt:0 "Kündigt den Austritt mit einer Frist von sechs Monaten an. Die Seerüstungsbeschränkungen gelten während dieser Zeit weiter. Die Beziehungen zur gegnerischen Vertragspartei oder zu den gegnerischen Vertragsparteien sinken um 10. Nach Ablauf der Frist sind alle Parteien von dem Abkommen entbunden."
 lsm_rb_renewal_button_name:0 "Der Erneuerung des Abkommens zustimmen"
 lsm_rb_renewal_button_desc:0 "Bietet die Wiederherstellung der friedlichen Regelung an. Das Abkommen tritt erst in Kraft, wenn jede souveräne Vertragspartei zustimmt."
 lsm_rb_renewal_requirements_tt:0 "Wir müssen eine souveräne Vertragspartei sein, das Abkommen muss außer Kraft sein und die Vertragsparteien müssen untereinander Frieden halten. Unsere Beziehungen zu den gegnerischen Vertragsparteien müssen mindestens 0 betragen. Kein Teilnehmer darf in den betroffenen Bundesstaaten an den Seen einen Marinestützpunkt unterhalten. Wir dürfen noch kein ausstehendes Angebot haben."
 lsm_rb_renewal_effect_tt:0 "Erteilt für sechs Monate unsere Zustimmung zur Erneuerung. Sobald alle souveränen Vertragsparteien zustimmen, treten die Beschränkungen für Marinestützpunkte wieder in Kraft. Krieg, sich verschlechternde Beziehungen oder eine erneute Aufrüstung auf den Seen machen eine ausstehende Zustimmung ungültig."
 lsm_rush_bagot.1.t:0 "Mitteilung an den Seen"
 lsm_rush_bagot.1.d:0 "Eine Vertragspartei hat sich auf die Austrittsklausel des Rush–Bagot-Abkommens berufen. Die sechsmonatige Frist hat begonnen. Bis zu ihrem Ablauf bleiben die Seerüstungsbeschränkungen bindend."
 lsm_rush_bagot.1.f:0 "Die Depesche reist schneller, als ein Schiff ausgerüstet werden kann. An beiden Ufern zählen die Minister die Monate."
 lsm_rush_bagot.1.a:0 "Das Abkommen bindet uns noch – vorerst."
 lsm_rush_bagot.2.t:0 "Die Frist läuft ab"
 lsm_rush_bagot.2.d:0 "Die Austrittsfrist ist abgelaufen. Die Seerüstungsbeschränkungen des Rush–Bagot-Abkommens sind aufgehoben, und die Vertragsparteien können in den Bundesstaaten an den Seen Marinestützpunkte errichten."
 lsm_rush_bagot.2.f:0 "Dieselben Werften, die dem Handel auf den Seen dienten, können nun einem anderen Zweck dienen."
 lsm_rush_bagot.2.a:0 "Ein neues Kapitel an den Seen."
 lsm_rush_bagot.3.t:0 "Die Seen im Krieg"
 lsm_rush_bagot.3.d:0 "Der Krieg hat die Parteien des Rush–Bagot-Abkommens auf gegnerische Seiten gestellt. Seine Seerüstungsbeschränkungen sind ausgesetzt, und jede ausstehende Austrittsmitteilung oder jedes Angebot zur Erneuerung wird aufgehoben."
 lsm_rush_bagot.3.f:0 "Eine Grenze, die einst in Ladungen gemessen wurde, wird nun wieder in Kanonen gemessen."
 lsm_rush_bagot.3.a:0 "Auf den Krieg vorbereiten."
 lsm_rush_bagot.4.t:0 "Frieden ohne Abrüstung"
 lsm_rush_bagot.4.d:0 "Der Krieg zwischen den Vertragsparteien ist beendet. Die Seerüstungsbeschränkungen bleiben aufgehoben. Um das Abkommen wiederherzustellen, müssen die Stützpunkte in den betroffenen Bundesstaaten an den Seen abgebaut und die erneute Zustimmung jeder souveränen Vertragspartei eingeholt werden."
 lsm_rush_bagot.4.f:0 "Ein Waffenstillstand kann die Kanonen zum Schweigen bringen. Es braucht ein weiteres Abkommen, um sie an Land zu bringen."
 lsm_rush_bagot.4.a:0 "Wir können an den Verhandlungstisch zurückkehren."
 lsm_rush_bagot.5.t:0 "Ein Angebot zur Erneuerung von Rush–Bagot"
 lsm_rush_bagot.5.d:0 "Eine Vertragspartei hat angeboten, das Abkommen zu erneuern. Wenn wir uns anschließen wollen, können wir unsere Zustimmung im Journaleintrag zum Rush–Bagot-Abkommen festhalten. Jede souveräne Vertragspartei muss zustimmen, und jedes Angebot läuft nach sechs Monaten ab."
 lsm_rush_bagot.5.f:0 "Die alte Korrespondenz wurde aus den Archiven geholt. Es ist Platz für neue Unterschriften."
 lsm_rush_bagot.5.a:0 "Den Vorschlag erwägen."
 lsm_rush_bagot.6.t:0 "Eine friedliche Regelung wiederhergestellt"
 lsm_rush_bagot.6.d:0 "Alle souveränen Vertragsparteien haben der Erneuerung der Rush–Bagot-Regelung zugestimmt. Die Beschränkungen für Marinestützpunkte in den betroffenen Bundesstaaten an den Seen treten wieder in Kraft. Der Handelsverkehr auf den Seen kann sich weiterhin frei entwickeln."
 lsm_rush_bagot.6.f:0 "Die Kapitäne auf den Seen achten auf Wetter, Untiefen und gewinnbringende Ladung. Vorerst genügt das."
 lsm_rush_bagot.6.a:0 "Mögen die Seen friedlich bleiben."
 lsm_rush_bagot.7.t:0 "Seerüstung auf den Seen"
 lsm_rush_bagot.7.d:0 "Wir unterhalten weiterhin Marinestützpunkte in Bundesstaaten, die den Rush–Bagot-Beschränkungen unterliegen. Diese Stützpunkte müssen abgebaut werden, um das Abkommen einzuhalten. Ein weiterer Ausbau ist beschränkt; Handelshäfen dürfen weiter betrieben werden."
 lsm_rush_bagot.7.f:0 "Die Depesche stellt eine einfache Frage: Warum werden an unserem Ufer noch immer Kriegsschiffe ausgerüstet?"
 lsm_rush_bagot.7.a:0 "Unsere Einrichtungen an den Seen überprüfen."
 lsm_rb_naval_construction_allowed_tt:0 "Das Rush–Bagot-Abkommen muss den Bau von Marineeinrichtungen in diesem Bundesstaat erlauben."
