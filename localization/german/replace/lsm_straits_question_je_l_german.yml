l_german:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Vertrag von Hünkâr İskelesi"
 hunkar_iskelesi:0 "Abkommen von Hünkâr İskelesi"
 hunkar_iskelesi_desc:0 "Das russisch-osmanische Abkommen rückt die Frage der Durchfahrt durch die Türkischen Meerengen ins Zentrum der europäischen Diplomatie."
 hunkar_iskelesi_article_short_desc:0 "Das bestehende russisch-osmanische Abkommen aufrechterhalten, bis die Meerengenkonferenz eröffnet wird."
 hunkar_iskelesi_effects_desc:0 "Das Abkommen verbessert die russisch-osmanischen Beziehungen und bleibt in Kraft, bis die Meerengenkonferenz eröffnet wird."
 lsm_hunkar_not_superseded_tt:0 "Die Meerengenkonferenz hat das Abkommen von Hünkâr İskelesi noch nicht abgelöst."
 je_straits_question:0 "Die Meerengenfrage"
 je_straits_question_reason:0 "Großbritannien, Frankreich, Österreich, Preußen und Russland haben sechs Monate Zeit, eine Regelung für die Türkischen Meerengen auszuwählen. Jede Delegation verfügt über eine Stimme. Nicht abgegebene Stimmen werden bei Abschluss der Abstimmung zugeteilt. Anschließend hat die Hohe Pforte sechs Monate Zeit, die siegreiche Konvention anzunehmen oder abzulehnen; Schweigen gilt als Zustimmung. Auch wenn jede Großmacht die Stabilität in Europa wahren möchte, könnten einige Ergebnisse unvorhergesehene Folgen haben ..."
 je_straits_question_status:0 "Eine Regelung für die Durchfahrt durch Bosporus und Dardanellen."
 lsm_straits_conference_open_tt:0 "Das Abkommen von Hünkâr İskelesi ist beendet und die Meerengenkonferenz wurde eröffnet."
 lsm_straits_ballot_complete_tt:0 "Die Delegierten haben einen siegreichen Vorschlag ausgewählt."
 lsm_straits_settlement_accepted_tt:0 "Die Hohe Pforte hat die Konvention angenommen oder die osmanische Souveränität hat sich durchgesetzt."
 lsm_straits_settlement_rejected_tt:0 "Die vorgeschlagene Regelung wurde abgelehnt oder kann nicht mehr abgeschlossen werden."
 lsm_straits_voting_open_tt:0 "Die sechsmonatige Abstimmungsperiode läuft noch."
 lsm_straits_not_voted_tt:0 "Unsere Delegation hat ihre Stimme noch nicht abgegeben."
 lsm_straits_russia_exists_tt:0 "Russland existiert und kann die vorgeschlagenen Durchfahrtsrechte erhalten."
 lsm_straits_ottoman_decision_pending_tt:0 "Die Hohe Pforte hat den siegreichen Vorschlag noch nicht angenommen oder abgelehnt."
 lsm_straits_human_withdrawal_tt:0 "KI-gesteuerte Vertragsparteien werden sich nicht freiwillig aus diesem Abkommen zurückziehen."
 straits_ancient_rule_button:0 "Die althergebrachte Regel bekräftigen"
 straits_ancient_rule_button_desc:0 "Unterstützt eine Konvention, die den Ausschluss ausländischer Kriegsschiffe aus den Türkischen Meerengen verlangt. Wird sie angenommen, schließt die Hohe Pforte Konventionen mit den teilnehmenden Mächten. Eine KI-gesteuerte Hohe Pforte priorisiert die militärische Sperrung, wobei die Durchfahrt auf die kontrollierende Macht beschränkt ist; eine spielergesteuerte Hohe Pforte muss die Bestimmungen manuell einhalten. Bestehende vertragliche Ausnahmen von den Durchfahrtsregeln gelten weiterhin."
 straits_open_passage_button:0 "Freie Durchfahrt für alle"
 straits_open_passage_button_desc:0 "Unterstützt bindende Konventionen, die verhindern, dass die Hohe Pforte ihre Meerengen für irgendein Land schließt. Die Durchfahrtsgarantie gilt auch für Länder außerhalb dieser Konferenz. Gebühren werden dadurch nicht abgeschafft."
 straits_russian_entente_button:0 "Russlands Position akzeptieren"
 straits_russian_entente_button_desc:0 "Unterstützt die russische Kriegsschiffdurchfahrt und den Ausschluss anderer ausländischer Kriegsschiffe. Russland erhält eine vertragliche Durchfahrtsausnahme. Eine KI-gesteuerte Hohe Pforte priorisiert die militärische Sperrung, wobei die Durchfahrt auf die kontrollierende Macht beschränkt ist, während Russland seine Ausnahme behält. Eine spielergesteuerte Hohe Pforte muss die Sperrung manuell durchsetzen; andere bestehende Durchfahrtsausnahmen gelten weiterhin."
 straits_ottoman_prerogative_button:0 "Souveränität der Hohen Pforte"
 straits_ottoman_prerogative_button_desc:0 "Überlasst die Durchfahrt durch die Türkischen Meerengen der osmanischen Regierung. Gewinnt dieser Vorschlag, endet die Konferenz, ohne einen neuen Vertrag zu schaffen oder Durchfahrtsrechte aufzuerlegen."
 lsm_straits_vote_ancient_rule_tt:0 "Gebt unsere Stimme für die althergebrachte Regel ab. Diese Stimme setzt vor Abschluss der Konferenz keine Konvention in Kraft."
 lsm_straits_vote_open_passage_tt:0 "Gebt unsere Stimme für eine allen Ländern garantierte Durchfahrt ab."
 lsm_straits_vote_russian_entente_tt:0 "Gebt unsere Stimme für russische Durchfahrtsprivilegien ab."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Gebt unsere Stimme für osmanische Souveränität und gegen einen neuen Vertrag ab."
 straits_conference_approve_button:0 "Die Konvention annehmen"
 straits_conference_approve_button_desc:0 "Nehmt den siegreichen Vorschlag an und schließt die entsprechenden Abkommen mit den verbliebenen Konferenzmächten. Die Abkommen haben eine Bindungsfrist von fünf Jahren."
 straits_conference_reject_button:0 "Die Konvention ablehnen"
 straits_conference_reject_button_desc:0 "Lehnt den siegreichen Vorschlag ab. Die Konferenz wird scheitern und es werden keine neuen Konventionsverträge geschaffen."
 lsm_straits_accept_settlement_tt:0 "Schließt die vom siegreichen Vorschlag verlangten Abkommen."
 lsm_straits_reject_settlement_tt:0 "Beendet die Konferenz, ohne eine neue Konvention zu schaffen."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Londoner Meerengenkonvention: Althergebrachte Regel"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Londoner Meerengenkonvention: Freie Durchfahrt"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Londoner Meerengenkonvention: Russische Privilegien"
 straits_question_events.1.t:0 "Die Meerengenfrage"
 straits_question_events.1.d:0 "Das Abkommen von Hünkâr İskelesi wird abgelöst, wodurch die Frage erneut aufkommt, wer Kriegsschiffe durch Bosporus und Dardanellen schicken darf. Großbritannien, Frankreich, Österreich, Preußen und Russland werden der osmanischen Regierung eine Regelung zur Prüfung vorlegen."
 straits_question_events.1.f:0 "Die Delegierten haben sechs Monate Zeit, sich auf einen Vorschlag zu einigen."
 straits_question_events.1.a:0 "Die Konferenz eröffnen."
 straits_question_events.4.t:0 "Die Londoner Konvention"
 straits_question_events.4.t_sovereignty:0 "Die Hohe Pforte behält die Kontrolle"
 straits_question_events.4.d1:0 "Die Hohe Pforte und die teilnehmenden Mächte haben eine Konvention geschlossen, welche die althergebrachte Regel bekräftigt. Ausländische Kriegsschiffe sollen von den Türkischen Meerengen ausgeschlossen werden, während Handelsschiffe weiterhin freie Durchfahrt haben. Die osmanische Regierung ist für die Aufrechterhaltung der militärischen Sperrung verantwortlich."
 straits_question_events.4.d2:0 "Die Konferenz hat russische Durchfahrtsprivilegien anerkannt. Russland erhält eine garantierte Kriegsschiffdurchfahrt durch osmanisch kontrollierte Meerengen, während die begleitenden Konventionen den Ausschluss anderer ausländischer Seestreitkräfte verlangen. Die osmanische Regierung ist für die Durchsetzung dieses Ausschlusses verantwortlich."
 straits_question_events.4.d3:0 "Die Hohe Pforte hat Konventionen angenommen, die allen Ländern die Durchfahrt durch ihre Meerengen garantieren. Die osmanische Regierung ist daran gebunden, die Meerengen nicht zu schließen, solange diese Abkommen in Kraft bleiben. Die Durchfahrt wird auch Ländern außerhalb der Konferenz garantiert."
 straits_question_events.4.d4:0 "Die Mächte haben die osmanische Kontrolle über die Durchfahrt durch die Türkischen Meerengen anerkannt. Es wurde kein neuer Konventionsvertrag geschaffen, und keine ausländische Regierung erhält aus dieser Regelung Durchfahrtsrechte. Der Sultan behält die Entscheidungsfreiheit über den Zugang."
 straits_question_events.4.f:0 "Die Delegierten haben ihre Beratungen abgeschlossen."
 straits_question_events.4.a:0 "Die Konferenz ist beendet."
 straits_question_events.5.t:0 "Die Meerengenkonferenz scheitert"
 straits_question_events.5.d:0 "Die vorgeschlagene Regelung hat keine Einigung erzielt. Es wurde keine neue Konvention geschlossen, und die Frage der Durchfahrt durch die Türkischen Meerengen bleibt ungelöst."
 straits_question_events.5.f:0 "Die Delegierten reisen ohne Einigung ab."
 straits_question_events.5.a:0 "Es gibt keine Einigung."
 lsm_straits_ancient_rule:0 "Die althergebrachte Regel"
 lsm_straits_ancient_rule_desc:0 "Die Hohe Pforte verpflichtet sich, die Türkischen Meerengen für ausländische Kriegsschiffe zu schließen."
 lsm_straits_ancient_rule_article_short_desc:0 "Die Hohe Pforte verpflichtet sich, die Türkischen Meerengen für ausländische Kriegsschiffe zu schließen."
 lsm_straits_ancient_rule_effects_desc:0 "Eine KI-gesteuerte Hohe Pforte priorisiert die militärische Sperrung, wobei die Durchfahrt auf die kontrollierende Macht beschränkt ist, solange ein Konventionsartikel in Kraft bleibt. Der Handel bleibt geöffnet und vertragliche Durchfahrtsausnahmen gelten weiterhin. Eine spielergesteuerte Hohe Pforte muss die militärische Sperrung manuell festlegen."
 lsm_straits_open_passage:0 "Freie Durchfahrt für alle"
 lsm_straits_open_passage_desc:0 "Die Hohe Pforte garantiert allen Ländern die Durchfahrt durch ihre Meerengen."
 lsm_straits_open_passage_article_short_desc:0 "Die Hohe Pforte garantiert allen Ländern die Durchfahrt durch ihre Meerengen."
 lsm_straits_open_passage_effects_desc:0 "Das Ursprungsland kann seine Meerengen nicht schließen, solange dieser Artikel in Kraft bleibt. Dies gilt für jedes Land, einschließlich der Länder außerhalb der Konferenz. Gebühren werden nicht erlassen."
 lsm_straits_russian_entente:0 "Anerkennung russischer Privilegien"
 lsm_straits_russian_entente_desc:0 "Die Mächte erkennen russische Durchfahrtsprivilegien an und fordern den Ausschluss anderer ausländischer Kriegsschiffe."
 lsm_straits_russian_entente_article_short_desc:0 "Die Mächte erkennen russische Durchfahrtsprivilegien an und fordern den Ausschluss anderer ausländischer Kriegsschiffe."
 lsm_straits_russian_entente_effects_desc:0 "Eine KI-gesteuerte Hohe Pforte priorisiert die militärische Sperrung, wobei die Durchfahrt auf die kontrollierende Macht beschränkt ist, solange ein Konventionsartikel in Kraft bleibt. Russland erhält seine Durchfahrtsausnahme durch den Artikel zur russischen Kriegsschiffdurchfahrt. Andere vertragliche Ausnahmen gelten weiterhin. Eine spielergesteuerte Hohe Pforte muss die militärische Sperrung manuell festlegen."
 lsm_straits_russian_access:0 "Russische Kriegsschiffdurchfahrt"
 lsm_straits_russian_access_desc:0 "Die Hohe Pforte gewährt Russland die Durchfahrt von Kriegsschiffen durch osmanisch kontrollierte Meerengen."
 lsm_straits_russian_access_article_short_desc:0 "Die Hohe Pforte gewährt Russland die Durchfahrt von Kriegsschiffen durch osmanisch kontrollierte Meerengen."
 lsm_straits_russian_access_effects_desc:0 "Das Ursprungsland gewährt dem Zielland militärische Durchfahrt durch seine Meerengen. Dies gewährt keinen militärischen Zugang zu Land und schließt die Durchfahrt für Drittländer nicht automatisch."
