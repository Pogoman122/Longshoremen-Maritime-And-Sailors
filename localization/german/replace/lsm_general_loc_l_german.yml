l_german:
 revolution_pulse1_events.8.t: "Matrosen bleiben an Land"
 revolution_pulse1_events.8.d: "[GetPopType('sailors').GetName] in [SCOPE.sState('coastal_navy_state').GetName] haben sich geweigert, zu irgendwelchen Fahrten aus dem Hafen auszulaufen. Das Ausmaß der Meuterei verlangt ein behutsames Vorgehen."
 revolution_pulse1_events.8.f: ""Ganz einfach. Wir haben Forderungen. Wir laufen nicht aus, bis diese Forderungen erfüllt sind.""
 revolution_pulse1_events.8.a: "Die Männer festsetzen und den Vorfall auf [SCOPE.sState('coastal_navy_state').GetName] begrenzen."
 revolution_pulse1_events.8.b: "Die Männer mit Gewalt auf ihre Schiffe bringen."
 revolution_pulse1_events.8.c: "Versuchen, mit den [GetPopType('sailors').GetName] zu reden."
 revolution_lsm_events.1.t: "Revolutionäre beginnen Meuterei"
 revolution_lsm_events.1.d: "Eine Gruppe von Revolutionären, der Verbindungen zur [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName] nachgesagt werden, hat Matrosen in [SCOPE.sState('lsm_ship_mutiny_state').GetName] überwältigt, zwei Dutzend von ihnen getötet und ist mit einem bewaffneten Schiff in See gestochen."
 revolution_lsm_events.1.f: "#bold Gesucht: Schiffsdiebe#! \n\nMehr als 30 Männer werden verdächtigt, am Diebstahl eines Schiffes in [SCOPE.sState('coastal_navy_state').GetName] beteiligt gewesen zu sein. £200 für jeden gefangen genommenen oder getöteten Mann; £50 für Hinweise, die zur Festnahme oder zum Tod der Täter führen.\n\nSie gelten als bewaffnet und gefährlich. Helfer werden als gleichermaßen schuldig betrachtet."
 revolution_lsm_events.1.a: "Die Häfen nach ihnen durchsuchen."
 revolution_lsm_events.1.b: "Stattdessen die Fischereien nach ihnen durchsuchen."
 lsm_events.1.t:0 "Verloren in der Dunkelheit"
 lsm_events.1.d:0 "Eine Fähre mit Hafenarbeitern ist in den unbeleuchteten Hafenzufahrten von [SCOPE.sState('lsm_lighthouse_accident_state').GetName] auf Felsen gelaufen. Rund 150 Hafenarbeiter sind ertrunken."
 lsm_events.1.f:0 "Angehörige warten am Kai, während die Retter die Toten an Land bringen. Überlebende berichten, die Besatzung habe in der Dunkelheit die Orientierung verloren. Ohne einen Leuchtturm, der die Zufahrt markierte, sahen sie die Felsen erst Augenblicke vor dem Aufprall."
 lsm_events.1.a:0 "Vielleicht sollte etwas unternommen werden."
 lsm_events.1.deaths_tt:0 "Ungefähr #N 150#! Hafenarbeiter in [SCOPE.sState('lsm_lighthouse_accident_state').GetName] sind ums Leben gekommen."
 modifier_scouring_ports: "Durchsuchung der Häfen"
 modifier_scouring_fisheries: "Durchsuchung der Fischereien"
 lsm_admirals.1.t:0 "Eine Beförderung steht an"
 lsm_admirals.1.d:0 "Die [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] fordert die Beförderung von [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName] und verweist auf [SCOPE.sCharacter('low_rank_admiral').GetHerHis] langjährige treue und erfolgreiche Dienste."
 lsm_admirals.1.f:1 "So viele Orden schmückten [SCOPE.sCharacter('low_rank_admiral').GetHerHis] Jacke, dass man den Stoff darunter kaum noch erkennen konnte, doch es war noch immer nicht genug. Mit stolz geschwellter Brust lächelte der Admiral, als [SCOPE.sCharacter('low_rank_admiral').GetSheHe] sich den Gesichtsausdruck von [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting] vorstellte, wenn [SCOPE.sCharacter('high_rank_admiral').GetRankName] von [SCOPE.sCharacter('low_rank_admiral').GetHerHis] bevorstehender Beförderung erfahren würde; ihre Rivalität war unter den Offizieren legendär.\n\nEndlich würde [SCOPE.sCharacter('low_rank_admiral').GetSheHe] [SCOPE.sCharacter('low_rank_admiral').GetHerHis] verdiente Anerkennung erhalten."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] hat es verdient."
 lsm_admirals.1.b:0 "Die [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] wird uns nicht die Hand zwingen."
 low_rank_admiral_ig_opinion_add:0 "Bedeutenden Admiral befördert"
 low_rank_admiral_ig_opinion_remove:0 "Beförderung des Admirals verweigert"
 high_rank_admiral_ig_opinion_add:0 "Beförderung des Rivalen verhindert"
 denied_promotion:0 "Beförderung verweigert"
 lsm_canal_events.1.t:0 "Fertigstellung des Wellandkanals"
 lsm_canal_events.1.d:0 "Nach Jahren der Ausgrabungsarbeiten, des Schleusenbaus und der Ingenieursarbeit wurde der Wellandkanal endlich für den Verkehr geöffnet. Schiffe können nun das große Hindernis der Niagarafälle umgehen und den Ontariosee mit den oberen Großen Seen verbinden."
 lsm_canal_events.1.f:0 "Die Eröffnung des Kanals hat die Großen Seen in eine durchgehende Handelswasserstraße verwandelt. Schiffe mit Holz, Getreide, Erz, Industriewaren und Passagieren können nun zwischen den Binnenseen und den Häfen des Ontariosees verkehren, ohne ihre Ladung an den Niagarafällen löschen zu müssen. Was einst eine Reihe getrennter Binnenmeere war, entwickelt sich zunehmend zu einem einzigen internationalen Schifffahrtsnetz, das die wachsenden Siedlungen und Industrien Britisch-Nordamerikas und der Vereinigten Staaten miteinander verbindet."
 lsm_canal_events.1.a:0 "Die Großen Seen sind für den Handel geöffnet."
