l_japanese:
 lsm_rb_journal_group:0 "海事協定"
 lsm_je_rush_bagot:0 "ラッシュ＝バゴット協定"
 lsm_je_rush_bagot_reason:0 "1817年の協定は、五大湖とシャンプレーン湖におけるイギリスとアメリカの海軍軍備を制限しました。その約束は、湖上に数隻の軽武装船だけを認める平和な国境でした。\n\n我々はオンタリオ、オハイオ、ミシガン、インディアナ、イリノイ、ウィスコンシン、ミネソタでの新たな海軍基地を制限することで、この取り決めを維持します。商港と民間船舶は引き続き利用できます。この協定はアメリカ合衆国と北岸のイギリスまたはカナダ当局を拘束します。\n\n関係が著しく悪化した場合、署名国は6か月前に脱退を通告できます。当事国間の戦争が起きれば制限は停止されます。その後の更新には、軍縮とすべての主権署名国の合意が必要です。"
 lsm_je_rush_bagot_status:0 "ラッシュ＝バゴット協定の条件を検討中です。"
 lsm_rb_naval_restrictions:0 "ラッシュ＝バゴット海軍制限"
 lsm_rb_naval_restrictions_desc:0 "ラッシュ＝バゴット協定はこの沿岸での海軍基地拡張を制限します。商港は引き続き利用できます。"
 lsm_rb_status_active:0 "#P 協定発効中#!\n対象となる湖岸州では新たな海軍基地が制限されます。商港は引き続き利用できます。"
 lsm_rb_status_notice:0 "#Y 脱退通告#!\n署名国が6か月前通告を行いました。当事国間で戦争が始まらない限り、通告期間が終わるまで制限は有効です。"
 lsm_rb_status_war:0 "#N 署名国間の戦争#!\n海軍制限は解除されました。平和になっただけでは協定は復活しません。"
 lsm_rb_status_lapsed:0 "#Y 協定失効中#!\n当事国は再軍備できます。更新には平和な関係、対象州の海軍基地撤去、すべての主権署名国の同意が必要です。"
 lsm_rb_status_no_counterpart:0 "協定に適格な相手国が存在しません。海軍制限は解除されます。適格な署名国が再び現れた場合、新たな協定を交渉する必要があります。"
 lsm_rb_status_breach:0 "#N 湖上に海軍基地が残存#!\n協定は引き続き有効ですが、対象州にある既存の海軍基地は撤去しなければなりません。さらなる拡張は制限されます。"
 lsm_rb_status_our_consent:0 "#Y 他の署名国を待機中#!\n我々は更新に同意しました。更新条件が満たされ続ける限り、我々の提案は6か月間有効です。"
 lsm_rb_status_offer:0 "#Y 更新が提案された#!\n少なくとも1つの署名国が協定更新を提案しました。すべての主権署名国がそれぞれ同意しなければなりません。"
 lsm_rb_notice_button_name:0 "脱退を通告"
 lsm_rb_notice_button_desc:0 "協定の6か月脱退条項を発動します。これにより関係が悪化し、通告期間の終了後に海軍再軍備への道が開かれます。"
 lsm_rb_notice_requirements_tt:0 "我々は主権署名国であり、協定が発効中で、対立する署名国との関係が−50以下でなければなりません。当事国同士が戦争中であってはなりません。"
 lsm_rb_notice_effect_tt:0 "6か月前に脱退を通告します。その期間中、海軍制限は継続します。対立する署名国との関係が10低下します。通告期間が終了すると、すべての当事国が協定から解放されます。"
 lsm_rb_renewal_button_name:0 "協定更新に同意"
 lsm_rb_renewal_button_desc:0 "平和的取り決めの復活を提案します。すべての主権署名国が同意した場合にのみ協定が発効します。"
 lsm_rb_renewal_requirements_tt:0 "我々は主権署名国で、協定は失効しており、署名国同士が平和でなければなりません。対立する署名国との関係は0以上でなければなりません。対象湖岸州に海軍基地を残している参加国があってはなりません。すでに保留中の提案があってはなりません。"
 lsm_rb_renewal_effect_tt:0 "6か月間の更新同意を表明します。すべての主権署名国が同意すると海軍基地制限が再開されます。戦争、関係悪化、湖上での再軍備が起きると保留中の同意は無効になります。"
 lsm_rush_bagot.1.t:0 "湖上の通告"
 lsm_rush_bagot.1.d:0 "署名国がラッシュ＝バゴット協定の脱退条項を発動しました。6か月の通告期間が始まりました。期限までは海軍制限が引き続き拘束力を持ちます。"
 lsm_rush_bagot.1.f:0 "急使は一隻の船を艤装するより速く進みます。両岸で大臣たちは月日を数えます。"
 lsm_rush_bagot.1.a:0 "協定はまだ我々を拘束している——今のところは。"
 lsm_rush_bagot.2.t:0 "通告期間終了"
 lsm_rush_bagot.2.d:0 "脱退通告の期間が終了しました。ラッシュ＝バゴット海軍制限は解除され、署名国は湖岸州に自由に海軍基地を設置できます。"
 lsm_rush_bagot.2.f:0 "湖の商業に使われてきた同じ造船所が、今や別の目的にも使えます。"
 lsm_rush_bagot.2.a:0 "湖に新たな時代が始まる。"
 lsm_rush_bagot.3.t:0 "戦時下の湖"
 lsm_rush_bagot.3.d:0 "戦争によりラッシュ＝バゴット協定の当事国は敵対する側に分かれました。海軍制限は停止され、保留中の脱退通告や更新提案はすべて取り消されます。"
 lsm_rush_bagot.3.f:0 "かつて貨物で測られた国境が、再び大砲で測られます。"
 lsm_rush_bagot.3.a:0 "戦争に備える。"
 lsm_rush_bagot.4.t:0 "軍縮なき平和"
 lsm_rush_bagot.4.d:0 "条約当事国間の戦争が終結しました。海軍制限は解除されたままです。協定を復活させるには、対象湖岸州の基地を撤去し、すべての主権署名国から新たな同意を得る必要があります。"
 lsm_rush_bagot.4.f:0 "休戦は砲声を止められます。しかし大砲を陸へ戻すには別の協定が必要です。"
 lsm_rush_bagot.4.a:0 "交渉の席に戻れる。"
 lsm_rush_bagot.5.t:0 "ラッシュ＝バゴット更新提案"
 lsm_rush_bagot.5.d:0 "署名国が協定の更新を提案しました。参加を望むなら、ラッシュ＝バゴットの日誌項目で同意を記録できます。すべての主権署名国が同意する必要があり、各提案は6か月後に失効します。"
 lsm_rush_bagot.5.f:0 "古い往復書簡が書庫から取り出されました。新しい署名を書き込む余地があります。"
 lsm_rush_bagot.5.a:0 "提案を検討する。"
 lsm_rush_bagot.6.t:0 "平和的取り決めの復活"
 lsm_rush_bagot.6.d:0 "すべての主権署名国がラッシュ＝バゴット体制の更新に同意しました。対象湖岸州で海軍基地制限が再開されます。湖の商業交通は引き続き自由に成長できます。"
 lsm_rush_bagot.6.f:0 "湖の船長たちは天候、浅瀬、利益の上がる積荷を見張っています。今はそれで十分です。"
 lsm_rush_bagot.6.a:0 "湖が平和であり続けますように。"
 lsm_rush_bagot.7.t:0 "湖上の海軍軍備"
 lsm_rush_bagot.7.d:0 "ラッシュ＝バゴット制限の対象州に海軍基地を維持しています。協定を守るにはこれらの基地を撤去しなければなりません。さらなる拡張は制限されますが、商港は引き続き運営できます。"
 lsm_rush_bagot.7.f:0 "急使の文書は単純な問いを投げかけます。なぜ我々の岸で今も軍艦が艤装されているのか？"
 lsm_rush_bagot.7.a:0 "湖岸施設を見直す。"
 lsm_rb_naval_construction_allowed_tt:0 "ラッシュ＝バゴット協定がこの州での海軍建設を許可している必要があります。"
