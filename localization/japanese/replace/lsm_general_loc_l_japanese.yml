l_japanese:
 revolution_pulse1_events.8.t: "水兵、上陸したまま動かず"
 revolution_pulse1_events.8.d: "[SCOPE.sState('coastal_navy_state').GetName]の[GetPopType('sailors').GetName]が、港外へのあらゆる航海への乗船を拒否しました。反乱の規模を考えれば、慎重な対応が必要です。"
 revolution_pulse1_events.8.f: ""話は簡単だ。要求がある。要求が通るまで出航しない。""
 revolution_pulse1_events.8.a: "男たちを拘束し、事件を[SCOPE.sState('coastal_navy_state').GetName]内に封じ込める。"
 revolution_pulse1_events.8.b: "男たちを強制的に船へ戻す。"
 revolution_pulse1_events.8.c: "[GetPopType('sailors').GetName]と話し合ってみる。"
 revolution_lsm_events.1.t: "革命派が反乱を起こす"
 revolution_lsm_events.1.d: "[SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName]と関係があると噂される革命派の一団が、[SCOPE.sState('lsm_ship_mutiny_state').GetName]の水兵を制圧し、二十数名を殺害したうえで武装船を奪い海へ逃れました。"
 revolution_lsm_events.1.f: "#bold 指名手配：船舶泥棒#! \n\n[SCOPE.sState('coastal_navy_state').GetName]での船舶窃盗に30人以上が関与したとみられる。捕縛または死亡した者1人につき£200、犯人の逮捕または死亡につながる情報には£50。\n\n武装しており危険とみられる。協力者も同罪とする。"
 revolution_lsm_events.1.a: "港を徹底的に捜索する。"
 revolution_lsm_events.1.b: "代わりに漁場を捜索する。"
 lsm_events.1.t:0 "闇の中で"
 lsm_events.1.d:0 "港湾労働者を乗せた渡し船が、[SCOPE.sState('lsm_lighthouse_accident_state').GetName]の灯りのない港口で岩礁に衝突しました。約150人の港湾労働者が溺死しました。"
 lsm_events.1.f:0 "救助隊が遺体を陸へ運ぶ間、家族たちは岸壁で待っています。生存者によれば、乗組員は暗闇の中で方角を見失ったとのことです。進入路を示す灯台がなかったため、衝突のほんの直前まで岩礁に気づけませんでした。"
 lsm_events.1.a:0 "何か手を打つべきかもしれない。"
 lsm_events.1.deaths_tt:0 "[SCOPE.sState('lsm_lighthouse_accident_state').GetName]で約#N 150#!人の港湾労働者が死亡しました。"
 modifier_scouring_ports: "港湾捜索"
 modifier_scouring_fisheries: "漁場捜索"
 lsm_admirals.1.t:0 "昇進の時"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]は、[SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName]の忠実かつ有能な勤務歴を挙げ、[SCOPE.sCharacter('low_rank_admiral').GetHerHis]昇進を要求しています。"
 lsm_admirals.1.f:1 "[SCOPE.sCharacter('low_rank_admiral').GetHerHis]上着には、下の布地がほとんど見えないほど多くの勲章が並んでいました。それでもまだ足りなかったのです。誇らしげに胸を張った[SCOPE.sCharacter('low_rank_admiral').GetSheHe]は、[SCOPE.sCharacter('high_rank_admiral').GetRankName] [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting]が[SCOPE.sCharacter('low_rank_admiral').GetHerHis]間近に迫った昇進を知ったときの顔を想像して笑みを浮かべました。二人の競争関係は士官たちの間で伝説となっていました。\n\nついに[SCOPE.sCharacter('low_rank_admiral').GetSheHe]は[SCOPE.sCharacter('low_rank_admiral').GetHerHis]受けるべきものを得るのです。"
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName]なら昇進に値する。"
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName]に決断を強制させるわけにはいかない。"
 low_rank_admiral_ig_opinion_add:0 "有力提督を昇進"
 low_rank_admiral_ig_opinion_remove:0 "提督の昇進を拒否"
 high_rank_admiral_ig_opinion_add:0 "ライバルの昇進を阻止"
 denied_promotion:0 "昇進を拒否"
 lsm_canal_events.1.t:0 "ウェランド運河完成"
 lsm_canal_events.1.d:0 "長年にわたる掘削、閘門建設、土木工事を経て、ウェランド運河がついに開通しました。船舶は今やナイアガラの滝という大障害を迂回し、オンタリオ湖と上流の五大湖を結ぶことができます。"
 lsm_canal_events.1.f:0 "運河の開通によって五大湖は一本の連続した商業水路へと変わりました。木材、穀物、鉱石、工業製品、旅客を運ぶ船舶は、ナイアガラ周辺で積荷を下ろすことなく、内陸湖とオンタリオ湖の港の間を航行できます。かつては互いに分断された内海の集まりだったこの地域は、英領北アメリカとアメリカ合衆国の成長する入植地と産業を結ぶ、一つの国際海運網へと変わりつつあります。"
 lsm_canal_events.1.a:0 "五大湖が商業に開かれた。"
 mobilization_option_rail_transport: "鉄道輸送"
 mobilization_option_rail_transport_desc: "国家負担で兵士を鉄道移動させます。"
