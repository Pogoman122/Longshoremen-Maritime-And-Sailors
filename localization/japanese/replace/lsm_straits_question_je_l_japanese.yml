l_japanese:
 TREATY_NAME_HUNKAR_ISKELESI:0 "ヒュンキャル・イスケレシ条約"
 hunkar_iskelesi:0 "ヒュンキャル・イスケレシ協定"
 hunkar_iskelesi_desc:0 "露土協定は、トルコ海峡の通航問題をヨーロッパ外交の中心へ押し上げます。"
 hunkar_iskelesi_article_short_desc:0 "海峡会議が開かれるまで既存の露土協定を維持します。"
 hunkar_iskelesi_effects_desc:0 "協定は露土関係を改善し、海峡会議が開かれるまで効力を維持します。"
 lsm_hunkar_not_superseded_tt:0 "海峡会議はまだヒュンキャル・イスケレシ協定に取って代わっていません。"
 je_straits_question:0 "海峡問題"
 je_straits_question_reason:0 "イギリス、フランス、オーストリア、プロイセン、ロシアには、トルコ海峡の取り決めを選ぶための6か月があります。各代表団は1票を投じます。未投票分は投票終了時に割り当てられます。その後オスマン政府には、勝利した協約を受諾または拒否する6か月が与えられ、沈黙は受諾とみなされます。各列強がヨーロッパの安定維持を望んでいても、結果によっては予想外の影響が生じるかもしれません..."
 je_straits_question_status:0 "ボスポラス海峡とダーダネルス海峡の通航に関する取り決め。"
 lsm_straits_conference_open_tt:0 "ヒュンキャル・イスケレシ協定が終了し、海峡会議が開かれました。"
 lsm_straits_ballot_complete_tt:0 "代表団が勝利案を選択しました。"
 lsm_straits_settlement_accepted_tt:0 "オスマン政府が協約を受諾したか、オスマンの主権が維持されました。"
 lsm_straits_settlement_rejected_tt:0 "提案された取り決めは拒否されたか、もはや成立させることができません。"
 lsm_straits_voting_open_tt:0 "6か月の投票期間はまだ続いています。"
 lsm_straits_not_voted_tt:0 "我々の代表団はまだ投票していません。"
 lsm_straits_russia_exists_tt:0 "ロシアが存在し、提案された通航権を受け取ることができます。"
 lsm_straits_ottoman_decision_pending_tt:0 "オスマン政府はまだ勝利案を受諾も拒否もしていません。"
 lsm_straits_human_withdrawal_tt:0 "AI操作の署名国は、この協定から自発的に脱退しません。"
 straits_ancient_rule_button:0 "古来の原則を確認"
 straits_ancient_rule_button_desc:0 "外国軍艦をトルコ海峡から排除することを求める協約を支持します。受諾された場合、オスマン政府は参加列強と協約を結びます。AI操作のオスマン政府は通航を管理国に限定する軍事封鎖を優先し、プレイヤー操作のオスマン政府は手動で条件を守る必要があります。既存条約の通航例外は引き続き適用されます。"
 straits_open_passage_button:0 "全国家に自由通航"
 straits_open_passage_button_desc:0 "オスマン政府がいかなる国に対しても海峡を閉鎖できないようにする拘束力ある協約を支持します。通航保証はこの会議に参加していない国にも及びます。通行料は廃止されません。"
 straits_russian_entente_button:0 "ロシアの立場を受け入れる"
 straits_russian_entente_button_desc:0 "ロシア海軍の通航と、その他の外国軍艦の排除を支持します。ロシアは条約上の通航例外を得ます。AI操作のオスマン政府は通航を管理国に限定する軍事封鎖を優先しますが、ロシアは例外を維持します。プレイヤー操作のオスマン政府は手動で封鎖を実施する必要があり、他の既存通航例外も引き続き適用されます。"
 straits_ottoman_prerogative_button:0 "オスマン政府の主権"
 straits_ottoman_prerogative_button_desc:0 "トルコ海峡の通航をオスマン政府に委ねます。この案が勝利した場合、会議は新たな条約を作ることも通航権を課すこともなく終了します。"
 lsm_straits_vote_ancient_rule_tt:0 "古来の原則に投票します。この投票は会議が終了する前に協約を発効させるものではありません。"
 lsm_straits_vote_open_passage_tt:0 "すべての国に保証された通航に投票します。"
 lsm_straits_vote_russian_entente_tt:0 "ロシアの通航特権に投票します。"
 lsm_straits_vote_ottoman_prerogative_tt:0 "オスマンの主権と新条約なしに投票します。"
 straits_conference_approve_button:0 "協約を受諾"
 straits_conference_approve_button_desc:0 "勝利案を受諾し、存続している会議参加列強と対応する協定を締結します。協定には5年間の拘束期間があります。"
 straits_conference_reject_button:0 "協約を拒否"
 straits_conference_reject_button_desc:0 "勝利案を拒否します。会議は決裂し、新たな協約条約は作られません。"
 lsm_straits_accept_settlement_tt:0 "勝利案が求める協定を締結します。"
 lsm_straits_reject_settlement_tt:0 "新たな協約を作らずに会議を終了します。"
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "ロンドン海峡協約：古来の原則"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "ロンドン海峡協約：自由通航"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "ロンドン海峡協約：ロシア特権"
 straits_question_events.1.t:0 "海峡問題"
 straits_question_events.1.d:0 "ヒュンキャル・イスケレシ協定が置き換えられようとしており、ボスポラス海峡とダーダネルス海峡を誰が軍艦で通航できるのかという問題が再び開かれます。イギリス、フランス、オーストリア、プロイセン、ロシアは、オスマン政府が検討する取り決めを提示します。"
 straits_question_events.1.f:0 "代表団には案をまとめるための6か月があります。"
 straits_question_events.1.a:0 "会議を開く。"
 straits_question_events.4.t:0 "ロンドン協約"
 straits_question_events.4.t_sovereignty:0 "オスマン政府が統制を維持"
 straits_question_events.4.d1:0 "オスマン政府と参加列強は、古来の原則を確認する協約を締結しました。外国軍艦はトルコ海峡から排除され、商船の通航は自由なままとなります。オスマン政府は軍事封鎖を維持する責任を負います。"
 straits_question_events.4.d2:0 "会議はロシアの通航特権を受け入れました。ロシアはオスマン支配下の海峡で海軍通航を保証される一方、付随する協約は他の外国海軍の排除を求めます。オスマン政府はその排除を実施する責任を負います。"
 straits_question_events.4.d3:0 "オスマン政府は、すべての国に自国海峡の通航を保証する協約を受諾しました。これらの協定が有効である限り、オスマン政府は海峡を閉鎖できません。会議の署名国以外にも通航が保証されます。"
 straits_question_events.4.d4:0 "列強はトルコ海峡通航に対するオスマンの統制を認めました。新たな協約条約は作られず、外国政府はいずれもこの取り決めによる通航権を得ません。通航許可の裁量はスルタンに残ります。"
 straits_question_events.4.f:0 "代表団は任務を終えました。"
 straits_question_events.4.a:0 "会議は終了しました。"
 straits_question_events.5.t:0 "海峡会議決裂"
 straits_question_events.5.d:0 "提案された取り決めは合意を得られませんでした。新たな協約は締結されず、トルコ海峡通航の問題は未解決のままです。"
 straits_question_events.5.f:0 "代表団は合意なしに去ります。"
 straits_question_events.5.a:0 "合意はない。"
 lsm_straits_ancient_rule:0 "古来の原則"
 lsm_straits_ancient_rule_desc:0 "オスマン政府はトルコ海峡を外国軍艦に閉鎖することを約束します。"
 lsm_straits_ancient_rule_article_short_desc:0 "オスマン政府はトルコ海峡を外国軍艦に閉鎖することを約束します。"
 lsm_straits_ancient_rule_effects_desc:0 "AI操作のオスマン政府は、協約条項が有効である間、通航を管理国に限定する軍事封鎖を優先します。貿易は開放されたままで、条約上の通航例外も引き続き適用されます。プレイヤー操作のオスマン政府は軍事封鎖を手動で設定する必要があります。"
 lsm_straits_open_passage:0 "全国家に自由通航"
 lsm_straits_open_passage_desc:0 "オスマン政府はすべての国に自国海峡の通航を保証します。"
 lsm_straits_open_passage_article_short_desc:0 "オスマン政府はすべての国に自国海峡の通航を保証します。"
 lsm_straits_open_passage_effects_desc:0 "この条項が有効な間、起点国は自国の海峡を閉鎖できません。会議外の国を含むすべての国に適用されます。通行料は免除されません。"
 lsm_straits_russian_entente:0 "ロシア特権の承認"
 lsm_straits_russian_entente_desc:0 "列強はロシアの通航特権を認め、他の外国軍艦の排除を求めます。"
 lsm_straits_russian_entente_article_short_desc:0 "列強はロシアの通航特権を認め、他の外国軍艦の排除を求めます。"
 lsm_straits_russian_entente_effects_desc:0 "AI操作のオスマン政府は、協約条項が有効な間、通航を管理国に限定する軍事封鎖を優先します。ロシアは「ロシア海軍通航」条項による通航例外を得ます。他の条約例外も引き続き適用されます。プレイヤー操作のオスマン政府は軍事封鎖を手動で設定する必要があります。"
 lsm_straits_russian_access:0 "ロシア海軍通航"
 lsm_straits_russian_access_desc:0 "オスマン政府はロシアに、オスマン支配下の海峡での海軍通航を許可します。"
 lsm_straits_russian_access_article_short_desc:0 "オスマン政府はロシアに、オスマン支配下の海峡での海軍通航を許可します。"
 lsm_straits_russian_access_effects_desc:0 "起点国は対象国に自国海峡を通る軍事通航権を与えます。これは陸上の軍事通行権を与えるものではなく、第三国の通航を自動的に閉鎖するものでもありません。"
