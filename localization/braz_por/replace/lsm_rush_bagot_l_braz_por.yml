l_braz_por:
 lsm_rb_journal_group:0 "Acordos marítimos"
 lsm_je_rush_bagot:0 "O Acordo Rush–Bagot"
 lsm_je_rush_bagot_reason:0 "O acordo de 1817 limitou os armamentos navais britânicos e americanos nos Grandes Lagos e no Lago Champlain. Sua promessa era uma fronteira pacífica, com apenas algumas embarcações levemente armadas permitidas nos lagos.\n\nMantemos esse acordo restringindo novas bases navais em Ontário, Ohio, Michigan, Indiana, Illinois, Wisconsin e Minnesota. Portos mercantes e a navegação civil permanecem abertos. O acordo vincula os Estados Unidos e as autoridades britânicas ou canadenses na margem norte.\n\nRelações gravemente deterioradas podem levar um signatário a dar aviso prévio de retirada com seis meses de antecedência. Uma guerra entre as partes suspende as restrições. Depois disso, a renovação exige desarmamento e o acordo de todos os signatários soberanos."
 lsm_je_rush_bagot_status:0 "Os termos do Acordo Rush–Bagot estão sob revisão."
 lsm_rb_naval_restrictions:0 "Restrições Navais de Rush–Bagot"
 lsm_rb_naval_restrictions_desc:0 "O Acordo Rush–Bagot restringe a expansão de bases navais nestas margens. Os portos comerciais permanecem abertos."
 lsm_rb_status_active:0 "#P Acordo em vigor#!\nNovas bases navais são restringidas nos estados lacustres abrangidos. Os portos comerciais permanecem abertos."
 lsm_rb_status_notice:0 "#Y Aviso de retirada#!\nUm signatário deu aviso prévio de seis meses. As restrições permanecem em vigor até o fim do período de aviso, a menos que uma guerra ecloda entre as partes."
 lsm_rb_status_war:0 "#N Guerra entre os signatários#!\nAs restrições navais foram suspensas. A paz por si só não restaurará o acordo."
 lsm_rb_status_lapsed:0 "#Y Acordo não está em vigor#!\nAs partes podem se rearmar. A renovação exige relações pacíficas, o desmantelamento de bases navais nos estados abrangidos e o consentimento de todos os signatários soberanos."
 lsm_rb_status_no_counterpart:0 "O acordo não possui uma contraparte elegível. As restrições navais foram suspensas. Se signatários elegíveis retornarem, um novo acordo deverá ser negociado."
 lsm_rb_status_breach:0 "#N Bases navais permanecem nos lagos#!\nO acordo continua em vigor, mas as bases navais existentes nos estados abrangidos devem ser desmanteladas. Expansões adicionais são restringidas."
 lsm_rb_status_our_consent:0 "#Y Aguardando os outros signatários#!\nConsentimos com a renovação. Nossa oferta permanece válida por seis meses enquanto as condições para a renovação continuarem sendo atendidas."
 lsm_rb_status_offer:0 "#Y Renovação proposta#!\nPelo menos um signatário ofereceu renovar o acordo. Cada signatário soberano deve dar seu próprio consentimento."
 lsm_rb_notice_button_name:0 "Dar aviso de retirada"
 lsm_rb_notice_button_desc:0 "Invocar a cláusula de retirada com seis meses de antecedência do acordo. Isso prejudica as relações e abre caminho para o rearmamento naval após o período de aviso."
 lsm_rb_notice_requirements_tt:0 "Devemos ser um signatário soberano, o acordo deve estar em vigor e as relações com um signatário adversário devem ser −50 ou piores. As partes não podem estar em guerra entre si."
 lsm_rb_notice_effect_tt:0 "Dar aviso de retirada com seis meses de antecedência. As restrições navais continuam durante esse período. As relações com o signatário ou signatários adversários caem em 10. Quando o aviso expira, todas as partes são liberadas do acordo."
 lsm_rb_renewal_button_name:0 "Consentir com a renovação do acordo"
 lsm_rb_renewal_button_desc:0 "Oferecer restaurar o acordo pacífico. O acordo entra em vigor somente quando todos os signatários soberanos consentirem."
 lsm_rb_renewal_requirements_tt:0 "Devemos ser um signatário soberano, o acordo deve ter expirado e os signatários devem estar em paz entre si. Nossas relações com os signatários adversários devem ser de pelo menos 0. Nenhum participante pode manter uma base naval nos estados lacustres abrangidos. Não podemos já ter uma oferta pendente."
 lsm_rb_renewal_effect_tt:0 "Dar nosso consentimento à renovação por seis meses. Assim que todos os signatários soberanos concordarem, as restrições às bases navais voltam a vigorar. Guerra, deterioração das relações ou novo armamento nos lagos invalida consentimentos pendentes."
 lsm_rush_bagot.1.t:0 "Aviso nos lagos"
 lsm_rush_bagot.1.d:0 "Um signatário invocou a cláusula de retirada do Acordo Rush–Bagot. O período de aviso prévio de seis meses começou. Até que expire, as restrições navais continuam vinculantes."
 lsm_rush_bagot.1.f:0 "O despacho viaja mais rápido do que um navio pode ser preparado. Em ambas as margens, os ministros contam os meses."
 lsm_rush_bagot.1.a:0 "O acordo ainda nos vincula — por enquanto."
 lsm_rush_bagot.2.t:0 "O aviso expira"
 lsm_rush_bagot.2.d:0 "O aviso de retirada cumpriu seu prazo. As restrições navais de Rush–Bagot foram suspensas, e os signatários estão livres para estabelecer bases navais nos estados lacustres."
 lsm_rush_bagot.2.f:0 "Os mesmos estaleiros que serviam ao comércio dos lagos agora podem servir a outro propósito."
 lsm_rush_bagot.2.a:0 "Um novo capítulo nos lagos."
 lsm_rush_bagot.3.t:0 "Os lagos em tempo de guerra"
 lsm_rush_bagot.3.d:0 "A guerra colocou as partes do Acordo Rush–Bagot em lados opostos. Suas restrições navais estão suspensas, e qualquer aviso de retirada ou oferta de renovação pendente é cancelado."
 lsm_rush_bagot.3.f:0 "Uma fronteira antes medida em cargas volta a ser medida em canhões."
 lsm_rush_bagot.3.a:0 "Preparar para a guerra."
 lsm_rush_bagot.4.t:0 "Paz sem desarmamento"
 lsm_rush_bagot.4.d:0 "A guerra entre as partes do tratado terminou. As restrições navais continuam suspensas. Restaurar o acordo exigirá desmantelar bases nos estados lacustres abrangidos e obter novo consentimento de todos os signatários soberanos."
 lsm_rush_bagot.4.f:0 "Um armistício pode silenciar os canhões. É preciso outro acordo para colocá-los em terra."
 lsm_rush_bagot.4.a:0 "Podemos voltar à mesa de negociações."
 lsm_rush_bagot.5.t:0 "Uma oferta para renovar Rush–Bagot"
 lsm_rush_bagot.5.d:0 "Um signatário ofereceu renovar o acordo. Se quisermos participar, podemos registrar nosso consentimento na entrada de diário de Rush–Bagot. Todos os signatários soberanos devem concordar, e cada oferta expira após seis meses."
 lsm_rush_bagot.5.f:0 "A antiga correspondência foi retirada dos arquivos. Há espaço para novas assinaturas."
 lsm_rush_bagot.5.a:0 "Considerar a proposta."
 lsm_rush_bagot.6.t:0 "Um acordo pacífico restaurado"
 lsm_rush_bagot.6.d:0 "Todos os signatários soberanos concordaram em renovar o acordo Rush–Bagot. As restrições às bases navais voltam a vigorar nos estados lacustres abrangidos. O tráfego mercante dos lagos permanece livre para crescer."
 lsm_rush_bagot.6.f:0 "Os capitães dos lagos observam o tempo, os bancos de areia e as cargas lucrativas. Por enquanto, isso basta."
 lsm_rush_bagot.6.a:0 "Que os lagos permaneçam em paz."
 lsm_rush_bagot.7.t:0 "Armamentos navais nos lagos"
 lsm_rush_bagot.7.d:0 "Mantemos bases navais em estados abrangidos pelas restrições de Rush–Bagot. Essas bases devem ser desmanteladas para honrar o acordo. Expansões adicionais são restringidas; portos mercantes podem continuar operando."
 lsm_rush_bagot.7.f:0 "O despacho faz uma pergunta simples: por que ainda há navios de guerra sendo preparados em nossa margem?"
 lsm_rush_bagot.7.a:0 "Revisar nossas instalações nos lagos."
 lsm_rb_naval_construction_allowed_tt:0 "O Acordo Rush–Bagot deve permitir construção naval neste estado."
