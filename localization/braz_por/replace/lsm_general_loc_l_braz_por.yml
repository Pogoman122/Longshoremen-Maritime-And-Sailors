l_braz_por:
 revolution_pulse1_events.8.t: "Marinheiros permanecem em terra"
 revolution_pulse1_events.8.d: "Os [GetPopType('sailors').GetName] em [SCOPE.sState('coastal_navy_state').GetName] se recusaram a embarcar em qualquer viagem para fora do porto. A dimensão do motim exige uma abordagem delicada da situação."
 revolution_pulse1_events.8.f: ""É muito simples. Temos exigências. Não zarpamos até que elas sejam atendidas.""
 revolution_pulse1_events.8.a: "Deter os homens e manter o incidente restrito a [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Forçar os homens a embarcar em seus navios."
 revolution_pulse1_events.8.c: "Tentar conversar com os [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Revolucionários promovem motim"
 revolution_lsm_events.1.d: "Um bando de revolucionários que supostamente tem vínculos com [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName] dominou marinheiros em [SCOPE.sState('lsm_ship_mutiny_state').GetName], deixando duas dúzias de mortos, e partiu para o mar com uma embarcação armada."
 revolution_lsm_events.1.f: "#bold Procurados: ladrões de navios#! \n\nAcredita-se que mais de 30 homens estejam envolvidos no roubo de uma embarcação em [SCOPE.sState('coastal_navy_state').GetName]. £200 por homem capturado ou morto; £50 por informações que levem à captura ou morte dos culpados.\n\nConsiderados armados e perigosos. Colaboradores serão considerados igualmente culpados."
 revolution_lsm_events.1.a: "Vasculhar os portos atrás deles."
 revolution_lsm_events.1.b: "Vasculhar as áreas de pesca em vez disso."
 lsm_events.1.t:0 "Perdidos no escuro"
 lsm_events.1.d:0 "Uma balsa transportando estivadores atingiu rochas nas aproximações sem iluminação de um porto em [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Cerca de 150 estivadores morreram afogados."
 lsm_events.1.f:0 "Parentes esperam no cais enquanto as equipes de resgate trazem os mortos para terra. Sobreviventes dizem que a tripulação perdeu a orientação na escuridão. Sem um farol para marcar a aproximação, viram as rochas apenas instantes antes do impacto."
 lsm_events.1.a:0 "Talvez algo deva ser feito."
 lsm_events.1.deaths_tt:0 "Aproximadamente #N 150#! estivadores em [SCOPE.sState('lsm_lighthouse_accident_state').GetName] morreram."
 modifier_scouring_ports: "Vasculhando os portos"
 modifier_scouring_fisheries: "Vasculhando as áreas de pesca"
 lsm_admirals.1.t:0 "Uma promoção merecida"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] exige a promoção de [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], destacando [SCOPE.sCharacter('low_rank_admiral').GetHerHis] histórico de serviço leal e eficaz."
 lsm_admirals.1.f:1 "Tantas medalhas adornavam o uniforme de [SCOPE.sCharacter('low_rank_admiral').GetHerHis] que mal se via o tecido por baixo, mas ainda não era o bastante. Com o peito estufado de orgulho, [SCOPE.sCharacter('low_rank_admiral').GetSheHe] sorriu ao imaginar a expressão de [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting] quando [SCOPE.sCharacter('high_rank_admiral').GetRankName] soubesse da iminente ascensão de [SCOPE.sCharacter('low_rank_admiral').GetHerHis]; a rivalidade entre eles era lendária entre os oficiais.\n\nEnfim [SCOPE.sCharacter('low_rank_admiral').GetSheHe] receberia [SCOPE.sCharacter('low_rank_admiral').GetHerHis] merecida recompensa."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] merece isso."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] não forçará nossa mão."
 low_rank_admiral_ig_opinion_add:0 "Almirante proeminente promovido"
 low_rank_admiral_ig_opinion_remove:0 "Promoção de almirante recusada"
 high_rank_admiral_ig_opinion_add:0 "Promoção do rival negada"
 denied_promotion:0 "Promoção negada"
 lsm_canal_events.1.t:0 "Conclusão do Canal Welland"
 lsm_canal_events.1.d:0 "Após anos de escavação, construção de eclusas e obras de engenharia, o Canal Welland finalmente foi aberto ao tráfego. Os navios agora podem contornar o grande obstáculo das Cataratas do Niágara, ligando o Lago Ontário aos Grandes Lagos superiores."
 lsm_canal_events.1.f:0 "A abertura do canal transformou os Grandes Lagos em uma hidrovia comercial contínua. Embarcações transportando madeira, grãos, minério, produtos manufaturados e passageiros agora podem navegar entre os lagos interiores e os portos do Lago Ontário sem descarregar suas cargas ao redor do Niágara. O que antes era uma série de mares interiores separados está se tornando cada vez mais uma única rede internacional de transporte marítimo, unindo os crescentes assentamentos e indústrias da América do Norte Britânica e dos Estados Unidos."
 lsm_canal_events.1.a:0 "Os Grandes Lagos estão abertos ao comércio."
 mobilization_option_rail_transport: "Transporte ferroviário"
 mobilization_option_rail_transport_desc: "Permita que seus soldados viajem de trem às custas do Estado."
