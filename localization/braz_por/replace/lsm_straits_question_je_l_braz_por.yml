l_braz_por:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Tratado de Hünkâr İskelesi"
 hunkar_iskelesi:0 "Acordo de Hünkâr İskelesi"
 hunkar_iskelesi_desc:0 "O acordo russo-otomano coloca a questão da passagem pelos Estreitos Turcos no centro da diplomacia europeia."
 hunkar_iskelesi_article_short_desc:0 "Manter o acordo russo-otomano existente até a abertura da conferência dos Estreitos."
 hunkar_iskelesi_effects_desc:0 "O acordo melhora as relações russo-otomanas e permanece em vigor até a abertura da conferência dos Estreitos."
 lsm_hunkar_not_superseded_tt:0 "A conferência dos Estreitos ainda não substituiu o acordo de Hünkâr İskelesi."
 je_straits_question:0 "A Questão dos Estreitos"
 je_straits_question_reason:0 "Grã-Bretanha, França, Áustria, Prússia e Rússia têm seis meses para escolher um acordo para os Estreitos Turcos. Cada delegação dá um voto. Votos não lançados são atribuídos quando a votação se encerra. A Porta então tem seis meses para aceitar ou rejeitar a convenção vencedora; o silêncio conta como aceitação. Embora cada grande potência possa desejar manter a estabilidade na Europa, alguns resultados podem ter consequências imprevistas..."
 je_straits_question_status:0 "Um acordo para a passagem pelo Bósforo e pelos Dardanelos."
 lsm_straits_conference_open_tt:0 "O acordo de Hünkâr İskelesi terminou e a conferência dos Estreitos foi aberta."
 lsm_straits_ballot_complete_tt:0 "Os delegados selecionaram uma proposta vencedora."
 lsm_straits_settlement_accepted_tt:0 "A Porta aceitou a convenção, ou a soberania otomana prevaleceu."
 lsm_straits_settlement_rejected_tt:0 "O acordo proposto foi rejeitado ou não pode mais ser concluído."
 lsm_straits_voting_open_tt:0 "O período de votação de seis meses ainda está aberto."
 lsm_straits_not_voted_tt:0 "Nossa delegação ainda não deu seu voto."
 lsm_straits_russia_exists_tt:0 "A Rússia existe e pode receber os direitos de passagem propostos."
 lsm_straits_ottoman_decision_pending_tt:0 "A Porta ainda não aceitou nem rejeitou a proposta vencedora."
 lsm_straits_human_withdrawal_tt:0 "Signatários controlados pela IA não se retirarão voluntariamente deste acordo."
 straits_ancient_rule_button:0 "Afirmar a Regra Antiga"
 straits_ancient_rule_button_desc:0 "Apoiar uma convenção que exija a exclusão de navios de guerra estrangeiros dos Estreitos Turcos. Se aceita, a Porta assina convenções com as potências participantes. Uma Porta controlada pela IA prioriza o fechamento militar com a passagem restrita ao controlador; uma Porta controlada por jogador deve cumprir os termos manualmente. As isenções de passagem de tratados existentes continuam válidas."
 straits_open_passage_button:0 "Passagem livre para todos"
 straits_open_passage_button_desc:0 "Apoiar convenções vinculantes que impeçam a Porta de fechar seus estreitos a qualquer país. A garantia de passagem se estende a países fora desta conferência. Ela não elimina pedágios."
 straits_russian_entente_button:0 "Aceitar a posição da Rússia"
 straits_russian_entente_button_desc:0 "Apoiar a passagem naval russa e a exclusão de outros navios de guerra estrangeiros. A Rússia recebe uma isenção de passagem por tratado. Uma Porta controlada pela IA prioriza o fechamento militar com a passagem restrita ao controlador, enquanto a Rússia mantém sua isenção. Uma Porta controlada por jogador deve impor o fechamento manualmente; outras isenções de passagem existentes continuam válidas."
 straits_ottoman_prerogative_button:0 "Soberania da Sublime Porta"
 straits_ottoman_prerogative_button_desc:0 "Deixar a passagem pelos Estreitos Turcos a cargo do governo otomano. Se esta proposta vencer, a conferência termina sem criar nenhum novo tratado nem impor direitos de passagem."
 lsm_straits_vote_ancient_rule_tt:0 "Dar nosso voto à Regra Antiga. Este voto não impõe uma convenção antes que a conferência seja concluída."
 lsm_straits_vote_open_passage_tt:0 "Dar nosso voto à passagem garantida a todos os países."
 lsm_straits_vote_russian_entente_tt:0 "Dar nosso voto aos privilégios de passagem russos."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Dar nosso voto à soberania otomana e a nenhum novo tratado."
 straits_conference_approve_button:0 "Aceitar a Convenção"
 straits_conference_approve_button_desc:0 "Aceitar a proposta vencedora e concluir os acordos correspondentes com as potências sobreviventes da conferência. Os acordos têm um período vinculante de cinco anos."
 straits_conference_reject_button:0 "Rejeitar a Convenção"
 straits_conference_reject_button_desc:0 "Recusar a proposta vencedora. A conferência entrará em colapso e nenhum novo tratado de convenção será criado."
 lsm_straits_accept_settlement_tt:0 "Concluir os acordos exigidos pela proposta vencedora."
 lsm_straits_reject_settlement_tt:0 "Encerrar a conferência sem criar uma nova convenção."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Convenção de Londres sobre os Estreitos: Regra Antiga"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Convenção de Londres sobre os Estreitos: Passagem Livre"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Convenção de Londres sobre os Estreitos: Privilégios Russos"
 straits_question_events.1.t:0 "A Questão dos Estreitos"
 straits_question_events.1.d:0 "O acordo de Hünkâr İskelesi está sendo substituído, reabrindo a questão de quem pode enviar navios de guerra pelo Bósforo e pelos Dardanelos. Grã-Bretanha, França, Áustria, Prússia e Rússia apresentarão um acordo para consideração do governo otomano."
 straits_question_events.1.f:0 "Os delegados têm seis meses para chegar a uma proposta."
 straits_question_events.1.a:0 "Abrir a conferência."
 straits_question_events.4.t:0 "A Convenção de Londres"
 straits_question_events.4.t_sovereignty:0 "A Porta mantém o controle"
 straits_question_events.4.d1:0 "A Porta e as potências participantes concluíram uma convenção que afirma a Regra Antiga. Navios de guerra estrangeiros devem ser excluídos dos Estreitos Turcos, enquanto a navegação mercante permanece livre. O governo otomano é encarregado de manter o fechamento militar."
 straits_question_events.4.d2:0 "A conferência aceitou os privilégios de passagem russos. A Rússia recebe passagem naval garantida por estreitos controlados pelos otomanos, enquanto as convenções associadas exigem a exclusão de outras marinhas estrangeiras. O governo otomano é responsável por fazer cumprir essa exclusão."
 straits_question_events.4.d3:0 "A Porta aceitou convenções que garantem passagem por seus estreitos a todos os países. O governo otomano fica impedido de fechar os estreitos enquanto esses acordos permanecerem em vigor. A passagem também é garantida a países além dos signatários da conferência."
 straits_question_events.4.d4:0 "As potências aceitaram o controle otomano sobre a passagem pelos Estreitos Turcos. Nenhum novo tratado de convenção foi criado, e nenhum governo estrangeiro recebe direitos de passagem por este acordo. O sultão mantém a discricionariedade sobre o acesso."
 straits_question_events.4.f:0 "Os delegados concluíram seus trabalhos."
 straits_question_events.4.a:0 "A conferência está concluída."
 straits_question_events.5.t:0 "A conferência dos Estreitos entra em colapso"
 straits_question_events.5.d:0 "O acordo proposto não conseguiu garantir um entendimento. Nenhuma nova convenção foi concluída, e a questão da passagem pelos Estreitos Turcos continua sem solução."
 straits_question_events.5.f:0 "Os delegados partem sem um acordo."
 straits_question_events.5.a:0 "Não há acordo."
 lsm_straits_ancient_rule:0 "A Regra Antiga"
 lsm_straits_ancient_rule_desc:0 "A Porta compromete-se a fechar os Estreitos Turcos a navios de guerra estrangeiros."
 lsm_straits_ancient_rule_article_short_desc:0 "A Porta compromete-se a fechar os Estreitos Turcos a navios de guerra estrangeiros."
 lsm_straits_ancient_rule_effects_desc:0 "Uma Porta controlada pela IA prioriza o fechamento militar com a passagem restrita ao controlador enquanto um artigo da convenção permanecer em vigor. O comércio permanece aberto e as isenções de passagem por tratado continuam válidas. Uma Porta controlada por jogador deve definir o fechamento militar manualmente."
 lsm_straits_open_passage:0 "Passagem livre para todos"
 lsm_straits_open_passage_desc:0 "A Porta garante passagem por seus estreitos a todos os países."
 lsm_straits_open_passage_article_short_desc:0 "A Porta garante passagem por seus estreitos a todos os países."
 lsm_straits_open_passage_effects_desc:0 "O país de origem não pode fechar seus estreitos enquanto este artigo permanecer em vigor. Isso se aplica a todos os países, inclusive países fora da conferência. Os pedágios não são dispensados."
 lsm_straits_russian_entente:0 "Reconhecimento dos Privilégios Russos"
 lsm_straits_russian_entente_desc:0 "As potências reconhecem os privilégios de passagem russos e exigem a exclusão de outros navios de guerra estrangeiros."
 lsm_straits_russian_entente_article_short_desc:0 "As potências reconhecem os privilégios de passagem russos e exigem a exclusão de outros navios de guerra estrangeiros."
 lsm_straits_russian_entente_effects_desc:0 "Uma Porta controlada pela IA prioriza o fechamento militar com a passagem restrita ao controlador enquanto um artigo da convenção permanecer em vigor. A Rússia recebe sua isenção de passagem do artigo Passagem Naval Russa. Outras isenções de tratados continuam válidas. Uma Porta controlada por jogador deve definir o fechamento militar manualmente."
 lsm_straits_russian_access:0 "Passagem Naval Russa"
 lsm_straits_russian_access_desc:0 "A Porta concede à Rússia passagem naval por estreitos controlados pelos otomanos."
 lsm_straits_russian_access_article_short_desc:0 "A Porta concede à Rússia passagem naval por estreitos controlados pelos otomanos."
 lsm_straits_russian_access_effects_desc:0 "O país de origem concede ao país-alvo passagem militar por seus estreitos. Isso não concede acesso militar terrestre nem fecha automaticamente a passagem a terceiros países."
