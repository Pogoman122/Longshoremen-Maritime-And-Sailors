l_english:
 lsm_rb_journal_group:0 "Maritime Agreements"
 lsm_je_rush_bagot:0 "The Rush–Bagot Agreement"
 lsm_je_rush_bagot_reason:0 "The agreement of 1817 limited British and American naval armaments on the Great Lakes and Lake Champlain. Its promise was a peaceful border, with only a few lightly armed vessels permitted on the lakes.\n\nWe uphold that settlement by restricting new naval bases in Ontario, Ohio, Michigan, Indiana, Illinois, Wisconsin, and Minnesota. Merchant ports and civilian shipping remain open. The agreement binds the United States and the British or Canadian authorities on the northern shore.\n\nSeverely damaged relations may lead a signatory to give six months’ notice of withdrawal. War between the parties suspends the restrictions. Afterward, renewal requires disarmament and the agreement of every sovereign signatory."
 lsm_je_rush_bagot_status:0 "The terms of the Rush–Bagot Agreement are under review."
 lsm_rb_naval_restrictions:0 "Rush–Bagot Naval Restrictions"
 lsm_rb_naval_restrictions_desc:0 "The Rush–Bagot Agreement restricts the expansion of naval bases on these shores. Commercial ports remain open."
 lsm_rb_status_active:0 "#P Agreement in force#!\nNew naval bases are restricted in the covered lake states. Commercial ports remain open."
 lsm_rb_status_notice:0 "#Y Notice of withdrawal#!\nA signatory has given six months’ notice. Restrictions remain in force until the notice period ends, unless war breaks out between the parties."
 lsm_rb_status_war:0 "#N War between the signatories#!\nThe naval restrictions are lifted. Peace alone will not restore the agreement."
 lsm_rb_status_lapsed:0 "#Y Agreement not in force#!\nThe parties may rearm. Renewal requires peaceful relations, dismantling naval bases in the covered states, and the consent of all sovereign signatories."
 lsm_rb_status_no_counterpart:0 "The agreement has no eligible counterpart. Naval restrictions are lifted. If eligible signatories return, a new agreement must be negotiated."
 lsm_rb_status_breach:0 "#N Naval bases remain on the lakes#!\nThe agreement remains in force, but existing naval bases in the covered states must be dismantled. Further expansion is restricted."
 lsm_rb_status_our_consent:0 "#Y Awaiting the other signatories#!\nWe have consented to renewal. Our offer remains open for six months while the conditions for renewal continue to hold."
 lsm_rb_status_offer:0 "#Y Renewal proposed#!\nAt least one signatory has offered to renew the agreement. Every sovereign signatory must give its own consent."
 lsm_rb_notice_button_name:0 "Give Notice of Withdrawal"
 lsm_rb_notice_button_desc:0 "Invoke the agreement’s six-month withdrawal clause. This damages relations and opens the way for naval rearmament after the notice period."
 lsm_rb_notice_requirements_tt:0 "We must be a sovereign signatory, the agreement must be in force, and relations with an opposing signatory must be −50 or worse. The parties must not be at war with one another."
 lsm_rb_notice_effect_tt:0 "Give six months’ notice of withdrawal. Naval restrictions continue during that period. Relations with the opposing signatory or signatories fall by 10. When the notice expires, all parties are released from the agreement."
 lsm_rb_renewal_button_name:0 "Consent to Renew the Agreement"
 lsm_rb_renewal_button_desc:0 "Offer to restore the peaceful settlement. The agreement takes effect only when every sovereign signatory consents."
 lsm_rb_renewal_requirements_tt:0 "We must be a sovereign signatory, the agreement must have lapsed, and the signatories must be at peace with one another. Our relations with the opposing signatories must be at least 0. No participant may retain a naval base in the covered lake states. We must not already have a pending offer."
 lsm_rb_renewal_effect_tt:0 "Give our consent to renewal for six months. Once all sovereign signatories agree, naval-base restrictions resume. War, deteriorating relations, or renewed lake armament invalidates pending consent."
 lsm_rush_bagot.1.t:0 "Notice on the Lakes"
 lsm_rush_bagot.1.d:0 "A signatory has invoked the withdrawal clause of the Rush–Bagot Agreement. The six-month notice period has begun. Until it expires, the naval restrictions remain binding."
 lsm_rush_bagot.1.f:0 "The dispatch travels faster than a ship can be fitted out. On both shores, ministers count the months."
 lsm_rush_bagot.1.a:0 "The agreement still binds us—for now."
 lsm_rush_bagot.2.t:0 "The Notice Expires"
 lsm_rush_bagot.2.d:0 "The withdrawal notice has run its course. The Rush–Bagot naval restrictions are lifted, and the signatories are free to establish naval bases in the lake states."
 lsm_rush_bagot.2.f:0 "The same yards that served the commerce of the lakes may now serve another purpose."
 lsm_rush_bagot.2.a:0 "A new chapter on the lakes."
 lsm_rush_bagot.3.t:0 "The Lakes in Wartime"
 lsm_rush_bagot.3.d:0 "War has placed the parties to the Rush–Bagot Agreement on opposing sides. Its naval restrictions are suspended, and any pending withdrawal notice or offer of renewal is cancelled."
 lsm_rush_bagot.3.f:0 "A border once measured in cargoes is measured again in guns."
 lsm_rush_bagot.3.a:0 "Prepare for war."
 lsm_rush_bagot.4.t:0 "Peace Without Disarmament"
 lsm_rush_bagot.4.d:0 "The war between the treaty parties has ended. The naval restrictions remain lifted. Restoring the agreement will require dismantling bases in the covered lake states and securing fresh consent from every sovereign signatory."
 lsm_rush_bagot.4.f:0 "An armistice can silence the guns. It takes another agreement to put them ashore."
 lsm_rush_bagot.4.a:0 "We can return to the negotiating table."
 lsm_rush_bagot.5.t:0 "An Offer to Renew Rush–Bagot"
 lsm_rush_bagot.5.d:0 "A signatory has offered to renew the agreement. If we wish to join, we may record our consent in the Rush–Bagot journal entry. Every sovereign signatory must agree, and each offer expires after six months."
 lsm_rush_bagot.5.f:0 "The old correspondence has been taken from the archives. There is room for new signatures."
 lsm_rush_bagot.5.a:0 "Consider the proposal."
 lsm_rush_bagot.6.t:0 "A Peaceful Settlement Restored"
 lsm_rush_bagot.6.d:0 "All sovereign signatories have agreed to renew the Rush–Bagot settlement. Naval-base restrictions resume in the covered lake states. The merchant traffic of the lakes remains free to grow."
 lsm_rush_bagot.6.f:0 "The lake captains watch for weather, shoals, and profitable cargoes. For now, that is enough."
 lsm_rush_bagot.6.a:0 "May the lakes remain peaceful."
 lsm_rush_bagot.7.t:0 "Naval Armaments on the Lakes"
 lsm_rush_bagot.7.d:0 "We retain naval bases in states covered by the Rush–Bagot restrictions. These bases must be dismantled to honor the agreement. Further expansion is restricted; merchant ports may continue operating."
 lsm_rush_bagot.7.f:0 "The dispatch asks a simple question: why are there still warships fitting out on our shore?"
 lsm_rush_bagot.7.a:0 "Review our lake establishments."
 lsm_rb_naval_construction_allowed_tt:0 "The Rush–Bagot Agreement must permit naval construction in this state."
 lsm_rb_requirement_principal_tt:0 "We are a sovereign signatory to the agreement."
 lsm_rb_requirement_lapsed_tt:0 "The agreement has lapsed and can be renewed."
 lsm_rb_requirement_parties_tt:0 "The United States and at least one sovereign northern signatory exist."
 lsm_rb_requirement_peace_tt:0 "The treaty participants are at peace with one another."
 lsm_rb_requirement_relations_tt:0 "Our diplomatic relations with every opposing signatory are at least 0."
 lsm_rb_requirement_disarmed_tt:0 "No treaty participant has an existing naval base in a restricted lake state."
 lsm_rb_requirement_no_own_consent_tt:0 "We have not already given consent that is still pending."
 
 je_welland_canal:0 "Construction of the Welland Canal"
 je_welland_canal_reason:0 "A canal bypassing Niagara Falls would establish a navigable connection between Lake Ontario and Lake Erie. The undertaking will require considerable public expenditure and years of engineering work."
 lsm_begin_welland_canal_button:0 "Begin Construction"
 lsm_begin_welland_canal_button_des c:0 "Begin construction of the Welland Canal. The project will cost £5,000 each week for approximately eight years."
 je_welland_canal_construction:0 "Construction of the Welland Canal"
 je_welland_canal_construction_reason:0 "Work is underway on a canal linking Lake Ontario and Lake Erie while bypassing Niagara Falls."
 je_welland_canal_progress:0 "Planning and construction of the Welland Canal is estimated to take up to eight years to complete."
 
