l_english:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Treaty of Hünkâr İskelesi"
 hunkar_iskelesi:0 "Hünkâr İskelesi Agreement"
 hunkar_iskelesi_desc:0 "The Russo-Ottoman agreement places the question of passage through the Turkish Straits at the center of European diplomacy."
 hunkar_iskelesi_article_short_desc:0 "Maintain the existing Russo-Ottoman agreement until the Straits conference opens."
 hunkar_iskelesi_effects_desc:0 "The agreement improves Russo-Ottoman relations and remains in force until the Straits conference opens."
 lsm_hunkar_not_superseded_tt:0 "The Straits conference has not yet superseded the Hünkâr İskelesi agreement."
 je_straits_question:0 "The Straits Question"
 je_straits_question_reason:0 "Britain, France, Austria, Prussia and Russia have six months to select a settlement for the Turkish Straits. Each delegation casts one vote. Uncast ballots are assigned when voting closes. The Porte then has six months to accept or reject the winning convention; silence counts as acceptance. Though each great power might wish to maintain stability in Europe, some outcomes may have unforseen consequences..."
 je_straits_question_status:0 "A settlement for passage through the Bosporus and Dardanelles."
 lsm_straits_conference_open_tt:0 "The Hünkâr İskelesi agreement has ended and the Straits conference has opened."
 lsm_straits_ballot_complete_tt:0 "The delegates have selected a winning proposal."
 lsm_straits_settlement_accepted_tt:0 "The Porte has accepted the convention, or Ottoman sovereignty has prevailed."
 lsm_straits_settlement_rejected_tt:0 "The proposed settlement has been rejected or can no longer be concluded."
 lsm_straits_voting_open_tt:0 "The six-month voting period is still open."
 lsm_straits_not_voted_tt:0 "Our delegation has not yet cast its vote."
 lsm_straits_russia_exists_tt:0 "Russia exists and can receive the proposed passage rights."
 lsm_straits_ottoman_decision_pending_tt:0 "The Porte has not yet accepted or rejected the winning proposal."
 lsm_straits_human_withdrawal_tt:0 "AI-controlled signatories will not voluntarily withdraw from this agreement."
 straits_ancient_rule_button:0 "Affirm the Ancient Rule"
 straits_ancient_rule_button_desc:0 "Support a convention requiring the exclusion of foreign warships from the Turkish Straits. If accepted, the Porte signs conventions with the participating powers. An AI-controlled Porte prioritizes military closure with passage restricted to the controller; a player-controlled Porte must honor the terms manually. Existing treaty passage exemptions still apply."
 straits_open_passage_button:0 "Free Passage for All"
 straits_open_passage_button_desc:0 "Support binding conventions preventing the Porte from closing its straits to any country. The passage guarantee extends to countries outside this conference. It does not abolish tolls."
 straits_russian_entente_button:0 "Accept Russia's Position"
 straits_russian_entente_button_desc:0 "Support Russian naval passage and the exclusion of other foreign warships. Russia receives a treaty passage exemption. An AI-controlled Porte prioritizes military closure with passage restricted to the controller, while Russia retains its exemption. A player-controlled Porte must enforce closure manually; other existing passage exemptions still apply."
 straits_ottoman_prerogative_button:0 "Sublime Porte Sovereignty"
 straits_ottoman_prerogative_button_desc:0 "Leave passage through the Turkish Straits to the Ottoman government. If this proposal wins, the conference ends without creating any new treaty or imposing passage rights."
 lsm_straits_vote_ancient_rule_tt:0 "Cast our vote for the Ancient Rule. This vote does not impose a convention before the conference concludes."
 lsm_straits_vote_open_passage_tt:0 "Cast our vote for passage guaranteed to every country."
 lsm_straits_vote_russian_entente_tt:0 "Cast our vote for Russian passage privileges."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Cast our vote for Ottoman sovereignty and no new treaty."
 straits_conference_approve_button:0 "Accept the Convention"
 straits_conference_approve_button_desc:0 "Accept the winning proposal and conclude the corresponding agreements with the surviving conference powers. The agreements have a five-year binding period."
 straits_conference_reject_button:0 "Reject the Convention"
 straits_conference_reject_button_desc:0 "Refuse the winning proposal. The conference will collapse and no new convention treaties will be created."
 lsm_straits_accept_settlement_tt:0 "Conclude the agreements required by the winning proposal."
 lsm_straits_reject_settlement_tt:0 "End the conference without creating a new convention."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "London Straits Convention: Ancient Rule"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "London Straits Convention: Free Passage"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "London Straits Convention: Russian Privileges"
 straits_question_events.1.t:0 "The Straits Question"
 straits_question_events.1.d:0 "The Hünkâr İskelesi agreement is being superseded, reopening the question of who may send warships through the Bosporus and Dardanelles. Britain, France, Austria, Prussia and Russia will put forward a settlement for the Ottoman government to consider."
 straits_question_events.1.f:0 "The delegates have six months to settle on a proposal."
 straits_question_events.1.a:0 "Open the conference."
 straits_question_events.4.t:0 "The Convention of London"
 straits_question_events.4.t_sovereignty:0 "The Porte Retains Control"
 straits_question_events.4.d1:0 "The Porte and the participating powers have concluded a convention affirming the Ancient Rule. Foreign warships are to be excluded from the Turkish Straits, while merchant shipping remains free to pass. The Ottoman government is charged with maintaining military closure."
 straits_question_events.4.d2:0 "The conference has accepted Russian passage privileges. Russia receives guaranteed naval passage through Ottoman-controlled straits, while the accompanying conventions call for the exclusion of other foreign navies. The Ottoman government is responsible for enforcing that exclusion."
 straits_question_events.4.d3:0 "The Porte has accepted conventions guaranteeing passage through its straits to every country. The Ottoman government is bound against closing the straits while these agreements remain in force. Passage is guaranteed beyond the conference signatories as well."
 straits_question_events.4.d4:0 "The powers have accepted Ottoman control over passage through the Turkish Straits. No new convention treaty has been created, and no foreign government receives passage rights from this settlement. The Sultan retains discretion over access."
 straits_question_events.4.f:0 "The delegates have concluded their business."
 straits_question_events.4.a:0 "The conference is concluded."
 straits_question_events.5.t:0 "The Straits Conference Collapses"
 straits_question_events.5.d:0 "The proposed settlement has failed to secure an agreement. No new convention has been concluded, and the question of passage through the Turkish Straits remains unresolved."
 straits_question_events.5.f:0 "The delegates leave without a settlement."
 straits_question_events.5.a:0 "There is no agreement."
 lsm_straits_ancient_rule:0 "The Ancient Rule"
 lsm_straits_ancient_rule_desc:0 "The Porte undertakes to close the Turkish Straits to foreign warships."
 lsm_straits_ancient_rule_article_short_desc:0 "The Porte undertakes to close the Turkish Straits to foreign warships."
 lsm_straits_ancient_rule_effects_desc:0 "An AI-controlled Porte prioritizes military closure with passage restricted to the controller while a convention article remains in force. Trade remains open and treaty passage exemptions still apply. A player-controlled Porte must set military closure manually."
 lsm_straits_open_passage:0 "Free Passage for All"
 lsm_straits_open_passage_desc:0 "The Porte guarantees passage through its straits to all countries."
 lsm_straits_open_passage_article_short_desc:0 "The Porte guarantees passage through its straits to all countries."
 lsm_straits_open_passage_effects_desc:0 "The source country cannot close its straits while this article remains in force. This applies to every country, including countries outside the conference. Tolls are not waived."
 lsm_straits_russian_entente:0 "Recognition of Russian Privileges"
 lsm_straits_russian_entente_desc:0 "The powers recognize Russian passage privileges and call for the exclusion of other foreign warships."
 lsm_straits_russian_entente_article_short_desc:0 "The powers recognize Russian passage privileges and call for the exclusion of other foreign warships."
 lsm_straits_russian_entente_effects_desc:0 "An AI-controlled Porte prioritizes military closure with passage restricted to the controller while a convention article remains in force. Russia receives its passage exemption from the Russian Naval Passage article. Other treaty exemptions still apply. A player-controlled Porte must set military closure manually."
 lsm_straits_russian_access:0 "Russian Naval Passage"
 lsm_straits_russian_access_desc:0 "The Porte grants Russia naval passage through Ottoman-controlled straits."
 lsm_straits_russian_access_article_short_desc:0 "The Porte grants Russia naval passage through Ottoman-controlled straits."
 lsm_straits_russian_access_effects_desc:0 "The source country grants the target country military passage through its straits. This does not grant land military access or automatically close passage to third countries."
