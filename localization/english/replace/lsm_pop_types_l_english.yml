l_english:
 longshoremen:0 "@longshoremen! $longshoremen_no_icon$"
 longshoremen_only_icon:0 "@longshoremen!"
 longshoremen_no_icon:0 "Longshoremen"
 longshoremen_desc:0 "Dockworkers who are typically only employed in [GetBuildingType('building_port').GetName] [Concept('concept_building', '$concept_buildings$')] and [GetBuildingType('building_trade_center').GetName] [Concept('concept_building', '$concept_buildings$')]. They specialize in loading and unloading cargo, and are greatly important for the [concept_market] to function."
 sailors:1 "@sailors! $sailors_no_icon$"
 sailors_only_icon:1 "@sailors!"
 sailors_no_icon:1 "Sailors"
 sailors_desc:0 "From the seas to the shores, you'll always find a sailor doing their duties aboard whatever vessel the state commands them to. They commonly align politically with their role as part of the Armed Forces."
 soldiers:1 "@soldiers! $soldiers_no_icon$"
 soldiers_only_icon:1 "@soldiers!"
 soldiers_no_icon:1 "Soldiers"
 soldiers_desc:0 "Soldiers make up the bulk of the nation's ground forces. They commonly align politically with their role as part of the Armed Forces."