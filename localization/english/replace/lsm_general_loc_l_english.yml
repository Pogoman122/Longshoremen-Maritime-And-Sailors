l_english:
 revolution_pulse1_events.8.t: "Sailors Stay Ashore"
 revolution_pulse1_events.8.d: "[GetPopType('sailors').GetName] in [SCOPE.sState('coastal_navy_state').GetName] have refused to embark for any voyages out of port. The scope of the mutiny calls for a delicate approach to the situation."
 revolution_pulse1_events.8.f: ""It's very simple. We have demands. We don't sail until those demands are met.""
 revolution_pulse1_events.8.a: "Detain the men and keep the incident contained to [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Force the men onto their ships."
 revolution_pulse1_events.8.c: "Try to talk it out with the [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Revolutionaries Stage Mutiny"
 revolution_lsm_events.1.d: "A band of revolutionaries rumored to affiliate with the [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName], have overwhelmed sailors in [SCOPE.sState('lsm_ship_mutiny_state').GetName], leaving two dozen dead, and taking to the seas with an armed vessel."
 revolution_lsm_events.1.f: "#bold Wanted: Ship Thieves#! \n\nOver 30 men believed involved with theft of a vessel in [SCOPE.sState('coastal_navy_state').GetName]. £200 per man captured or killed; £50 for information leading to the capture or death of culprits.\n\nBelieved armed and dangerous. Collaborators will be considered equally guilty."
 revolution_lsm_events.1.a: "Scour the ports for them."
 revolution_lsm_events.1.b: "Scour the fisheries instead."
 lsm_events.1.t:0 "Lost in the Dark"
 lsm_events.1.d:0 "A ferry carrying dockworkers has struck rocks in the unlit approaches to a port in [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Around 150 Longshoremen have drowned."
 lsm_events.1.f:0 "Relatives wait along the quay as rescuers bring the dead ashore. Survivors say the crew lost their bearings in the darkness. With no lighthouse to mark the approach, they saw the rocks only moments before the impact."
 lsm_events.1.a:0 "Perhaps something should be done."
 lsm_events.1.deaths_tt:0 "Approximately #N 150#! Longshoremen in [SCOPE.sState('lsm_lighthouse_accident_state').GetName] have died."
 modifier_scouring_ports: "Scouring the Ports"
 modifier_scouring_fisheries: "Scouring the Fisheries"
 lsm_admirals.1.t:0 "Due a Promotion"
 lsm_admirals.1.d:0 "The [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] demand the promotion of [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], touting [SCOPE.sCharacter('low_rank_admiral').GetHerHis] history of loyal and effective service."
 lsm_admirals.1.f:1 "So many medals adorned [SCOPE.sCharacter('low_rank_admiral').GetHerHis] jacket that one could scarcely see the fabric beneath, but it was not yet enough. Chest puffed out with pride, the Admiral smiled as [SCOPE.sCharacter('low_rank_admiral').GetSheHe] imagined the look on [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting]'s face when the [SCOPE.sCharacter('high_rank_admiral').GetRankName] learned of [SCOPE.sCharacter('low_rank_admiral').GetHerHis] imminent ascension; their rivalry was legendary among the officers.\n\nAt last [SCOPE.sCharacter('low_rank_admiral').GetSheHe] would have [SCOPE.sCharacter('low_rank_admiral').GetHerHis] due."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] has earned it."
 lsm_admirals.1.b:0 "The [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] will not force our hand."
 low_rank_admiral_ig_opinion_add:0 "Promoted Prominent Admiral"
 low_rank_admiral_ig_opinion_remove:0 "Refused Admiral Promotion"
 high_rank_admiral_ig_opinion_add:0 "Denied Rival's Promotion"
 denied_promotion:0 "Denied Promotion"
 lsm_canal_events.1.t:0 "Completion of the Welland Canal"
 lsm_canal_events.1.d:0 "After years of excavation, lock construction, and engineering work, the Welland Canal has finally opened to traffic. Ships may now bypass the great obstacle of Niagara Falls, linking Lake Ontario with the upper Great Lakes."
 lsm_canal_events.1.f:0 "The opening of the canal has transformed the Great Lakes into a continuous commercial waterway. Vessels carrying timber, grain, ore, manufactured goods, and passengers may now sail between the interior lakes and the ports of Lake Ontario without unloading their cargoes around Niagara. What had once been a series of separate inland seas is increasingly becoming a single international shipping network, binding the growing settlements and industries of British North America and the United States together."
 lsm_canal_events.1.a:0 "The Great Lakes are open to commerce."
 mobilization_option_rail_transport: "Rail Transport"
 mobilization_option_rail_transport_desc: "Let your soldiers travel by train at the state's expense."