l_french:
 lsm_rb_journal_group:0 "Accords maritimes"
 lsm_je_rush_bagot:0 "L'accord Rush–Bagot"
 lsm_je_rush_bagot_reason:0 "L'accord de 1817 limitait les armements navals britanniques et américains sur les Grands Lacs et le lac Champlain. Il promettait une frontière pacifique, où seuls quelques bâtiments légèrement armés seraient autorisés sur les lacs.\n\nNous faisons respecter cet arrangement en limitant la construction de nouvelles bases navales en Ontario, dans l'Ohio, le Michigan, l'Indiana, l'Illinois, le Wisconsin et le Minnesota. Les ports marchands et la navigation civile restent ouverts. L'accord lie les États-Unis et les autorités britanniques ou canadiennes de la rive nord.\n\nUne grave détérioration des relations peut conduire un signataire à donner un préavis de retrait de six mois. Une guerre entre les parties suspend les restrictions. Par la suite, le renouvellement exige le désarmement et l'accord de tous les signataires souverains."
 lsm_je_rush_bagot_status:0 "Les termes de l'accord Rush–Bagot sont en cours d'examen."
 lsm_rb_naval_restrictions:0 "Restrictions navales de Rush–Bagot"
 lsm_rb_naval_restrictions_desc:0 "L'accord Rush–Bagot limite l'expansion des bases navales sur ces rives. Les ports commerciaux restent ouverts."
 lsm_rb_status_active:0 "#P Accord en vigueur#!\nLa construction de nouvelles bases navales est limitée dans les États lacustres concernés. Les ports commerciaux restent ouverts."
 lsm_rb_status_notice:0 "#Y Préavis de retrait#!\nUn signataire a donné un préavis de six mois. Les restrictions restent en vigueur jusqu'à l'expiration du délai, sauf si une guerre éclate entre les parties."
 lsm_rb_status_war:0 "#N Guerre entre les signataires#!\nLes restrictions navales sont levées. La paix à elle seule ne rétablira pas l'accord."
 lsm_rb_status_lapsed:0 "#Y Accord non en vigueur#!\nLes parties peuvent se réarmer. Le renouvellement exige des relations pacifiques, le démantèlement des bases navales dans les États concernés et le consentement de tous les signataires souverains."
 lsm_rb_status_no_counterpart:0 "L'accord ne compte aucune contrepartie admissible. Les restrictions navales sont levées. Si des signataires admissibles réapparaissent, un nouvel accord devra être négocié."
 lsm_rb_status_breach:0 "#N Des bases navales subsistent sur les lacs#!\nL'accord reste en vigueur, mais les bases navales existantes dans les États concernés doivent être démantelées. Toute nouvelle expansion est limitée."
 lsm_rb_status_our_consent:0 "#Y En attente des autres signataires#!\nNous avons consenti au renouvellement. Notre offre reste valable pendant six mois tant que les conditions de renouvellement demeurent remplies."
 lsm_rb_status_offer:0 "#Y Renouvellement proposé#!\nAu moins un signataire a proposé de renouveler l'accord. Chaque signataire souverain doit donner son propre consentement."
 lsm_rb_notice_button_name:0 "Donner un préavis de retrait"
 lsm_rb_notice_button_desc:0 "Invoquer la clause de retrait à six mois de l'accord. Cela détériore les relations et ouvre la voie au réarmement naval après l'expiration du préavis."
 lsm_rb_notice_requirements_tt:0 "Nous devons être un signataire souverain, l'accord doit être en vigueur et nos relations avec un signataire adverse doivent être de −50 ou moins. Les parties ne doivent pas être en guerre entre elles."
 lsm_rb_notice_effect_tt:0 "Donner un préavis de retrait de six mois. Les restrictions navales restent en vigueur pendant cette période. Les relations avec le ou les signataires adverses diminuent de 10. À l'expiration du préavis, toutes les parties sont libérées de l'accord."
 lsm_rb_renewal_button_name:0 "Consentir au renouvellement de l'accord"
 lsm_rb_renewal_button_desc:0 "Proposer de rétablir l'arrangement pacifique. L'accord n'entre en vigueur que lorsque tous les signataires souverains y consentent."
 lsm_rb_renewal_requirements_tt:0 "Nous devons être un signataire souverain, l'accord doit avoir cessé d'être en vigueur et les signataires doivent être en paix les uns avec les autres. Nos relations avec les signataires adverses doivent être d'au moins 0. Aucun participant ne peut conserver de base navale dans les États lacustres concernés. Nous ne devons pas déjà avoir une offre en attente."
 lsm_rb_renewal_effect_tt:0 "Donner notre consentement au renouvellement pour six mois. Dès que tous les signataires souverains donnent leur accord, les restrictions sur les bases navales reprennent. Une guerre, une détérioration des relations ou un nouveau réarmement sur les lacs invalide tout consentement en attente."
 lsm_rush_bagot.1.t:0 "Préavis sur les lacs"
 lsm_rush_bagot.1.d:0 "Un signataire a invoqué la clause de retrait de l'accord Rush–Bagot. Le délai de préavis de six mois a commencé. Jusqu'à son expiration, les restrictions navales restent contraignantes."
 lsm_rush_bagot.1.f:0 "La dépêche voyage plus vite qu'un navire ne peut être armé. Sur les deux rives, les ministres comptent les mois."
 lsm_rush_bagot.1.a:0 "L'accord nous lie encore — pour l'instant."
 lsm_rush_bagot.2.t:0 "Le préavis expire"
 lsm_rush_bagot.2.d:0 "Le délai de retrait est arrivé à son terme. Les restrictions navales de Rush–Bagot sont levées et les signataires sont libres d'établir des bases navales dans les États lacustres."
 lsm_rush_bagot.2.f:0 "Les mêmes chantiers qui servaient le commerce des lacs peuvent désormais servir un autre dessein."
 lsm_rush_bagot.2.a:0 "Un nouveau chapitre s'ouvre sur les lacs."
 lsm_rush_bagot.3.t:0 "Les lacs en temps de guerre"
 lsm_rush_bagot.3.d:0 "La guerre a placé les parties à l'accord Rush–Bagot dans des camps opposés. Ses restrictions navales sont suspendues et tout préavis de retrait ou toute offre de renouvellement en attente est annulé."
 lsm_rush_bagot.3.f:0 "Une frontière autrefois mesurée en cargaisons se mesure de nouveau en canons."
 lsm_rush_bagot.3.a:0 "Préparez-vous à la guerre."
 lsm_rush_bagot.4.t:0 "La paix sans désarmement"
 lsm_rush_bagot.4.d:0 "La guerre entre les parties au traité est terminée. Les restrictions navales restent levées. Le rétablissement de l'accord exigera le démantèlement des bases dans les États lacustres concernés et un nouveau consentement de chaque signataire souverain."
 lsm_rush_bagot.4.f:0 "Un armistice peut faire taire les canons. Il faut un autre accord pour les débarquer."
 lsm_rush_bagot.4.a:0 "Nous pouvons retourner à la table des négociations."
 lsm_rush_bagot.5.t:0 "Une offre de renouvellement de Rush–Bagot"
 lsm_rush_bagot.5.d:0 "Un signataire a proposé de renouveler l'accord. Si nous souhaitons y prendre part, nous pouvons consigner notre consentement dans l'entrée de journal Rush–Bagot. Tous les signataires souverains doivent donner leur accord et chaque offre expire après six mois."
 lsm_rush_bagot.5.f:0 "L'ancienne correspondance a été ressortie des archives. Il reste de la place pour de nouvelles signatures."
 lsm_rush_bagot.5.a:0 "Examiner la proposition."
 lsm_rush_bagot.6.t:0 "Un règlement pacifique rétabli"
 lsm_rush_bagot.6.d:0 "Tous les signataires souverains ont accepté de renouveler l'arrangement Rush–Bagot. Les restrictions sur les bases navales reprennent dans les États lacustres concernés. Le trafic marchand des lacs reste libre de se développer."
 lsm_rush_bagot.6.f:0 "Les capitaines des lacs surveillent la météo, les hauts-fonds et les cargaisons rentables. Pour l'instant, cela suffit."
 lsm_rush_bagot.6.a:0 "Puissent les lacs rester paisibles."
 lsm_rush_bagot.7.t:0 "Armements navals sur les lacs"
 lsm_rush_bagot.7.d:0 "Nous conservons des bases navales dans des États soumis aux restrictions de Rush–Bagot. Ces bases doivent être démantelées afin de respecter l'accord. Toute nouvelle expansion est limitée ; les ports marchands peuvent continuer à fonctionner."
 lsm_rush_bagot.7.f:0 "La dépêche pose une question simple : pourquoi des navires de guerre sont-ils encore en cours d'armement sur notre rive ?"
 lsm_rush_bagot.7.a:0 "Examiner nos installations lacustres."
 lsm_rb_naval_construction_allowed_tt:0 "L'accord Rush–Bagot doit autoriser la construction navale dans cet État."
