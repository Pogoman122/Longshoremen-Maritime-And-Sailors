l_french:
 revolution_pulse1_events.8.t: "Les marins restent à terre"
 revolution_pulse1_events.8.d: "Les [GetPopType('sailors').GetName] de [SCOPE.sState('coastal_navy_state').GetName] ont refusé d'embarquer pour tout voyage hors du port. L'ampleur de la mutinerie exige une approche délicate de la situation."
 revolution_pulse1_events.8.f: ""C'est très simple. Nous avons des revendications. Nous ne prendrons pas la mer tant qu'elles ne seront pas satisfaites.""
 revolution_pulse1_events.8.a: "Arrêtez les hommes et empêchez l'incident de s'étendre au-delà de [SCOPE.sState('coastal_navy_state').GetName]."
 revolution_pulse1_events.8.b: "Forcez les hommes à monter à bord de leurs navires."
 revolution_pulse1_events.8.c: "Essayez de trouver un compromis avec les [GetPopType('sailors').GetName]."
 revolution_lsm_events.1.t: "Les révolutionnaires déclenchent une mutinerie"
 revolution_lsm_events.1.d: "Un groupe de révolutionnaires que l'on dit affiliés aux [SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName] a maîtrisé des marins à [SCOPE.sState('lsm_ship_mutiny_state').GetName], faisant deux douzaines de morts, avant de prendre la mer à bord d'un bâtiment armé."
 revolution_lsm_events.1.f: "#bold Recherchés : voleurs de navire#! \n\nPlus de 30 hommes seraient impliqués dans le vol d'un bâtiment à [SCOPE.sState('coastal_navy_state').GetName]. 200 £ par homme capturé ou tué ; 50 £ pour toute information menant à la capture ou à la mort des coupables.\n\nIls sont considérés comme armés et dangereux. Les complices seront tenus pour tout aussi coupables."
 revolution_lsm_events.1.a: "Passez les ports au peigne fin."
 revolution_lsm_events.1.b: "Passez plutôt les pêcheries au peigne fin."
 lsm_events.1.t:0 "Perdus dans l'obscurité"
 lsm_events.1.d:0 "Un ferry transportant des dockers a heurté des rochers dans les approches non éclairées d'un port de [SCOPE.sState('lsm_lighthouse_accident_state').GetName]. Environ 150 dockers se sont noyés."
 lsm_events.1.f:0 "Des proches attendent le long du quai tandis que les sauveteurs ramènent les morts à terre. Les survivants affirment que l'équipage a perdu ses repères dans l'obscurité. Sans phare pour signaler l'approche, ils n'ont aperçu les rochers que quelques instants avant l'impact."
 lsm_events.1.a:0 "Il faudrait peut-être faire quelque chose."
 lsm_events.1.deaths_tt:0 "Environ #N 150#! dockers de [SCOPE.sState('lsm_lighthouse_accident_state').GetName] sont morts."
 modifier_scouring_ports: "Fouille des ports"
 modifier_scouring_fisheries: "Fouille des pêcheries"
 lsm_admirals.1.t:0 "Une promotion méritée"
 lsm_admirals.1.d:0 "Les [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] réclament la promotion de [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName], mettant en avant [SCOPE.sCharacter('low_rank_admiral').GetHerHis] parcours de service loyal et efficace."
 lsm_admirals.1.f:1 "Tant de médailles ornaient [SCOPE.sCharacter('low_rank_admiral').GetHerHis] veste que l'on distinguait à peine le tissu dessous, mais cela ne suffisait toujours pas. La poitrine bombée de fierté, l'amiral sourit tandis que [SCOPE.sCharacter('low_rank_admiral').GetSheHe] imaginait l'expression sur le visage de [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting] lorsque [SCOPE.sCharacter('high_rank_admiral').GetRankName] apprendrait l'imminente ascension de [SCOPE.sCharacter('low_rank_admiral').GetHerHis] rival ; leur rivalité était légendaire parmi les officiers.\n\nEnfin, [SCOPE.sCharacter('low_rank_admiral').GetSheHe] obtiendrait [SCOPE.sCharacter('low_rank_admiral').GetHerHis] récompense méritée."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] l'a mérité."
 lsm_admirals.1.b:0 "Les [SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] ne nous forceront pas la main."
 low_rank_admiral_ig_opinion_add:0 "Amiral éminent promu"
 low_rank_admiral_ig_opinion_remove:0 "Promotion de l'amiral refusée"
 high_rank_admiral_ig_opinion_add:0 "Promotion du rival refusée"
 denied_promotion:0 "Promotion refusée"
 lsm_canal_events.1.t:0 "Achèvement du canal Welland"
 lsm_canal_events.1.d:0 "Après des années d'excavation, de construction d'écluses et de travaux d'ingénierie, le canal Welland est enfin ouvert à la circulation. Les navires peuvent désormais contourner le grand obstacle des chutes du Niagara, reliant le lac Ontario aux Grands Lacs supérieurs."
 lsm_canal_events.1.f:0 "L'ouverture du canal a transformé les Grands Lacs en une voie commerciale continue. Les navires transportant du bois, des céréales, du minerai, des produits manufacturés et des passagers peuvent désormais naviguer entre les lacs intérieurs et les ports du lac Ontario sans décharger leurs cargaisons autour du Niagara. Ce qui n'était autrefois qu'une série de mers intérieures séparées devient de plus en plus un réseau international de navigation unique, reliant les colonies et les industries en pleine croissance de l'Amérique du Nord britannique et des États-Unis."
 lsm_canal_events.1.a:0 "Les Grands Lacs sont ouverts au commerce."
 mobilization_option_rail_transport: "Transport ferroviaire"
 mobilization_option_rail_transport_desc: "Permettre à vos soldats de voyager en train aux frais de l'État."