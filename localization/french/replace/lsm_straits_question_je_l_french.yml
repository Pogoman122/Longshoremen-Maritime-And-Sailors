l_french:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Traité de Hünkâr İskelesi"
 hunkar_iskelesi:0 "Accord de Hünkâr İskelesi"
 hunkar_iskelesi_desc:0 "L'accord russo-ottoman place la question du passage par les détroits turcs au cœur de la diplomatie européenne."
 hunkar_iskelesi_article_short_desc:0 "Maintenir l'accord russo-ottoman existant jusqu'à l'ouverture de la conférence sur les Détroits."
 hunkar_iskelesi_effects_desc:0 "L'accord améliore les relations russo-ottomanes et reste en vigueur jusqu'à l'ouverture de la conférence sur les Détroits."
 lsm_hunkar_not_superseded_tt:0 "La conférence sur les Détroits n'a pas encore remplacé l'accord de Hünkâr İskelesi."
 je_straits_question:0 "La question des Détroits"
 je_straits_question_reason:0 "La Grande-Bretagne, la France, l'Autriche, la Prusse et la Russie disposent de six mois pour choisir un règlement concernant les détroits turcs. Chaque délégation dispose d'une voix. Les votes non exprimés sont attribués à la clôture du scrutin. La Porte dispose ensuite de six mois pour accepter ou rejeter la convention victorieuse ; le silence vaut acceptation. Bien que chaque grande puissance puisse souhaiter préserver la stabilité en Europe, certains résultats pourraient avoir des conséquences imprévues..."
 je_straits_question_status:0 "Un règlement du passage par le Bosphore et les Dardanelles."
 lsm_straits_conference_open_tt:0 "L'accord de Hünkâr İskelesi a pris fin et la conférence sur les Détroits s'est ouverte."
 lsm_straits_ballot_complete_tt:0 "Les délégués ont choisi une proposition victorieuse."
 lsm_straits_settlement_accepted_tt:0 "La Porte a accepté la convention, ou la souveraineté ottomane a prévalu."
 lsm_straits_settlement_rejected_tt:0 "Le règlement proposé a été rejeté ou ne peut plus être conclu."
 lsm_straits_voting_open_tt:0 "La période de vote de six mois est toujours ouverte."
 lsm_straits_not_voted_tt:0 "Notre délégation n'a pas encore exprimé son vote."
 lsm_straits_russia_exists_tt:0 "La Russie existe et peut recevoir les droits de passage proposés."
 lsm_straits_ottoman_decision_pending_tt:0 "La Porte n'a pas encore accepté ni rejeté la proposition victorieuse."
 lsm_straits_human_withdrawal_tt:0 "Les signataires contrôlés par l'IA ne se retireront pas volontairement de cet accord."
 straits_ancient_rule_button:0 "Affirmer la règle ancienne"
 straits_ancient_rule_button_desc:0 "Soutenir une convention exigeant l'exclusion des navires de guerre étrangers des détroits turcs. Si elle est acceptée, la Porte signe des conventions avec les puissances participantes. Une Porte contrôlée par l'IA donne la priorité à la fermeture militaire, le passage étant réservé au pays qui contrôle les détroits ; une Porte contrôlée par un joueur doit appliquer manuellement les termes. Les exemptions de passage prévues par les traités existants continuent de s'appliquer."
 straits_open_passage_button:0 "Libre passage pour tous"
 straits_open_passage_button_desc:0 "Soutenir des conventions contraignantes empêchant la Porte de fermer ses détroits à quelque pays que ce soit. La garantie de passage s'étend aux pays extérieurs à cette conférence. Elle n'abolit pas les péages."
 straits_russian_entente_button:0 "Accepter la position de la Russie"
 straits_russian_entente_button_desc:0 "Soutenir le passage naval russe et l'exclusion des autres navires de guerre étrangers. La Russie reçoit une exemption de passage prévue par traité. Une Porte contrôlée par l'IA donne la priorité à la fermeture militaire, le passage étant réservé au pays qui contrôle les détroits, tandis que la Russie conserve son exemption. Une Porte contrôlée par un joueur doit faire respecter la fermeture manuellement ; les autres exemptions de passage existantes continuent de s'appliquer."
 straits_ottoman_prerogative_button:0 "Souveraineté de la Sublime Porte"
 straits_ottoman_prerogative_button_desc:0 "Laisser au gouvernement ottoman le contrôle du passage par les détroits turcs. Si cette proposition l'emporte, la conférence se termine sans créer de nouveau traité ni imposer de droits de passage."
 lsm_straits_vote_ancient_rule_tt:0 "Voter pour la règle ancienne. Ce vote n'impose aucune convention avant la conclusion de la conférence."
 lsm_straits_vote_open_passage_tt:0 "Voter pour un passage garanti à tous les pays."
 lsm_straits_vote_russian_entente_tt:0 "Voter en faveur des privilèges de passage russes."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Voter pour la souveraineté ottomane et l'absence de nouveau traité."
 straits_conference_approve_button:0 "Accepter la convention"
 straits_conference_approve_button_desc:0 "Accepter la proposition victorieuse et conclure les accords correspondants avec les puissances de la conférence encore présentes. Les accords ont une période contraignante de cinq ans."
 straits_conference_reject_button:0 "Rejeter la convention"
 straits_conference_reject_button_desc:0 "Refuser la proposition victorieuse. La conférence s'effondrera et aucun nouveau traité de convention ne sera créé."
 lsm_straits_accept_settlement_tt:0 "Conclure les accords requis par la proposition victorieuse."
 lsm_straits_reject_settlement_tt:0 "Mettre fin à la conférence sans créer de nouvelle convention."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Convention de Londres sur les Détroits : règle ancienne"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Convention de Londres sur les Détroits : libre passage"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Convention de Londres sur les Détroits : privilèges russes"
 straits_question_events.1.t:0 "La question des Détroits"
 straits_question_events.1.d:0 "L'accord de Hünkâr İskelesi est en passe d'être remplacé, rouvrant la question de savoir qui peut envoyer des navires de guerre par le Bosphore et les Dardanelles. La Grande-Bretagne, la France, l'Autriche, la Prusse et la Russie proposeront un règlement au gouvernement ottoman."
 straits_question_events.1.f:0 "Les délégués disposent de six mois pour s'accorder sur une proposition."
 straits_question_events.1.a:0 "Ouvrir la conférence."
 straits_question_events.4.t:0 "La Convention de Londres"
 straits_question_events.4.t_sovereignty:0 "La Porte conserve le contrôle"
 straits_question_events.4.d1:0 "La Porte et les puissances participantes ont conclu une convention affirmant la règle ancienne. Les navires de guerre étrangers doivent être exclus des détroits turcs, tandis que la navigation marchande reste libre. Le gouvernement ottoman est chargé de maintenir la fermeture militaire."
 straits_question_events.4.d2:0 "La conférence a accepté les privilèges de passage russes. La Russie bénéficie d'un passage naval garanti par les détroits sous contrôle ottoman, tandis que les conventions qui l'accompagnent appellent à l'exclusion des autres marines étrangères. Le gouvernement ottoman est chargé de faire respecter cette exclusion."
 straits_question_events.4.d3:0 "La Porte a accepté des conventions garantissant à tous les pays le passage par ses détroits. Le gouvernement ottoman s'engage à ne pas fermer les détroits tant que ces accords restent en vigueur. Le passage est également garanti aux pays non signataires de la conférence."
 straits_question_events.4.d4:0 "Les puissances ont accepté le contrôle ottoman du passage par les détroits turcs. Aucun nouveau traité de convention n'a été créé et aucun gouvernement étranger ne reçoit de droits de passage dans le cadre de ce règlement. Le sultan conserve toute latitude quant à l'accès."
 straits_question_events.4.f:0 "Les délégués ont achevé leurs travaux."
 straits_question_events.4.a:0 "La conférence est terminée."
 straits_question_events.5.t:0 "La conférence sur les Détroits s'effondre"
 straits_question_events.5.d:0 "Le règlement proposé n'a pas permis d'aboutir à un accord. Aucune nouvelle convention n'a été conclue et la question du passage par les détroits turcs reste sans solution."
 straits_question_events.5.f:0 "Les délégués repartent sans accord."
 straits_question_events.5.a:0 "Il n'y a pas d'accord."
 lsm_straits_ancient_rule:0 "La règle ancienne"
 lsm_straits_ancient_rule_desc:0 "La Porte s'engage à fermer les détroits turcs aux navires de guerre étrangers."
 lsm_straits_ancient_rule_article_short_desc:0 "La Porte s'engage à fermer les détroits turcs aux navires de guerre étrangers."
 lsm_straits_ancient_rule_effects_desc:0 "Une Porte contrôlée par l'IA donne la priorité à la fermeture militaire, le passage étant réservé au pays qui contrôle les détroits tant qu'un article de convention reste en vigueur. Le commerce reste ouvert et les exemptions de passage prévues par les traités continuent de s'appliquer. Une Porte contrôlée par un joueur doit régler manuellement la fermeture militaire."
 lsm_straits_open_passage:0 "Libre passage pour tous"
 lsm_straits_open_passage_desc:0 "La Porte garantit à tous les pays le passage par ses détroits."
 lsm_straits_open_passage_article_short_desc:0 "La Porte garantit à tous les pays le passage par ses détroits."
 lsm_straits_open_passage_effects_desc:0 "Le pays source ne peut pas fermer ses détroits tant que cet article reste en vigueur. Cela s'applique à tous les pays, y compris ceux qui ne participent pas à la conférence. Les péages ne sont pas supprimés."
 lsm_straits_russian_entente:0 "Reconnaissance des privilèges russes"
 lsm_straits_russian_entente_desc:0 "Les puissances reconnaissent les privilèges de passage russes et appellent à l'exclusion des autres navires de guerre étrangers."
 lsm_straits_russian_entente_article_short_desc:0 "Les puissances reconnaissent les privilèges de passage russes et appellent à l'exclusion des autres navires de guerre étrangers."
 lsm_straits_russian_entente_effects_desc:0 "Une Porte contrôlée par l'IA donne la priorité à la fermeture militaire, le passage étant réservé au pays qui contrôle les détroits tant qu'un article de convention reste en vigueur. La Russie reçoit son exemption de passage par l'article Passage naval russe. Les autres exemptions prévues par les traités continuent de s'appliquer. Une Porte contrôlée par un joueur doit régler manuellement la fermeture militaire."
 lsm_straits_russian_access:0 "Passage naval russe"
 lsm_straits_russian_access_desc:0 "La Porte accorde à la Russie le passage naval par les détroits sous contrôle ottoman."
 lsm_straits_russian_access_article_short_desc:0 "La Porte accorde à la Russie le passage naval par les détroits sous contrôle ottoman."
 lsm_straits_russian_access_effects_desc:0 "Le pays source accorde au pays cible un passage militaire par ses détroits. Cela n'accorde pas d'accès militaire terrestre et ne ferme pas automatiquement le passage aux pays tiers."
