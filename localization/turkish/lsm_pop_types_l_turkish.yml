l_turkish:
 longshoremen:0 "@longshoremen! $longshoremen_no_icon$"
 longshoremen_only_icon:0 "@longshoremen!"
 longshoremen_no_icon:0 "Liman İşçileri"
 longshoremen_desc:0 "Genellikle yalnızca [GetBuildingType('building_port').GetName] [Concept('concept_building', '$concept_buildings$')] ve [GetBuildingType('building_trade_center').GetName] [Concept('concept_building', '$concept_buildings$')] bünyesinde çalışan liman işçileridir. Yükleme ve boşaltma konusunda uzmanlaşırlar ve [concept_market] işleyişi için büyük önem taşırlar."
 sailors:1 "@sailors! $sailors_no_icon$"
 sailors_only_icon:1 "@sailors!"
 sailors_no_icon:1 "Denizciler"
 sailors_desc:0 "Denizden kıyıya, devletin görevlendirdiği her tür gemide görevini yerine getiren bir denizci mutlaka bulunur. Siyasi olarak genellikle Silahlı Kuvvetler içindeki rollerine uygun bir çizgiye yönelirler."
 soldiers:1 "@soldiers! $soldiers_no_icon$"
 soldiers_only_icon:1 "@soldiers!"
 soldiers_no_icon:1 "Askerler"
 soldiers_desc:0 "Askerler, ülkenin kara kuvvetlerinin büyük bölümünü oluşturur. Siyasi olarak genellikle Silahlı Kuvvetler içindeki rollerine uygun bir çizgiye yönelirler."
