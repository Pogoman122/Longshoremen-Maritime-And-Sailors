l_turkish:
 TREATY_NAME_HUNKAR_ISKELESI:0 "Hünkâr İskelesi Antlaşması"
 hunkar_iskelesi:0 "Hünkâr İskelesi Anlaşması"
 hunkar_iskelesi_desc:0 "Rus-Osmanlı anlaşması, Türk Boğazları'ndan geçiş meselesini Avrupa diplomasisinin merkezine yerleştiriyor."
 hunkar_iskelesi_article_short_desc:0 "Boğazlar konferansı açılana kadar mevcut Rus-Osmanlı anlaşmasını sürdür."
 hunkar_iskelesi_effects_desc:0 "Anlaşma Rus-Osmanlı ilişkilerini geliştirir ve Boğazlar konferansı açılana kadar yürürlükte kalır."
 lsm_hunkar_not_superseded_tt:0 "Boğazlar konferansı henüz Hünkâr İskelesi Anlaşması'nın yerini almadı."
 je_straits_question:0 "Boğazlar Meselesi"
 je_straits_question_reason:0 "Britanya, Fransa, Avusturya, Prusya ve Rusya'nın Türk Boğazları için bir düzenleme seçmek üzere altı ayı var. Her delegasyon bir oy kullanır. Kullanılmayan oylar oylama kapandığında dağıtılır. Ardından Babıâli'nin kazanan konvansiyonu kabul etmek veya reddetmek için altı ayı vardır; sessizlik kabul sayılır. Her büyük güç Avrupa'da istikrarı korumak isteyebilir, ancak bazı sonuçların öngörülemeyen sonuçları olabilir..."
 je_straits_question_status:0 "İstanbul ve Çanakkale Boğazları'ndan geçiş için bir düzenleme."
 lsm_straits_conference_open_tt:0 "Hünkâr İskelesi Anlaşması sona erdi ve Boğazlar konferansı açıldı."
 lsm_straits_ballot_complete_tt:0 "Delegeler kazanan bir teklif seçti."
 lsm_straits_settlement_accepted_tt:0 "Babıâli konvansiyonu kabul etti veya Osmanlı egemenliği üstün geldi."
 lsm_straits_settlement_rejected_tt:0 "Önerilen düzenleme reddedildi veya artık sonuçlandırılamaz."
 lsm_straits_voting_open_tt:0 "Altı aylık oylama süresi hâlâ açık."
 lsm_straits_not_voted_tt:0 "Delegasyonumuz henüz oyunu kullanmadı."
 lsm_straits_russia_exists_tt:0 "Rusya mevcut ve önerilen geçiş haklarını alabilir."
 lsm_straits_ottoman_decision_pending_tt:0 "Babıâli kazanan teklifi henüz kabul etmedi veya reddetmedi."
 lsm_straits_human_withdrawal_tt:0 "Yapay zekâ tarafından kontrol edilen imzacılar bu anlaşmadan gönüllü olarak çekilmeyecektir."
 straits_ancient_rule_button:0 "Kadim Kuralı Onayla"
 straits_ancient_rule_button_desc:0 "Yabancı savaş gemilerinin Türk Boğazları'ndan dışlanmasını gerektiren bir konvansiyonu destekle. Kabul edilirse Babıâli katılan güçlerle konvansiyonlar imzalar. Yapay zekâ kontrolündeki Babıâli, geçişi denetleyene kısıtlayan askerî kapatmayı önceliklendirir; oyuncu kontrolündeki Babıâli şartları elle uygulamalıdır. Mevcut antlaşma geçiş muafiyetleri geçerliliğini korur."
 straits_open_passage_button:0 "Herkese Serbest Geçiş"
 straits_open_passage_button_desc:0 "Babıâli'nin boğazlarını herhangi bir ülkeye kapatmasını engelleyen bağlayıcı konvansiyonları destekle. Geçiş garantisi bu konferansın dışındaki ülkeleri de kapsar. Geçiş ücretlerini kaldırmaz."
 straits_russian_entente_button:0 "Rusya'nın Tutumunu Kabul Et"
 straits_russian_entente_button_desc:0 "Rus deniz geçişini ve diğer yabancı savaş gemilerinin dışlanmasını destekle. Rusya bir antlaşma geçiş muafiyeti alır. Yapay zekâ kontrolündeki Babıâli geçişi denetleyene kısıtlayan askerî kapatmayı önceliklendirirken Rusya muafiyetini korur. Oyuncu kontrolündeki Babıâli kapatmayı elle uygulamalıdır; diğer mevcut geçiş muafiyetleri de geçerliliğini korur."
 straits_ottoman_prerogative_button:0 "Babıâli Egemenliği"
 straits_ottoman_prerogative_button_desc:0 "Türk Boğazları'ndan geçişi Osmanlı hükümetine bırak. Bu teklif kazanırsa konferans yeni bir antlaşma oluşturmadan veya geçiş hakları dayatmadan sona erer."
 lsm_straits_vote_ancient_rule_tt:0 "Oyumuza Kadim Kural lehine kullan. Bu oy konferans sona ermeden bir konvansiyon dayatmaz."
 lsm_straits_vote_open_passage_tt:0 "Oyumuza tüm ülkelere garantili geçiş lehine kullan."
 lsm_straits_vote_russian_entente_tt:0 "Oyumuza Rus geçiş ayrıcalıkları lehine kullan."
 lsm_straits_vote_ottoman_prerogative_tt:0 "Oyumuza Osmanlı egemenliği ve yeni antlaşma olmaması lehine kullan."
 straits_conference_approve_button:0 "Konvansiyonu Kabul Et"
 straits_conference_approve_button_desc:0 "Kazanan teklifi kabul et ve konferansta kalan güçlerle ilgili anlaşmaları sonuçlandır. Anlaşmaların beş yıllık bağlayıcılık süresi vardır."
 straits_conference_reject_button:0 "Konvansiyonu Reddet"
 straits_conference_reject_button_desc:0 "Kazanan teklifi reddet. Konferans çökecek ve yeni konvansiyon antlaşmaları oluşturulmayacak."
 lsm_straits_accept_settlement_tt:0 "Kazanan teklifin gerektirdiği anlaşmaları sonuçlandır."
 lsm_straits_reject_settlement_tt:0 "Yeni bir konvansiyon oluşturmadan konferansı sona erdir."
 TREATY_NAME_LSM_STRAITS_ANCIENT_RULE:0 "Londra Boğazlar Konvansiyonu: Kadim Kural"
 TREATY_NAME_LSM_STRAITS_OPEN_PASSAGE:0 "Londra Boğazlar Konvansiyonu: Serbest Geçiş"
 TREATY_NAME_LSM_STRAITS_RUSSIAN_ENTENTE:0 "Londra Boğazlar Konvansiyonu: Rus Ayrıcalıkları"
 straits_question_events.1.t:0 "Boğazlar Meselesi"
 straits_question_events.1.d:0 "Hünkâr İskelesi Anlaşması'nın yerini yeni bir düzen alırken, İstanbul ve Çanakkale Boğazları'ndan kimlerin savaş gemisi geçirebileceği sorusu yeniden açılıyor. Britanya, Fransa, Avusturya, Prusya ve Rusya, Osmanlı hükümetinin değerlendirmesi için bir düzenleme sunacak."
 straits_question_events.1.f:0 "Delegelerin bir teklif üzerinde anlaşmak için altı ayı var."
 straits_question_events.1.a:0 "Konferansı aç."
 straits_question_events.4.t:0 "Londra Konvansiyonu"
 straits_question_events.4.t_sovereignty:0 "Babıâli Kontrolü Elinde Tutuyor"
 straits_question_events.4.d1:0 "Babıâli ve katılımcı güçler Kadim Kuralı teyit eden bir konvansiyon imzaladı. Yabancı savaş gemileri Türk Boğazları'ndan dışlanacak, ticaret gemilerinin geçişi ise serbest kalacak. Osmanlı hükümeti askerî kapatmayı sürdürmekle görevlidir."
 straits_question_events.4.d2:0 "Konferans Rus geçiş ayrıcalıklarını kabul etti. Rusya, Osmanlı kontrolündeki boğazlardan garantili deniz geçişi elde ederken, beraberindeki konvansiyonlar diğer yabancı donanmaların dışlanmasını öngörüyor. Osmanlı hükümeti bu dışlamayı uygulamakla sorumludur."
 straits_question_events.4.d3:0 "Babıâli, boğazlarından tüm ülkelere geçiş garantisi veren konvansiyonları kabul etti. Osmanlı hükümeti bu anlaşmalar yürürlükte kaldığı sürece boğazları kapatamaz. Geçiş, konferans imzacısı olmayan ülkelere de garanti edilir."
 straits_question_events.4.d4:0 "Güçler, Türk Boğazları'ndan geçiş üzerindeki Osmanlı kontrolünü kabul etti. Yeni bir konvansiyon antlaşması oluşturulmadı ve hiçbir yabancı hükümet bu düzenlemeden geçiş hakkı elde etmedi. Erişim konusunda karar yetkisi Sultan'da kalır."
 straits_question_events.4.f:0 "Delegeler işlerini tamamladı."
 straits_question_events.4.a:0 "Konferans sona erdi."
 straits_question_events.5.t:0 "Boğazlar Konferansı Çöküyor"
 straits_question_events.5.d:0 "Önerilen düzenleme bir anlaşma sağlamayı başaramadı. Yeni bir konvansiyon imzalanmadı ve Türk Boğazları'ndan geçiş meselesi çözümsüz kaldı."
 straits_question_events.5.f:0 "Delegeler bir anlaşmaya varmadan ayrılıyor."
 straits_question_events.5.a:0 "Anlaşma yok."
 lsm_straits_ancient_rule:0 "Kadim Kural"
 lsm_straits_ancient_rule_desc:0 "Babıâli, Türk Boğazları'nı yabancı savaş gemilerine kapatmayı taahhüt eder."
 lsm_straits_ancient_rule_article_short_desc:0 "Babıâli, Türk Boğazları'nı yabancı savaş gemilerine kapatmayı taahhüt eder."
 lsm_straits_ancient_rule_effects_desc:0 "Yapay zekâ kontrolündeki Babıâli, bir konvansiyon maddesi yürürlükte kaldığı sürece geçişi denetleyene kısıtlayan askerî kapatmayı önceliklendirir. Ticaret açık kalır ve antlaşma geçiş muafiyetleri geçerliliğini korur. Oyuncu kontrolündeki Babıâli askerî kapatmayı elle ayarlamalıdır."
 lsm_straits_open_passage:0 "Herkese Serbest Geçiş"
 lsm_straits_open_passage_desc:0 "Babıâli boğazlarından tüm ülkelere geçiş garantisi verir."
 lsm_straits_open_passage_article_short_desc:0 "Babıâli boğazlarından tüm ülkelere geçiş garantisi verir."
 lsm_straits_open_passage_effects_desc:0 "Kaynak ülke bu madde yürürlükte kaldığı sürece boğazlarını kapatamaz. Bu, konferans dışındaki ülkeler dâhil tüm ülkeler için geçerlidir. Geçiş ücretleri kaldırılmaz."
 lsm_straits_russian_entente:0 "Rus Ayrıcalıklarının Tanınması"
 lsm_straits_russian_entente_desc:0 "Güçler Rus geçiş ayrıcalıklarını tanır ve diğer yabancı savaş gemilerinin dışlanmasını talep eder."
 lsm_straits_russian_entente_article_short_desc:0 "Güçler Rus geçiş ayrıcalıklarını tanır ve diğer yabancı savaş gemilerinin dışlanmasını talep eder."
 lsm_straits_russian_entente_effects_desc:0 "Yapay zekâ kontrolündeki Babıâli, bir konvansiyon maddesi yürürlükte kaldığı sürece geçişi denetleyene kısıtlayan askerî kapatmayı önceliklendirir. Rusya geçiş muafiyetini Rus Deniz Geçişi maddesinden alır. Diğer antlaşma muafiyetleri geçerliliğini korur. Oyuncu kontrolündeki Babıâli askerî kapatmayı elle ayarlamalıdır."
 lsm_straits_russian_access:0 "Rus Deniz Geçişi"
 lsm_straits_russian_access_desc:0 "Babıâli Rusya'ya Osmanlı kontrolündeki boğazlardan deniz geçişi tanır."
 lsm_straits_russian_access_article_short_desc:0 "Babıâli Rusya'ya Osmanlı kontrolündeki boğazlardan deniz geçişi tanır."
 lsm_straits_russian_access_effects_desc:0 "Kaynak ülke hedef ülkeye boğazlarından askerî geçiş hakkı verir. Bu, karadan askerî erişim sağlamaz ve üçüncü ülkelerin geçişini otomatik olarak kapatmaz."
