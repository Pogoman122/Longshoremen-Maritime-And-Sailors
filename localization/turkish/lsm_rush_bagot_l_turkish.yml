l_turkish:
 lsm_rb_journal_group:0 "Denizcilik Anlaşmaları"
 lsm_je_rush_bagot:0 "Rush–Bagot Anlaşması"
 lsm_je_rush_bagot_reason:0 "1817 anlaşması, Büyük Göller ve Champlain Gölü'ndeki Britanya ve Amerikan deniz silahlanmasını sınırladı. Amaç, göllerde yalnızca birkaç hafif silahlı gemiye izin verilen barışçıl bir sınır yaratmaktı.\n\nOntario, Ohio, Michigan, Indiana, Illinois, Wisconsin ve Minnesota'da yeni deniz üslerini kısıtlayarak bu düzenlemeyi sürdürüyoruz. Ticaret limanları ve sivil taşımacılık açık kalıyor. Anlaşma, Amerika Birleşik Devletleri ile kuzey kıyısındaki Britanya veya Kanada makamlarını bağlıyor.\n\nİlişkilerin ciddi biçimde bozulması, bir imzacının altı aylık çekilme bildirimi vermesine yol açabilir. Taraflar arasındaki savaş kısıtlamaları askıya alır. Sonrasında yenileme, silahsızlanmayı ve tüm egemen imzacıların onayını gerektirir."
 lsm_je_rush_bagot_status:0 "Rush–Bagot Anlaşması'nın şartları gözden geçiriliyor."
 lsm_rb_naval_restrictions:0 "Rush–Bagot Deniz Kısıtlamaları"
 lsm_rb_naval_restrictions_desc:0 "Rush–Bagot Anlaşması bu kıyılardaki deniz üslerinin genişletilmesini kısıtlar. Ticaret limanları açık kalır."
 lsm_rb_status_active:0 "#P Anlaşma yürürlükte#!\nKapsanan göl eyaletlerinde yeni deniz üsleri kısıtlanmıştır. Ticaret limanları açık kalır."
 lsm_rb_status_notice:0 "#Y Çekilme bildirimi#!\nBir imzacı altı aylık bildirimde bulundu. Taraflar arasında savaş çıkmadığı sürece, bildirim süresi sona erene kadar kısıtlamalar yürürlükte kalır."
 lsm_rb_status_war:0 "#N İmzacılar arasında savaş#!\nDeniz kısıtlamaları kaldırıldı. Yalnızca barış yapılması anlaşmayı yeniden yürürlüğe sokmaz."
 lsm_rb_status_lapsed:0 "#Y Anlaşma yürürlükte değil#!\nTaraflar yeniden silahlanabilir. Yenileme için barışçıl ilişkiler, kapsanan eyaletlerdeki deniz üslerinin sökülmesi ve tüm egemen imzacıların onayı gerekir."
 lsm_rb_status_no_counterpart:0 "Anlaşmanın uygun bir karşı tarafı yok. Deniz kısıtlamaları kaldırıldı. Uygun imzacılar geri dönerse yeni bir anlaşma müzakere edilmelidir."
 lsm_rb_status_breach:0 "#N Göllerde deniz üsleri kalmaya devam ediyor#!\nAnlaşma yürürlükte kalıyor, ancak kapsanan eyaletlerdeki mevcut deniz üsleri sökülmelidir. Daha fazla genişleme kısıtlanmıştır."
 lsm_rb_status_our_consent:0 "#Y Diğer imzacılar bekleniyor#!\nYenilemeye onay verdik. Yenileme koşulları sağlanmaya devam ettiği sürece teklifimiz altı ay boyunca geçerli kalır."
 lsm_rb_status_offer:0 "#Y Yenileme önerildi#!\nEn az bir imzacı anlaşmayı yenilemeyi teklif etti. Her egemen imzacı kendi onayını vermelidir."
 lsm_rb_notice_button_name:0 "Çekilme Bildirimi Ver"
 lsm_rb_notice_button_desc:0 "Anlaşmanın altı aylık çekilme maddesini işlet. Bu, ilişkileri zedeler ve bildirim süresi sonrasında denizde yeniden silahlanmanın önünü açar."
 lsm_rb_notice_requirements_tt:0 "Egemen bir imzacı olmalıyız, anlaşma yürürlükte olmalı ve karşıt bir imzacıyla ilişkilerimiz −50 veya daha kötü olmalıdır. Taraflar birbirleriyle savaş hâlinde olmamalıdır."
 lsm_rb_notice_effect_tt:0 "Altı aylık çekilme bildirimi ver. Deniz kısıtlamaları bu süre boyunca devam eder. Karşıt imzacı veya imzacılarla ilişkiler 10 azalır. Bildirim süresi dolduğunda tüm taraflar anlaşmadan serbest kalır."
 lsm_rb_renewal_button_name:0 "Anlaşmanın Yenilenmesini Onayla"
 lsm_rb_renewal_button_desc:0 "Barışçıl düzenlemeyi yeniden kurmayı teklif et. Anlaşma yalnızca tüm egemen imzacılar onay verdiğinde yürürlüğe girer."
 lsm_rb_renewal_requirements_tt:0 "Egemen bir imzacı olmalıyız, anlaşmanın yürürlüğü sona ermiş olmalı ve imzacılar birbirleriyle barış hâlinde olmalıdır. Karşıt imzacılarla ilişkilerimiz en az 0 olmalıdır. Hiçbir katılımcı kapsanan göl eyaletlerinde bir deniz üssü bulundurmamalıdır. Zaten bekleyen bir teklifimiz olmamalıdır."
 lsm_rb_renewal_effect_tt:0 "Yenilemeye altı aylık onayımızı ver. Tüm egemen imzacılar kabul ettiğinde deniz üssü kısıtlamaları yeniden başlar. Savaş, ilişkilerin bozulması veya göllerde yeniden silahlanma bekleyen onayı geçersiz kılar."
 lsm_rush_bagot.1.t:0 "Göllerde Bildirim"
 lsm_rush_bagot.1.d:0 "Bir imzacı Rush–Bagot Anlaşması'nın çekilme maddesini işletti. Altı aylık bildirim süresi başladı. Süre dolana kadar deniz kısıtlamaları bağlayıcı olmaya devam ediyor."
 lsm_rush_bagot.1.f:0 "Yazılı emir, bir geminin donatılmasından daha hızlı yol alıyor. Her iki kıyıda da bakanlar ayları sayıyor."
 lsm_rush_bagot.1.a:0 "Anlaşma bizi hâlâ bağlıyor — şimdilik."
 lsm_rush_bagot.2.t:0 "Bildirim Süresi Sona Eriyor"
 lsm_rush_bagot.2.d:0 "Çekilme bildirimi süresini doldurdu. Rush–Bagot deniz kısıtlamaları kaldırıldı ve imzacılar göl eyaletlerinde deniz üsleri kurmakta serbest kaldı."
 lsm_rush_bagot.2.f:0 "Göllerin ticaretine hizmet eden aynı tersaneler artık başka bir amaca hizmet edebilir."
 lsm_rush_bagot.2.a:0 "Göllerde yeni bir sayfa."
 lsm_rush_bagot.3.t:0 "Savaş Zamanında Göller"
 lsm_rush_bagot.3.d:0 "Savaş, Rush–Bagot Anlaşması'nın taraflarını karşı cephelere yerleştirdi. Deniz kısıtlamaları askıya alındı ve bekleyen tüm çekilme bildirimleri veya yenileme teklifleri iptal edildi."
 lsm_rush_bagot.3.f:0 "Bir zamanlar yüklerle ölçülen sınır artık yeniden toplarla ölçülüyor."
 lsm_rush_bagot.3.a:0 "Savaşa hazırlan."
 lsm_rush_bagot.4.t:0 "Silahsızlanmasız Barış"
 lsm_rush_bagot.4.d:0 "Antlaşmanın tarafları arasındaki savaş sona erdi. Deniz kısıtlamaları kaldırılmış durumda. Anlaşmayı yeniden kurmak için kapsanan göl eyaletlerindeki üslerin sökülmesi ve tüm egemen imzacılardan yeniden onay alınması gerekecek."
 lsm_rush_bagot.4.f:0 "Bir ateşkes topları susturabilir. Onları karaya çıkarmak için başka bir anlaşma gerekir."
 lsm_rush_bagot.4.a:0 "Müzakere masasına dönebiliriz."
 lsm_rush_bagot.5.t:0 "Rush–Bagot'u Yenileme Teklifi"
 lsm_rush_bagot.5.d:0 "Bir imzacı anlaşmayı yenilemeyi teklif etti. Katılmak istiyorsak onayımızı Rush–Bagot günlük kaydında belirtebiliriz. Tüm egemen imzacılar kabul etmeli ve her teklif altı ay sonra sona erer."
 lsm_rush_bagot.5.f:0 "Eski yazışmalar arşivden çıkarıldı. Yeni imzalar için yer var."
 lsm_rush_bagot.5.a:0 "Teklifi değerlendir."
 lsm_rush_bagot.6.t:0 "Barışçıl Düzen Yeniden Kuruldu"
 lsm_rush_bagot.6.d:0 "Tüm egemen imzacılar Rush–Bagot düzenlemesini yenilemeyi kabul etti. Kapsanan göl eyaletlerinde deniz üssü kısıtlamaları yeniden yürürlükte. Göllerdeki ticaret trafiği büyümekte serbest kalıyor."
 lsm_rush_bagot.6.f:0 "Göl kaptanları hava durumunu, sığlıkları ve kârlı yükleri gözlüyor. Şimdilik bu yeterli."
 lsm_rush_bagot.6.a:0 "Göller barış içinde kalsın."
 lsm_rush_bagot.7.t:0 "Göllerde Deniz Silahlanması"
 lsm_rush_bagot.7.d:0 "Rush–Bagot kısıtlamalarının kapsadığı eyaletlerde deniz üsleri bulunduruyoruz. Anlaşmaya uymak için bu üsler sökülmelidir. Daha fazla genişleme kısıtlanmıştır; ticaret limanları faaliyetlerine devam edebilir."
 lsm_rush_bagot.7.f:0 "Yazılı emir basit bir soru soruyor: kıyımızda neden hâlâ savaş gemileri donatılıyor?"
 lsm_rush_bagot.7.a:0 "Göllerdeki tesislerimizi gözden geçir."
 lsm_rb_naval_construction_allowed_tt:0 "Rush–Bagot Anlaşması bu eyalette deniz inşasına izin vermelidir."
