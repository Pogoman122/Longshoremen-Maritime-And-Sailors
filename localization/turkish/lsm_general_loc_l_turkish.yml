l_turkish:
 revolution_pulse1_events.8.t: "Denizciler Karada Kalıyor"
 revolution_pulse1_events.8.d: "[SCOPE.sState('coastal_navy_state').GetName] bölgesindeki [GetPopType('sailors').GetName], limandan yapılacak hiçbir sefere çıkmayı reddetti. İsyanın boyutu, duruma hassas yaklaşılmasını gerektiriyor."
 revolution_pulse1_events.8.f: ""Çok basit. Taleplerimiz var. Bu talepler karşılanana kadar denize açılmıyoruz.""
 revolution_pulse1_events.8.a: "Adamları gözaltına al ve olayı [SCOPE.sState('coastal_navy_state').GetName] ile sınırlı tut."
 revolution_pulse1_events.8.b: "Adamları zorla gemilerine bindir."
 revolution_pulse1_events.8.c: "[GetPopType('sailors').GetName] ile konuşarak çözmeye çalış."
 revolution_lsm_events.1.t: "Devrimciler İsyan Çıkarıyor"
 revolution_lsm_events.1.d: "[SCOPE.gsInterestGroup('lsm_ship_mutiny_ig').GetName] ile bağlantılı olduğu söylenen bir devrimci grup, [SCOPE.sState('lsm_ship_mutiny_state').GetName] bölgesindeki denizcileri etkisiz hâle getirip iki düzine kişiyi öldürdü ve silahlı bir gemiyle denize açıldı."
 revolution_lsm_events.1.f: "#bold Aranıyor: Gemi Hırsızları#! \n\n[SCOPE.sState('coastal_navy_state').GetName] bölgesinde bir geminin çalınmasına 30'dan fazla kişinin karıştığı düşünülüyor. Yakalanan veya öldürülen kişi başına £200; suçluların yakalanmasına veya öldürülmesine yol açan bilgi için £50.\n\nSilahlı ve tehlikeli oldukları düşünülüyor. Yardım edenler de aynı derecede suçlu sayılacaktır."
 revolution_lsm_events.1.a: "Onları bulmak için limanları didik didik ara."
 revolution_lsm_events.1.b: "Bunun yerine balıkçılık bölgelerini ara."
 lsm_events.1.t:0 "Karanlıkta Kaybolanlar"
 lsm_events.1.d:0 "Liman işçilerini taşıyan bir feribot, [SCOPE.sState('lsm_lighthouse_accident_state').GetName] bölgesindeki bir limanın aydınlatılmamış yaklaşımında kayalara çarptı. Yaklaşık 150 liman işçisi boğuldu."
 lsm_events.1.f:0 "Kurtarma ekipleri ölüleri kıyıya çıkarırken yakınları rıhtım boyunca bekliyor. Hayatta kalanlar, mürettebatın karanlıkta yönünü kaybettiğini söylüyor. Yaklaşımı işaretleyen bir deniz feneri olmayınca kayaları çarpışmadan yalnızca birkaç saniye önce fark ettiler."
 lsm_events.1.a:0 "Belki bir şeyler yapılmalı."
 lsm_events.1.deaths_tt:0 "[SCOPE.sState('lsm_lighthouse_accident_state').GetName] bölgesinde yaklaşık #N 150#! liman işçisi öldü."
 modifier_scouring_ports: "Limanları Tarama"
 modifier_scouring_fisheries: "Balıkçılık Bölgelerini Tarama"
 lsm_admirals.1.t:0 "Terfi Zamanı"
 lsm_admirals.1.d:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName], [SCOPE.sCharacter('low_rank_admiral').GetRankName] [SCOPE.sCharacter('low_rank_admiral').GetFullName] için terfi talep ediyor ve [SCOPE.sCharacter('low_rank_admiral').GetHerHis] sadık ve etkili hizmet geçmişini öne sürüyor."
 lsm_admirals.1.f:1 "[SCOPE.sCharacter('low_rank_admiral').GetHerHis] ceketini o kadar çok madalya süslüyordu ki altındaki kumaş neredeyse görünmüyordu, ama yine de yetmemişti. Göğsünü gururla kabartan [SCOPE.sCharacter('low_rank_admiral').GetSheHe], [SCOPE.sCharacter('high_rank_admiral').GetRankName] [SCOPE.sCharacter('high_rank_admiral').GetLastNameNoFormatting]'ın [SCOPE.sCharacter('low_rank_admiral').GetHerHis] yaklaşan yükselişini öğrendiğinde yüzünde oluşacak ifadeyi hayal ederek gülümsedi; aralarındaki rekabet subaylar arasında efsaneydi.\n\nSonunda [SCOPE.sCharacter('low_rank_admiral').GetSheHe], [SCOPE.sCharacter('low_rank_admiral').GetHerHis] hakkını alacaktı."
 lsm_admirals.1.a:0 "[SCOPE.sCharacter('low_rank_admiral').GetFullName] bunu hak etti."
 lsm_admirals.1.b:0 "[SCOPE.gsInterestGroup('low_rank_admiral_ig').GetName] bize zorla karar verdiremez."
 low_rank_admiral_ig_opinion_add:0 "Öne Çıkan Amiral Terfi Ettirildi"
 low_rank_admiral_ig_opinion_remove:0 "Amiralin Terfisi Reddedildi"
 high_rank_admiral_ig_opinion_add:0 "Rakibin Terfisi Engellendi"
 denied_promotion:0 "Terfi Reddedildi"
 lsm_canal_events.1.t:0 "Welland Kanalı'nın Tamamlanması"
 lsm_canal_events.1.d:0 "Yıllarca süren kazı, kanal havuzu inşası ve mühendislik çalışmalarının ardından Welland Kanalı sonunda trafiğe açıldı. Gemiler artık Niagara Şelaleleri'nin büyük engelini aşarak Ontario Gölü'nü yukarı Büyük Göller'e bağlayabiliyor."
 lsm_canal_events.1.f:0 "Kanalın açılması Büyük Göller'i kesintisiz bir ticari su yoluna dönüştürdü. Kereste, tahıl, cevher, mamul mallar ve yolcu taşıyan gemiler artık Niagara çevresinde yük boşaltmadan iç göller ile Ontario Gölü limanları arasında seyredebilir. Bir zamanlar birbirinden ayrı iç denizlerden oluşan bölge, Britanya Kuzey Amerikası ile Amerika Birleşik Devletleri'nin büyüyen yerleşimlerini ve sanayilerini birbirine bağlayan tek bir uluslararası deniz taşımacılığı ağına dönüşüyor."
 lsm_canal_events.1.a:0 "Büyük Göller ticarete açıldı."
 mobilization_option_rail_transport: "Demiryolu Taşımacılığı"
 mobilization_option_rail_transport_desc: "Askerlerinin devlet hesabına trenle seyahat etmesini sağla."
